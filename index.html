<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Predicación Pública · Norte Garín</title>
  <meta name="theme-color" content="#04091a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Predicación · Norte Garín" />
  <meta name="description" content="Programa de predicación pública con exhibidores · Congregación Norte Garín" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #04091a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .card {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger {
      background: rgba(248,113,113,0.15);
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-danger:hover { background: rgba(248,113,113,0.25); }
    .badge-green  { background: rgba(52,211,153,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.3); }
    .badge-yellow { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
    .badge-red    { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
    .block-card {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 14px;
      transition: border-color 0.2s;
    }
    .block-card.my-turn {
      border-color: rgba(96,165,250,0.4);
      background: rgba(96,165,250,0.05);
    }
    .day-header {
      background: #0a1628;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .day-header:hover { background: #0d1f3c; }
    .day-content { display: none; }
    .day-content.open { display: block; }
    .chevron { transition: transform 0.2s; }
    .chevron.open { transform: rotate(180deg); }
    input[type="text"] {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #e2e8f0;
      padding: 10px 14px;
      font-size: 15px;
      width: 100%;
      outline: none;
    }
    input[type="text"]:focus { border-color: #60a5fa; }
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 16px;
    }
    .modal {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 28px 24px;
      width: 100%; max-width: 400px;
    }
    .anotado-pill {
      display: inline-flex; align-items: center;
      background: rgba(96,165,250,0.1);
      border: 1px solid rgba(96,165,250,0.2);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      color: #93c5fd;
      margin: 2px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Name modal -->
<div id="nameModal" class="overlay" style="display:none">
  <div class="modal">
    <h2 class="text-xl font-semibold text-white mb-2">¡Bienvenido!</h2>
    <p class="text-slate-400 text-sm mb-5">Ingresá tu nombre completo para continuar.</p>
    <input type="text" id="nameInput" placeholder="Nombre y apellido" autocomplete="name" />
    <button class="btn-primary w-full mt-4" style="padding:12px" onclick="saveName()">Continuar</button>
  </div>
</div>

<!-- Header -->
<header style="background:#04091a; border-bottom:1px solid rgba(255,255,255,0.06); position:sticky; top:0; z-index:40; padding:12px 16px;">
  <div style="max-width:640px; margin:0 auto; display:flex; align-items:center; justify-content:space-between;">
    <div>
      <div class="text-white font-semibold text-base leading-tight">Predicación Pública</div>
      <div class="text-slate-500 text-xs">Norte Garín</div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div id="userBadge" style="cursor:pointer; background:rgba(96,165,250,0.1); border:1px solid rgba(96,165,250,0.25); border-radius:8px; padding:6px 12px; font-size:13px; color:#93c5fd; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" onclick="showNameModal()" title="Cambiar nombre"></div>
    </div>
  </div>
</header>

<!-- Main -->
<main style="max-width:640px; margin:0 auto; padding:16px;">
  <div id="loadingState" style="text-align:center; padding:60px 0;">
    <div class="spinner" style="width:32px;height:32px;margin:0 auto 12px"></div>
    <div class="text-slate-500 text-sm">Cargando programa...</div>
  </div>
  <div id="appContent" style="display:none;"></div>
</main>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ── Firebase config ──────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey:            "REEMPLAZAR_API_KEY",
    authDomain:        "REEMPLAZAR.firebaseapp.com",
    databaseURL:       "https://REEMPLAZAR-default-rtdb.firebaseio.com",
    projectId:         "REEMPLAZAR",
    storageBucket:     "REEMPLAZAR.appspot.com",
    messagingSenderId: "REEMPLAZAR",
    appId:             "REEMPLAZAR"
  };
  // ─────────────────────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // ── Schedule definition ───────────────────────────────────────────────────────
  const UBICACIONES_SEMANA = ["Hospital Garín", "Estación Garín", "Puente 5"];
  const UBICACION_DOMINGO  = ["Mini Estación Garín"];

  const SCHEDULE = [
    { dia: "Lunes",     bloques: ["07:00-08:00","08:00-09:00","15:00-16:00","16:00-17:00"],                          ubicaciones: UBICACIONES_SEMANA },
    { dia: "Martes",    bloques: ["07:00-08:00","08:00-09:00","09:00-10:00","10:00-11:00","11:00-12:00"],             ubicaciones: UBICACIONES_SEMANA },
    { dia: "Miércoles", bloques: ["15:00-16:00","16:00-17:00","17:00-18:00","18:00-19:00","19:00-20:00"],             ubicaciones: UBICACIONES_SEMANA },
    { dia: "Jueves",    bloques: ["07:00-08:00","08:00-09:00"],                                                       ubicaciones: UBICACIONES_SEMANA },
    { dia: "Viernes",   bloques: ["07:00-08:00","08:00-09:00","17:00-18:00","18:00-19:00","19:00-20:00"],             ubicaciones: UBICACIONES_SEMANA },
    { dia: "Sábado",    bloques: ["07:00-08:00","08:00-09:00"],                                                       ubicaciones: UBICACIONES_SEMANA },
    { dia: "Domingo",   bloques: ["17:00-18:00","18:00-19:00","19:00-20:00"],                                         ubicaciones: UBICACION_DOMINGO  },
  ];

  function turnoId(dia, bloque, ubicacion) {
    const [ini, fin] = bloque.split("-");
    const d = dia.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const u = ubicacion.toLowerCase().replace(/\s+/g,"").normalize("NFD").replace(/[̀-ͯ]/g,"");
    return `${d}_${ini.replace(":","")}_${fin.replace(":","")}_${u}`;
  }

  // ── State ─────────────────────────────────────────────────────────────────────
  let myName = localStorage.getItem("predicacion_nombre") || "";
  let turnosData = {};     // turnoId → { anotados: {pushId: {nombre, timestamp}} }
  const openDays = new Set();

  // ── Name modal ────────────────────────────────────────────────────────────────
  window.saveName = function() {
    const v = document.getElementById("nameInput").value.trim();
    if (!v) return;
    myName = v;
    localStorage.setItem("predicacion_nombre", v);
    document.getElementById("nameModal").style.display = "none";
    document.getElementById("userBadge").textContent = v;
    render();
  };

  window.showNameModal = function() {
    document.getElementById("nameInput").value = myName;
    document.getElementById("nameModal").style.display = "flex";
    setTimeout(() => document.getElementById("nameInput").focus(), 50);
  };

  document.getElementById("nameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") window.saveName();
  });

  // ── Firebase listener ─────────────────────────────────────────────────────────
  const turnosRef = ref(db, "predicacion/turnos");
  onValue(turnosRef, snap => {
    turnosData = snap.val() || {};
    document.getElementById("loadingState").style.display = "none";
    document.getElementById("appContent").style.display = "block";
    render();
  });

  // ── Actions ───────────────────────────────────────────────────────────────────
  window.anotarme = async function(tid) {
    const turno = turnosData[tid] || {};
    const anotados = turno.anotados || {};
    if (Object.keys(anotados).length >= 4) return;
    const turnoRef = ref(db, `predicacion/turnos/${tid}/anotados`);
    await push(turnoRef, { nombre: myName, timestamp: Date.now() });
  };

  window.desanotarme = async function(tid) {
    const turno = turnosData[tid] || {};
    const anotados = turno.anotados || {};
    for (const [pid, val] of Object.entries(anotados)) {
      if (val.nombre === myName) {
        await remove(ref(db, `predicacion/turnos/${tid}/anotados/${pid}`));
        return;
      }
    }
  };

  window.toggleDay = function(dia) {
    if (openDays.has(dia)) openDays.delete(dia);
    else openDays.add(dia);
    render();
  };

  // ── Render ────────────────────────────────────────────────────────────────────
  function render() {
    if (!myName) {
      document.getElementById("nameModal").style.display = "flex";
      return;
    }
    document.getElementById("userBadge").textContent = myName;

    let html = "";
    for (const { dia, bloques, ubicaciones } of SCHEDULE) {
      const isOpen = openDays.has(dia);

      // Count my slots this day
      let myCount = 0;
      for (const ub of ubicaciones) for (const bl of bloques) {
        const tid = turnoId(dia, bl, ub);
        const a = (turnosData[tid]?.anotados) || {};
        if (Object.values(a).some(v => v.nombre === myName)) myCount++;
      }

      html += `
      <div style="margin-bottom:10px;">
        <div class="day-header" onclick="toggleDay('${dia}')">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="text-white font-semibold text-base">${dia}</span>
              ${myCount > 0 ? `<span style="background:rgba(96,165,250,0.15);color:#60a5fa;border:1px solid rgba(96,165,250,0.3);border-radius:20px;padding:2px 10px;font-size:12px;">${myCount} turno${myCount>1?"s":""}</span>` : ""}
            </div>
            <svg class="chevron ${isOpen?"open":""}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="day-content ${isOpen?"open":""}">
          <div style="padding-top:10px; display:flex; flex-direction:column; gap:12px;">
      `;

      for (const ub of ubicaciones) {
        html += `<div><div style="color:#64748b;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding-left:4px;">${ub}</div><div style="display:flex;flex-direction:column;gap:8px;">`;

        for (const bl of bloques) {
          const tid = turnoId(dia, bl, ub);
          const anotados = Object.entries((turnosData[tid]?.anotados) || {});
          const count = anotados.length;
          const isMine = anotados.some(([,v]) => v.nombre === myName);
          const full   = count >= 4;

          let badgeClass = "badge-green";
          let badgeText  = `${4-count} lugar${4-count===1?"":"es"}`;
          if (count === 3) { badgeClass = "badge-yellow"; badgeText = "1 lugar"; }
          if (full)        { badgeClass = "badge-red";    badgeText = "Completo"; }

          const nombres = anotados.sort((a,b)=>a[1].timestamp-b[1].timestamp).map(([,v])=>v.nombre);

          html += `
          <div class="block-card ${isMine?"my-turn":""}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <span style="font-weight:600;color:#e2e8f0;font-size:15px;">${bl.replace("-"," – ")}</span>
              <span class="${badgeClass}" style="border-radius:20px;padding:3px 10px;font-size:12px;font-weight:500;">${badgeText}</span>
            </div>
            <div style="min-height:28px;margin-bottom:10px;">
              ${nombres.length === 0
                ? '<span style="color:#475569;font-size:13px;">Sin anotados aún</span>'
                : nombres.map(n => `<span class="anotado-pill${n===myName?' ' :''}">
                    ${n===myName?'<svg style="width:11px;height:11px;margin-right:3px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>':''}${n}
                  </span>`).join("")
              }
            </div>
            <div style="display:flex;justify-content:flex-end;">
              ${isMine
                ? `<button class="btn-danger" onclick="desanotarme('${tid}')">Desanotarme</button>`
                : full
                  ? `<span style="color:#475569;font-size:13px;">Sin lugares</span>`
                  : `<button class="btn-primary" onclick="anotarme('${tid}')">Anotarme</button>`
              }
            </div>
          </div>`;
        }

        html += `</div></div>`;
      }

      html += `</div></div></div>`;
    }

    document.getElementById("appContent").innerHTML = html;
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  if (!myName) {
    document.getElementById("nameModal").style.display = "flex";
    setTimeout(() => document.getElementById("nameInput").focus(), 50);
  } else {
    document.getElementById("userBadge").textContent = myName;
  }
</script>
</body>
</html>
