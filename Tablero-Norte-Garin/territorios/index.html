<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Territorios · Congregación Norte Garín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#21262d;
    --txt:#e6edf3; --muted:#8b949e; --line:#30363d;
    --accent:#2f9e6f; --accent2:#3fb950; --gold:#d4a373;
    --plaza:#166534;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
  #map{position:absolute;top:0;left:0;right:340px;bottom:0;background:#0b1220}
  .leaflet-container{background:#0b1220;font-family:'Outfit',sans-serif}
  .leaflet-top.leaflet-left{top:72px}
  .leaflet-control-zoom a{background:var(--panel)!important;color:var(--txt)!important;border-color:var(--line)!important}

  /* ===== Encabezado flotante sobre el mapa ===== */
  .topbar{
    position:absolute;top:0;left:0;right:340px;z-index:1000;
    display:flex;align-items:center;gap:14px;padding:16px 20px;
    background:linear-gradient(180deg,rgba(13,17,23,.92),rgba(13,17,23,0));
    pointer-events:none;
  }
  .crest{
    width:44px;height:44px;border-radius:11px;flex:none;pointer-events:auto;
    background:linear-gradient(135deg,var(--accent),#1c6e4b);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(47,158,111,.4);
    font-size:22px;
  }
  .topbar h1{font-family:'Fraunces',serif;font-size:21px;font-weight:600;letter-spacing:.2px;line-height:1.1}
  .topbar .sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;letter-spacing:.3px}

  /* ===== Panel lateral ===== */
  .side{
    position:absolute;top:0;right:0;bottom:0;width:340px;z-index:1200;
    background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:-4px 0 24px rgba(0,0,0,.3)
  }
  .side-head{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
  .side-head .title{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
  .side-head .meta{display:flex;gap:8px;margin-top:12px}
  .chip{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:center}
  .chip .num{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--accent2);line-height:1}
  .chip .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}

  .search{padding:14px 20px;border-bottom:1px solid var(--line)}
  .search input{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
    padding:11px 14px;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:.15s
  }
  .search input:focus{border-color:var(--accent)}
  .search input::placeholder{color:var(--muted)}

  .list{flex:1;overflow-y:auto;padding:10px 14px}
  .list::-webkit-scrollbar{width:8px}
  .list::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:4px}
  .titem{
    display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;
    cursor:pointer;transition:.12s;margin-bottom:3px;border:1px solid transparent
  }
  .titem:hover{background:var(--panel2);border-color:var(--line)}
  .titem.sel{background:rgba(47,158,111,.14);border-color:var(--accent)}
  .titem .sw{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#0d1117}
  .titem .nm{font-size:14px;font-weight:500}
  .titem .nm small{display:block;color:var(--muted);font-size:11px;font-weight:400}
  .titem.plaza .sw{background:var(--plaza)!important;color:#fff;font-size:15px}

  /* ===== Ficha inferior (bottom sheet) ===== */
  .sheet{
    position:absolute;left:0;right:340px;bottom:0;z-index:1100;
    background:linear-gradient(180deg,var(--panel),var(--panel));
    border-radius:20px 20px 0 0;border-top:1px solid var(--line);
    transform:translateY(120%);transition:transform .3s cubic-bezier(.34,1.2,.5,1);
    box-shadow:0 -10px 40px rgba(0,0,0,.55);max-height:60vh;overflow-y:auto;padding:0 22px 26px
  }
  .sheet.open{transform:translateY(0)}
  .grip{width:44px;height:5px;background:var(--line);border-radius:3px;margin:11px auto 16px}
  .sheet-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .terr-num{width:52px;height:52px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:23px;font-weight:700;color:#0d1117;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .sheet-head h2{font-family:'Fraunces',serif;font-size:22px;font-weight:600}
  .sheet-head .tag{font-size:12px;color:var(--muted);margin-top:2px}
  .close-x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--txt);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;transition:.15s}
  .close-x:hover{background:var(--line)}

  .limits{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:16px}
  .lrow{display:flex;gap:10px;font-size:14px;padding:11px 0;border-bottom:1px solid var(--panel2);align-items:center}
  .lrow:last-child{border-bottom:none}
  .lk{color:var(--accent2);font-weight:600;width:58px;flex:none;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .lv{color:var(--txt)}

  .nav-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:linear-gradient(135deg,var(--accent2),var(--accent));color:#04231a;border:none;
    padding:15px;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;
    box-shadow:0 4px 14px rgba(47,158,111,.35);transition:.15s;font-family:inherit}
  .nav-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(47,158,111,.45)}
  .nav-btn2{background:var(--panel2);color:var(--txt);box-shadow:none;border:1px solid var(--line);margin-top:9px;width:100%;font-family:inherit}
  .nav-btn2:hover{background:var(--line);transform:none;box-shadow:none}
  /* Aviso modo revisita */
  .revisita-hint{
    display:none;position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:1500;
    background:#d4a373;color:#1a1205;border:none;border-radius:24px;padding:12px 20px;
    font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.45);font-family:inherit;
    align-items:center;gap:10px;max-width:90vw
  }
  .revisita-hint.show{display:flex}
  .revisita-hint button{background:rgba(0,0,0,.18);border:none;color:#1a1205;border-radius:50%;width:24px;height:24px;font-size:13px;cursor:pointer;flex:none}

  /* Menú de opciones al tocar un punto */
  .pm-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center;padding:0}
  .pm-overlay.show{display:flex}
  .pm-box{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:22px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:pmUp .25s ease}
  @keyframes pmUp{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .pm-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:16px;text-align:center}
  .pm-opt{display:flex;align-items:center;gap:13px;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
    padding:15px 16px;border-radius:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:10px;text-align:left;transition:.15s}
  .pm-opt:hover{background:var(--panel2)}
  .pm-opt span{font-size:22px;flex:none}
  .pm-opt small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
  .pm-opt.nv{border-color:rgba(240,168,104,.4)}
  .pm-opt.nv span{filter:none}
  .pm-cancel{width:100%;background:none;border:none;color:var(--muted);padding:13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:2px}

  .novisitar{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
  .nv-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .nv-head span{font-size:13px;font-weight:600;color:#f0a868}
  .nv-add{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .nv-add:hover{background:var(--line)}
  .nv-lista{display:flex;flex-direction:column;gap:7px}
  .nv-empty{font-size:12px;color:var(--muted);font-style:italic;padding:4px 0}
  .nv-item{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .nv-item .ic{color:#f0a868;flex:none}
  .nv-item .tx{flex:1;font-size:13px}
  .nv-item .rm{background:none;border:none;color:#f85149;cursor:pointer;font-size:15px;flex:none;padding:0 2px}

  /* Etiquetas en el mapa */
  .terr-label{font-weight:700;font-size:15px;color:#0d1117;font-family:'Outfit',sans-serif;
    background:rgba(255,255,255,.88);border:1.5px solid rgba(13,17,23,.3);border-radius:8px;
    width:28px!important;height:28px!important;text-align:center;line-height:26px;
    box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .terr-label span{display:block;width:100%;height:100%}
  .clabel{background:#1d4ed8;color:#fff;border:2px solid rgba(255,255,255,.25);box-shadow:0 2px 8px rgba(0,0,0,.5);font-weight:700;font-size:11px;padding:3px 9px;border-radius:6px;font-family:'Outfit',sans-serif}
  .mz-letra{background:#7c3aed;color:#fff;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);font-family:'Outfit',sans-serif}
  .plaza-label{background:var(--plaza);color:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.5);font-weight:600;font-size:10px;padding:3px 8px;border-radius:6px;font-family:'Outfit',sans-serif}

  /* Pin del Salón del Reino */
  .salon-pin{position:relative;width:34px;height:42px}
  .salon-dot{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    background:linear-gradient(135deg,#d4a373,#b3814f);border:2px solid #fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,.5)}
  .salon-dot::before{content:"✦";transform:rotate(45deg);color:#fff;font-size:16px;font-weight:700}

  /* Leyenda mini */
  .legend{position:absolute;left:16px;bottom:20px;z-index:1000;background:rgba(22,27,34,.92);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:12px;display:flex;flex-direction:column;gap:7px;backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .legend .row{display:flex;align-items:center;gap:8px;color:var(--muted)}
  .legend .ln{width:18px;height:4px;border-radius:2px;display:inline-block}
  .legend .sq{width:13px;height:13px;border-radius:4px;display:inline-block}

  /* Botón flotante para abrir lista (solo móvil) */
  .fab-list{display:none}

  /* Botón Ver todos (aparece cuando hay un territorio resaltado) */
  .fab-clear{
    display:none;position:absolute;top:74px;right:16px;z-index:1160;
    background:rgba(22,27,34,.95);color:var(--txt);border:1px solid var(--line);
    border-radius:24px;padding:10px 16px;font-size:13px;font-weight:600;
    cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.4);backdrop-filter:blur(6px)
  }
  .fab-clear.show{display:block}

  @media(max-width:820px){
    #map{right:0;bottom:0}
    .topbar{right:0;padding:12px 16px;background:linear-gradient(180deg,rgba(13,17,23,.96),rgba(13,17,23,.55) 70%,rgba(13,17,23,0))}
    .topbar h1{font-size:18px}
    .crest{width:38px;height:38px;font-size:19px}

    /* Panel lateral -> hoja deslizable desde abajo */
    .side{
      top:auto;bottom:0;left:0;right:0;width:100%;height:72vh;
      border-left:none;border-top:1px solid var(--line);
      border-radius:20px 20px 0 0;
      transform:translateY(calc(100% - 0px));
      transition:transform .32s cubic-bezier(.34,1.1,.5,1);
      z-index:1300
    }
    .side.open{transform:translateY(0)}
    .side-head{padding-top:8px;position:relative}
    .side-head::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:5px;background:var(--line);border-radius:3px}
    .side-head .title{margin-top:10px}
    .side-close{position:absolute;top:14px;right:18px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer}

    /* Botón flotante */
    .fab-list{
      display:flex;align-items:center;gap:9px;
      position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:1150;
      background:linear-gradient(135deg,var(--accent2),var(--accent));color:#04231a;
      border:none;border-radius:30px;padding:14px 22px;font-size:15px;font-weight:700;
      box-shadow:0 6px 20px rgba(47,158,111,.5);cursor:pointer;font-family:inherit
    }
    .legend{bottom:88px;left:12px;font-size:11px;padding:9px 11px}

    /* Ficha de territorio a pantalla completa de ancho */
    .sheet{right:0;max-height:78vh;z-index:1400}
    .terr-num{width:48px;height:48px;font-size:21px}
    .sheet-head h2{font-size:20px}

    /* Toques más grandes en la lista */
    .titem{padding:13px 12px}
    .titem .sw{width:36px;height:36px;font-size:15px}
    .titem .nm{font-size:15px}
    .nav-btn{padding:17px;font-size:16px}
    .nv-add{padding:9px 14px;font-size:13px}
    .list{padding:8px 12px 30px}
  }

  /* Ocultar botón cerrar del panel en escritorio */
  .side-close{display:none}
  @media(max-width:820px){ .side-close{display:block} }
</style>
</head>
<body>
<div id="map"></div>
<div class="revisita-hint" id="revisitaHint">
  <span>👆 Tocá el punto exacto en el mapa</span>
  <button onclick="cancelarRevisita()">✕</button>
</div>

<div class="pm-overlay" id="puntoMenu">
  <div class="pm-box">
    <div class="pm-title">¿Qué querés hacer con este punto?</div>
    <button class="pm-opt" onclick="pmComoLlegar()"><span>📍</span> Cómo llegar (Google Maps)</button>
    <button class="pm-opt" onclick="pmMiRevisita()"><span>📌</span> Guardar mi revisita<small>Se abre en tu Google Maps, privado</small></button>
    <button class="pm-opt nv" onclick="pmNoVisitar()"><span>🚫</span> Enviar "No visitar" al encargado<small>Abre WhatsApp con la ubicación</small></button>
    <button class="pm-cancel" onclick="cerrarMenuPunto()">Cancelar</button>
  </div>
</div>
<button class="fab-list" onclick="abrirLista()">☰ Ver territorios</button>
<button id="verTodos" class="fab-clear" onclick="verTodos()">↺ Ver todos</button>

<div class="topbar">
  <a class="crest" href="/" title="Volver al tablero" style="color:inherit;text-decoration:none">✦</a>
  <div>
    <h1>Mapa de Territorios</h1>
    <div class="sub">CONGREGACIÓN NORTE GARÍN</div>
  </div>
</div>



<div class="side">
  <div class="side-head">
    <button class="side-close" onclick="cerrarLista()">✕</button>
    <div class="title">Territorios</div>
  </div>
  <div class="search"><input id="buscar" type="text" placeholder="Buscar territorio por número…" inputmode="numeric"></div>
  <div class="list" id="lista"></div>
</div>

<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sheet-head">
    <div class="terr-num" id="shNum">0</div>
    <div>
      <h2 id="shTitle">Territorio</h2>
      <div class="tag" id="shTag">Zona de predicación</div>
    </div>
    <button class="close-x" onclick="closeSheet()">✕</button>
  </div>
  <div class="novisitar">
    <div class="nv-head">
      <span>🚫 Direcciones a no visitar</span>
      <button class="nv-add" onclick="agregarNoVisitar()">+ Agregar</button>
    </div>
    <div id="nvLista" class="nv-lista"></div>
  </div>
  <a class="nav-btn" id="navBtn" target="_blank" rel="noopener">📍 Cómo llegar (Google Maps)</a>
  <button class="nav-btn nav-btn2" id="revisitaBtn" onclick="activarRevisita()">📌 Marcar un punto en el territorio</button>
</div>

<script>
if(typeof L==='undefined'){
  document.getElementById('map').innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:30px;color:#8b949e">No se pudo cargar el mapa.<br><br><b style="color:#e6edf3">Descargá el archivo y abrilo en tu navegador.</b></div>';
  throw new Error('Leaflet bloqueado');
}

const PALETA=['#e6194b','#3cb44b','#ffe119','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6',
'#bfef45','#fabed4','#469990','#dcbeff','#9a6324','#d9c08a','#e07a5f','#aaffc3',
'#a8a832','#ffd8b1','#6a8caf','#a9a9a9','#c9a0dc','#1b9e77','#d95f02','#7570b3',
'#e7298a','#66a61e','#e6ab02','#a6761d','#888888','#1f78b4','#33a02c','#fb9a99',
'#fdbf6f','#cab2d6','#6a3d9a','#b15928','#8dd3c7','#bebada','#fb8072','#80b1d3',
'#fdb462','#b3de69','#e6a0c4','#bc80bd','#9fd9b4','#dcd06f','#bdb76b','#fa8174',
'#81b1d2','#c9b458','#bfbbd9','#cd853f','#9acd32','#ba80bd','#d4c95f','#7ba05b',
'#ff69b4','#5f9ea0','#daa520'];
function colorTerr(num){ return PALETA[(num-1)%PALETA.length]; }

// Letras de manzana: se guardan y se muestran SOLO al seleccionar un territorio
let LETRAS_DATA=(typeof LETRAS!=='undefined' && Array.isArray(LETRAS))?LETRAS:[];
const letraLayers=[]; // capas activas mostradas al seleccionar

function puntoEnPolo(lat,lng,poly){
  // ray casting: poly es array [lat,lng]
  let dentro=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0], xi=poly[i][1], yj=poly[j][0], xj=poly[j][1];
    const inter=((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi);
    if(inter) dentro=!dentro;
  }
  return dentro;
}
function mostrarLetrasDe(t){
  ocultarLetras();
  LETRAS_DATA.forEach(l=>{
    if(puntoEnPolo(l.lat,l.lng,t.poly)){
      const m=L.marker([l.lat,l.lng],{icon:L.divIcon({className:'',html:'<div class="mz-letra">'+l.letra+'</div>',iconSize:[20,20],iconAnchor:[10,10]}),interactive:false,zIndexOffset:500}).addTo(map);
      letraLayers.push(m);
    }
  });
}
function ocultarLetras(){
  letraLayers.forEach(m=>map.removeLayer(m));
  letraLayers.length=0;
}

function styleFor(t){
  if(esPlaza(t)) return {color:'#0a2e18',weight:1.5,fillColor:'#15803d',fillOpacity:.78,pane:'terrPane'};
  const col=colorTerr(t.num);
  return {color:col,weight:1.5,opacity:.7,fillColor:col,fillOpacity:.22,pane:'terrPane'};
}

const layers={}; let current=null; let modoRevisita=false;
let nTerr=0,nPlaza=0;
const lista=document.getElementById('lista');

const ordenados=TERRITORIOS.slice().sort((a,b)=>a.num-b.num);
ordenados.forEach(t=>{
  const pg=L.polygon(t.poly,styleFor(t)).addTo(map);
  const c=pg.getBounds().getCenter();
  if(esPlaza(t)){
    nPlaza++;
    pg.bindTooltip(PLAZAS[t.num],{permanent:true,direction:'center',className:'plaza-label'});
    layers['p'+t.num]=pg;
    addItem(t,true);
    return;
  }
  nTerr++;
  pg.on('click',(e)=>{ if(modoRevisita){ if(e.originalEvent) L.DomEvent.stop(e); abrirMenuPunto(e.latlng.lat,e.latlng.lng); cancelarRevisita(); return; } if(e.originalEvent) L.DomEvent.stop(e); openSheet(t); });
  L.marker(c,{icon:L.divIcon({className:'terr-label',html:'<span>'+t.num+'</span>',iconSize:[28,28],iconAnchor:[14,14]})})
    .addTo(map).on('click',(e)=>{ if(e.originalEvent) L.DomEvent.stop(e); openSheet(t); });
  layers[t.num]=pg;
  addItem(t,false);
});
if(Object.keys(layers).length){
  map.fitBounds(L.featureGroup(Object.values(layers)).getBounds(),{padding:[50,50]});
}

// Botón para volver la orientación al Norte
const btnNorte=L.control({position:'topleft'});
btnNorte.onAdd=function(){

  L.DomEvent.disableClickPropagation(d);
  d.onclick=function(e){ e.preventDefault(); if(map.setBearing) map.setBearing(0); };
  return d;
};
btnNorte.addTo(map);

function addItem(t,plaza){
  const d=document.createElement('div');
  d.className='titem'+(plaza?' plaza':'');
  d.dataset.num=t.num;
  const col=plaza?'#166534':colorTerr(t.num);
  const label=plaza?'▦':t.num;
  const name=plaza?PLAZAS[t.num]:('Territorio '+t.num);
  const sub=plaza?'Espacio verde':'Zona de predicación';
  d.innerHTML='<span class="sw" style="background:'+col+'">'+label+'</span>'+
    '<span class="nm">'+name+'<small>'+sub+'</small></span>';
  if(!plaza) d.onclick=()=>{ cerrarLista(); openSheet(t); flyTo(t); };
  else d.onclick=()=>{ cerrarLista(); flyTo(t); };
  lista.appendChild(d);
}

function flyTo(t){
  const lay=layers[t.num]||layers['p'+t.num];
  if(lay) map.flyToBounds(lay.getBounds(),{padding:[80,80],maxZoom:17,duration:.6});
}

const sheet=document.getElementById('sheet');
let prevSel=null;

function atenuarTodos(exceptoNum){
  ordenados.forEach(t=>{
    const lay=layers[t.num]||layers['p'+t.num];
    if(!lay) return;
    if(t.num===exceptoNum){
      const col=esPlaza(t)?'#166534':colorTerr(t.num);
      lay.setStyle({color:'#0d1117',weight:3,opacity:1,fillColor:col,fillOpacity:.62,pane:'terrPane'});
      lay.bringToFront();
    }else{
      lay.setStyle({color:'#9ca3af',weight:.8,opacity:.4,fillColor:'#9ca3af',fillOpacity:.12,pane:'terrPane'});
    }
  });
  document.getElementById('verTodos').classList.add('show');
}
function restaurarTodos(){
  ordenados.forEach(t=>{
    const lay=layers[t.num]||layers['p'+t.num];
    if(lay) lay.setStyle(styleFor(t));
  });
}
function verTodos(){
  restaurarTodos();
  ocultarLetras();
  prevSel=null;
  document.getElementById('verTodos').classList.remove('show');
  document.querySelectorAll('.titem').forEach(el=>el.classList.remove('sel'));
}

function openSheet(t){
  current=t;
  const col=colorTerr(t.num);
  atenuarTodos(t.num);
  prevSel=t.num;
  document.getElementById('shNum').textContent=t.num;
  document.getElementById('shNum').style.background=col;
  document.getElementById('shTitle').textContent='Territorio '+t.num;
  document.getElementById('navBtn').href='https://www.google.com/maps/dir/?api=1&destination='+t.inicio[0]+','+t.inicio[1];
  // No visitar
  cargarNoVisitar(t.num);
  // Letras de manzana de este territorio
  mostrarLetrasDe(t);
  sheet.classList.add('open');
  document.querySelector('.fab-list').style.display='none';
  document.querySelectorAll('.titem').forEach(el=>el.classList.toggle('sel',el.dataset.num==t.num));
}
function closeSheet(){ sheet.classList.remove('open'); current=null; document.querySelector('.fab-list').style.display=''; }

const WHATSAPP_ENCARGADO='5491144465019';
let puntoActual=null;

function activarRevisita(){
  modoRevisita=true;
  sheet.classList.remove('open');
  document.getElementById('revisitaHint').classList.add('show');
  document.querySelector('.fab-list').style.display='none';
  if(map.getContainer()) map.getContainer().style.cursor='crosshair';

function cancelarRevisita(){
  modoRevisita=false;
  document.getElementById('revisitaHint').classList.remove('show');
  document.querySelector('.fab-list').style.display='';
  if(map.getContainer()) map.getContainer().style.cursor='';
}
map.on('click',function(e){
  if(!modoRevisita) return;
  abrirMenuPunto(e.latlng.lat, e.latlng.lng);
  cancelarRevisita();
});

function abrirMenuPunto(lat,lng){
  puntoActual={lat:lat.toFixed(6),lng:lng.toFixed(6)};
  document.getElementById('puntoMenu').classList.add('show');
}
function cerrarMenuPunto(){
  document.getElementById('puntoMenu').classList.remove('show');
  puntoActual=null;
}
function pmComoLlegar(){
  window.open('https://www.google.com/maps/dir/?api=1&destination='+puntoActual.lat+','+puntoActual.lng,'_blank');
  cerrarMenuPunto();
}
function pmMiRevisita(){
  window.open('https://www.google.com/maps/search/?api=1&query='+puntoActual.lat+','+puntoActual.lng,'_blank');
  cerrarMenuPunto();
}
function pmNoVisitar(){
  const link='https://www.google.com/maps/search/?api=1&query='+puntoActual.lat+','+puntoActual.lng;
  const texto='🚫 *No visitar*\n\nUbicación: '+link+'\n\nComentario: ';
  window.open('https://wa.me/'+WHATSAPP_ENCARGADO+'?text='+encodeURIComponent(texto),'_blank');
  cerrarMenuPunto();
}

/* ===== No visitar (guardado local por territorio) ===== */
const STORE_NV='garin_novisitar_v1';
let _nvMem=null;
function getNV(){
  if(_nvMem!==null) return _nvMem;
  try{ return JSON.parse(localStorage.getItem(STORE_NV))||{}; }catch(e){ _nvMem={}; return _nvMem; }
}
function setNV(obj){
  _nvMem=obj;
  try{ localStorage.setItem(STORE_NV,JSON.stringify(obj)); }catch(e){}
}

function cargarNoVisitar(num){
  const data=getNV();
  const lista=data[num]||[];
  const cont=document.getElementById('nvLista');
  if(!lista.length){ cont.innerHTML='<div class="nv-empty">Sin direcciones marcadas.</div>'; return; }
  cont.innerHTML='';
  lista.forEach((dir,i)=>{
    const d=document.createElement('div');
    d.className='nv-item';
    d.innerHTML='<span class="ic">⚠</span><span class="tx"></span><button class="rm" title="Quitar">✕</button>';
    d.querySelector('.tx').textContent=dir;
    d.querySelector('.rm').onclick=()=>{ quitarNoVisitar(num,i); };
    cont.appendChild(d);
  });
}
function agregarNoVisitar(){
  if(!current) return;
  const dir=prompt('Dirección a NO visitar (ej: Falco 1234, casa de rejas verdes):');
  if(!dir||!dir.trim()) return;
  const data=getNV();
  if(!data[current.num]) data[current.num]=[];
  data[current.num].push(dir.trim());
  setNV(data);
  cargarNoVisitar(current.num);
}
function quitarNoVisitar(num,i){
  const data=getNV();
  if(data[num]){ data[num].splice(i,1); if(!data[num].length) delete data[num]; setNV(data); }
  cargarNoVisitar(num);
}
