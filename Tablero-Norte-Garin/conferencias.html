<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arreglos de Conferencia | Norte Garín</title>

    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDark = saved ? saved === "dark" : prefersDark;
        if (useDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-main: #f1f5f9;
        --bg-card: #ffffff;
        --border: rgba(0, 0, 0, 0.08);
        --accent: #10b981;
        --accent-soft: rgba(16, 185, 129, 0.12);
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --header-bg: rgba(241, 245, 249, 0.78);
        --btn-bg: rgba(255, 255, 255, 0.85);
        --shadow: 0 20px 50px rgba(2, 6, 23, 0.12);
        --btn-shadow: 0 10px 25px rgba(2, 6, 23, 0.12);
        --card-bg: rgba(2, 6, 23, 0.03);
      }

      html.dark {
        --bg-main: #0a0f1d;
        --bg-card: #121a2a;
        --border: rgba(255, 255, 255, 0.06);
        --accent: #34d399;
        --accent-soft: rgba(16, 185, 129, 0.1);
        --text-primary: #f8fafc;
        --text-muted: #94a3b8;
        --header-bg: rgba(10, 15, 29, 0.75);
        --btn-bg: rgba(18, 26, 42, 0.78);
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
        --btn-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        --card-bg: rgba(255, 255, 255, 0.03);
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text-primary);
        margin: 0;
        background-color: var(--bg-main);
      }
      .page-bg {
        min-height: 100vh;
        background-image: radial-gradient(
          900px 500px at 50% -10%,
          rgba(16, 185, 129, 0.16),
          transparent 60%
        );
        padding-bottom: 40px;
      }

      header.topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--header-bg);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        padding: 8px;
      }

      .btn-header {
        background: var(--btn-bg);
        border: 1px solid var(--border);
        color: var(--text-primary);
        border-radius: 14px;
        padding: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--btn-shadow);
        transition: transform 0.1s ease;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-header:active { transform: scale(0.95); }

      .hero-banner {
        position: relative;
        width: 100%;
        height: 168px;
        border-radius: 26px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .hero-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.8) 0%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.6) 100%
        );
      }

      /* ===== SIDEBAR (como Inicio) ===== */
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        z-index: 90;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      #overlay.show {
        opacity: 1;
        pointer-events: auto;
      }
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 18rem;
        z-index: 100;
        transform: translateX(-110%);
        transition: transform 0.28s ease;
        background: var(--bg-card);
        border-right: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 26px;
      }
      #sidebar.open { transform: translateX(0); }

      .nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-radius: 18px;
        color: var(--text-muted);
        transition: all 0.2s ease;
        font-weight: 700;
      }
      .nav-link:hover { background: rgba(2, 6, 23, 0.04); }
      html.dark .nav-link:hover { background: rgba(255, 255, 255, 0.05); }

      .nav-link.active {
        background: rgba(16, 185, 129, 0.14);
        color: var(--accent);
        font-weight: 900;
        border: 1px solid rgba(16, 185, 129, 0.22);
      }

      /* ===== CONTENIDO ===== */
      .month-section {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 35px;
        margin-bottom: 2rem;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .month-header {
        background: var(--accent-soft);
        padding: 1.25rem;
        border-bottom: 1px solid var(--border);
        text-align: center;
      }
      .month-title {
        font-weight: 900;
        font-size: 1.1rem;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 25px;
        padding: 1.1rem;
        margin: 1rem;
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      .is-current {
        border: 2px solid var(--accent);
        background: var(--accent-soft);
        transform: scale(1.02);
      }

      .date-circle {
        background: var(--accent);
        color: white;
        min-width: 50px;
        height: 50px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 1.3rem;
        box-shadow: 0 8px 15px rgba(16, 185, 129, 0.25);
      }
      .info h3 {
        margin: 0 0 4px 0;
        font-size: 1.05rem;
        font-weight: 900;
        line-height: 1.2;
      }
      .details {
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.5;
      }
      .details b {
        color: var(--accent);
        font-weight: 800;
        text-transform: uppercase;
        font-size: 0.7rem;
        margin-right: 4px;
      }
      .badge-next {
        background: #ef4444;
        color: white;
        font-size: 0.6rem;
        font-weight: 900;
        padding: 2px 8px;
        border-radius: 6px;
        text-transform: uppercase;
        display: inline-block;
        margin-bottom: 4px;
      }

      .salen-title {
        font-weight: 900;
        color: var(--accent);
        font-size: 0.8rem;
        padding: 0 1.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .salen-item {
        font-size: 0.85rem;
        padding: 10px 15px;
        background: var(--card-bg);
        border-radius: 15px;
        border: 1px solid var(--border);
        margin: 0.5rem 1rem;
      }

      .alert {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 16px;
        margin-top: 14px;
      }
      .alert h3 {
        margin: 0 0 8px 0;
        font-weight: 900;
      }
      .alert p {
        margin: 0;
        color: var(--text-muted);
        font-weight: 700;
        font-size: 0.95rem;
      }
    </style>
  </head>

  <body class="page-bg">
    <!-- Overlay + Sidebar -->
    <div id="overlay"></div>

    <aside id="sidebar" aria-label="Menú">
      <div class="flex items-center gap-3 mb-10">
        <div
          class="h-10 w-10 rounded-2xl flex items-center justify-center font-black"
          style="background: rgba(16,185,129,0.18); color: var(--accent);"
        >
          ✦
        </div>
        <div>
          <h2 class="font-extrabold leading-tight">Norte Garín</h2>
          <p class="text-[10px] opacity-60 uppercase font-bold tracking-widest">
            Digital Board
          </p>
        </div>
      </div>

      <nav class="space-y-2">
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="salidas.html" class="nav-link">Salidas</a>
        <a href="vida-ministerio.html" class="nav-link">Vida y Ministerio</a>
        <a href="conferencias.html" class="nav-link active">Discursos</a>
        <a href="multimedia.html" class="nav-link">Multimedia</a>
        <a href="lectores.html" class="nav-link">Lectores</a>
        <a href="limpieza.html" class="nav-link">Limpieza</a>
        <a href="grupos.html" class="nav-link">Grupos</a>
        <a href="proximos-eventos.html" class="nav-link">Próximos eventos</a>
      </nav>
    </aside>

    <header class="topbar">
      <div class="max-w-md mx-auto">
        <div class="hero-banner">
          <img src="img/discursos.png" alt="Conferencias" />
          <div class="hero-overlay"></div>

          <div class="absolute inset-0 p-4 flex flex-col justify-between">
            <div class="flex justify-between items-center">
              <!-- BOTÓN MENÚ (izquierda) -->
              <button id="btnMenu" class="btn-header" type="button" aria-label="Abrir menú">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="4" x2="20" y1="12" y2="12"></line>
                  <line x1="4" x2="20" y1="6" y2="6"></line>
                  <line x1="4" x2="20" y1="18" y2="18"></line>
                </svg>
              </button>

              <!-- TEMA (derecha) -->
              <button id="btnTheme" class="btn-header" type="button" aria-label="Cambiar tema">
                <span id="theme-icon">🌙</span>
              </button>
            </div>

            <div class="text-white">
              <h1 class="text-2xl font-black uppercase tracking-tighter drop-shadow-lg">
                Conferencias
              </h1>
              <p class="text-[10px] font-black uppercase tracking-[0.2em] text-emerald-400 drop-shadow-md">
                Programa 2026
              </p>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="max-w-md mx-auto px-4 mt-6">
      <main id="mainContainer"></main>
      <div id="dataError" class="alert hidden"></div>
    </div>

    <!-- Datos externos (igual que vos lo tenés) -->
    <script src="conferencias-data.js"></script>

    <script>
      // === TEMA ===
      const html = document.documentElement;
      const themeIcon = document.getElementById("theme-icon");

      function syncThemeIcon() {
        themeIcon.textContent = html.classList.contains("dark") ? "☀️" : "🌙";
      }
      function toggleTheme() {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        syncThemeIcon();
      }
      document.getElementById("btnTheme").addEventListener("click", toggleTheme);
      syncThemeIcon();

      // === SIDEBAR ===
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      function openMenu() {
        sidebar.classList.add("open");
        overlay.classList.add("show");
        document.body.style.overflow = "hidden";
      }
      function closeMenu() {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
        document.body.style.overflow = "";
      }
      document.getElementById("btnMenu").addEventListener("click", openMenu);
      overlay.addEventListener("click", closeMenu);

      // Cierra con Escape (por si abrís desde PC)
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });

      // === RENDER ===
      function parseDate(y, mIdx, dStr) {
        const d = parseInt(dStr, 10);
        const dt = new Date(y, mIdx, d);
        dt.setHours(0, 0, 0, 0);
        return dt;
      }

      function showDataError(msg) {
        const el = document.getElementById("dataError");
        el.classList.remove("hidden");
        el.innerHTML = `<h3>No se pudieron cargar los datos</h3><p>${msg}</p>`;
      }

      function render() {
        const data = window.CONFERENCIAS_DATA || [];
        if (!Array.isArray(data) || data.length === 0) {
          showDataError("Falta <b>conferencias-data.js</b> o <b>CONFERENCIAS_DATA</b> está vacío.");
          return;
        }

        const container = document.getElementById("mainContainer");
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        let foundNext = false;

        container.innerHTML = data
          .map((m) => {
            const vienenHtml = (m.vienen || [])
              .map((v) => {
                const itemDate = parseDate(m.year, m.monthIdx, v.date);
                const isPast = itemDate < now;

                let isNext = false;
                if (!isPast && !foundNext) {
                  isNext = true;
                  foundNext = true;
                }

                return `
                  <article class="card ${isNext ? "is-current" : ""}" style="${
                    isPast ? "opacity:0.45; filter: grayscale(1);" : ""
                  }">
                    <div class="date-circle">${v.date}</div>
                    <div class="info">
                      ${isNext ? '<span class="badge-next">Próxima reunión</span>' : ""}
                      <h3>${v.title}</h3>
                      <div class="details">
                        <p><b>Orador:</b> ${v.speaker}</p>
                        <p><b>Congregación:</b> ${v.congregation}</p>
                        <p><b>Preside:</b> ${v.chairman}</p>
                        <p class="mt-1 font-bold text-emerald-500">${v.day} – ${v.time}</p>
                      </div>
                    </div>
                  </article>
                `;
              })
              .join("");

            const salen = m.salen || [];
            const salenTitle = salen.length
              ? `<div class="salen-title mt-2">Discursantes que salen</div>`
              : "";

            const salenHtml = salen
              .map(
                (s) => `
                <div class="salen-item">
                  <span class="font-bold">${s.day} ${s.date}:</span> ${s.name}
                  <span class="opacity-60 text-xs ml-1">(${s.extra})</span>
                </div>
              `,
              )
              .join("");

            return `
              <section class="month-section">
                <header class="month-header"><h2 class="month-title">${m.month}</h2></header>
                <div class="vienen-list">${vienenHtml}</div>
                ${salenTitle}
                <div class="pb-4">${salenHtml}</div>
              </section>
            `;
          })
          .join("");

        setTimeout(() => {
          const nextItem = document.querySelector(".is-current");
          if (nextItem) nextItem.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 350);
      }

      document.addEventListener("DOMContentLoaded", render);
    </script>
  </body>
</html>
