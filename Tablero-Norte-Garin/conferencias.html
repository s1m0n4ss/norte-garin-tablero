      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved ? saved === "dark" : prefersDark) document.documentElement.classList.add("dark");

    <style>
      :root {
        --bg: #f7f5f0;
        --bg-card: #ffffff;
        --bg-card2: #f0ede8;
        --text: #1a1714;
        --text-muted: #8a8075;
        --accent: #2d6a4f;
        --accent-light: #52b788;
        --accent-warm: #d4a853;
        --border: rgba(26,23,20,0.09);
        --shadow-sm: 0 2px 12px rgba(26,23,20,0.07);
        --shadow-md: 0 8px 32px rgba(26,23,20,0.10);
        --shadow-lg: 0 24px 64px rgba(26,23,20,0.13);
      }
      html.dark {
        --bg: #1e2023; --bg-card: #272b2f; --bg-card2: #2f3338;
        --text: #eceae6; --text-muted: #8a8d92;
        --accent: #4caf80; --accent-light: #6fcf97; --accent-warm: #d4a853;
        --border: rgba(255,255,255,0.08);
        --shadow-sm: 0 2px 12px rgba(0,0,0,0.15);
        --shadow-md: 0 8px 32px rgba(0,0,0,0.20);
        --shadow-lg: 0 24px 64px rgba(0,0,0,0.28);
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg); color: var(--text);
        margin: 0; padding-bottom: env(safe-area-inset-bottom, 48px);
        overflow-x: hidden;
      }
      body::before {
        content: ''; position: fixed; inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none; z-index: 0; opacity: 0.6;
      }
      .syne { font-family: "Syne", sans-serif; }

      /* ── SIDEBAR ── */
      #sidebar {
        position: fixed; top: 0; left: 0; height: 100%; width: 300px;
        background: var(--bg-card); border-right: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        transform: translateX(-100%);
        transition: transform 0.38s cubic-bezier(0.4,0,0.2,1);
        z-index: 200; overflow-y: auto;
      }
      #sidebar.open { transform: translateX(0); }
      .sidebar-header { padding: 32px 28px 24px; border-bottom: 1px solid var(--border); }
      .sidebar-logo { display: flex; align-items: center; gap: 14px; }
      .logo-mark { width: 44px; height: 44px; background: var(--accent); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .sidebar-nav { padding: 20px 16px; }
      .nav-section-label {
        font-family: "Syne", sans-serif; font-size: 9px; font-weight: 700;
        letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
        padding: 0 12px; margin-bottom: 8px; margin-top: 16px;
      }
      .nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 13px 16px; border-radius: 14px;
        color: var(--text-muted); text-decoration: none;
        font-size: 14.5px; font-weight: 500;
        transition: all 0.18s ease; margin-bottom: 2px;
      }
      .nav-item:hover { background: var(--bg-card2); color: var(--text); }
      .nav-item.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 700; }
      .nav-item .icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--bg-card2); }
      .nav-item.active .icon { background: color-mix(in srgb, var(--accent) 15%, transparent); }

      /* ── OVERLAY ── */
      #overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.45);
        backdrop-filter: blur(4px); z-index: 199;
        opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      }
      #overlay.visible { opacity: 1; pointer-events: all; }

      /* ── HERO ── */
      .hero-wrap { position: relative; width: 100%; height: 220px; overflow: hidden; }
      .hero-img { width: 100%; height: 100%; object-fit: cover; transition: transform 8s ease; }
      .hero-wrap:hover .hero-img { transform: scale(1.04); }
      .hero-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.02) 40%, rgba(0,0,0,0.55) 100%); }
      .hero-top-bar {
        position: absolute; top: 0; left: 0; right: 0;
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top));
      }
      .hero-content { position: absolute; bottom: 20px; left: 24px; right: 24px; }
      .hero-title { font-family: "Syne", sans-serif; font-size: 32px; font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; color: #fff; text-transform: uppercase; }
      .hero-sub { color: rgba(255,255,255,0.6); font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 4px; }
      .icon-btn {
        width: 42px; height: 42px; border-radius: 13px;
        background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.25);
        backdrop-filter: blur(10px); color: #fff;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.15s ease; flex-shrink: 0;
      }
      .icon-btn:active { transform: scale(0.92); }

      /* ── MAIN ── */
      .main-wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; position: relative; z-index: 1; }

      /* ── MONTH DIVIDER ── */
      .month-divider { display: flex; align-items: center; gap: 12px; margin: 28px 0 16px; }
      .month-divider-line { flex: 1; height: 1px; background: var(--border); }
      .month-divider-label { font-family: "Syne", sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }

      /* ── CONFERENCE CARD ── */
      .conf-card {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 20px; overflow: hidden;
        box-shadow: var(--shadow-sm); margin-bottom: 10px;
        transition: all 0.2s ease;
        animation: fadeUp 0.4s ease both;
      }
      @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

      .conf-card.is-next {
        border-color: color-mix(in srgb, var(--accent) 40%, transparent);
        box-shadow: 0 4px 24px color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .conf-card.is-past { opacity: 0.45; filter: grayscale(0.6); }

      .conf-card-inner { display: flex; gap: 0; }

      .conf-date {
        width: 58px; flex-shrink: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        padding: 16px 0; gap: 2px;
      }
      .conf-card.is-next .conf-date { background: var(--accent); }
      .conf-date .day-num {
        font-family: "Syne", sans-serif; font-size: 24px; font-weight: 700;
        color: var(--accent); line-height: 1;
      }
      .conf-card.is-next .conf-date .day-num { color: #fff; }
      .conf-date .day-dow {
        font-size: 9px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.08em; color: var(--accent); opacity: 0.7;
      }
      .conf-card.is-next .conf-date .day-dow { color: rgba(255,255,255,0.75); opacity: 1; }

      .conf-body { flex: 1; padding: 14px 16px; }
      .conf-next-badge {
        display: inline-block; font-family: "Syne", sans-serif;
        font-size: 8px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
        background: var(--accent); color: #fff;
        padding: 3px 8px; border-radius: 6px; margin-bottom: 6px;
      }
      .conf-title {
        font-family: "Syne", sans-serif; font-size: 14px; font-weight: 700;
        line-height: 1.25; color: var(--text); margin-bottom: 8px;
      }
      .conf-meta { display: flex; flex-direction: column; gap: 3px; }
      .conf-meta-row { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
      .conf-meta-label {
        font-family: "Syne", sans-serif; font-size: 8px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.1em;
        color: var(--accent); flex-shrink: 0; min-width: 60px;
      }
      .conf-meta-value { color: var(--text-muted); font-weight: 500; }
      .conf-time { font-family: "Syne", sans-serif; font-size: 11px; font-weight: 600; color: var(--accent-warm); margin-top: 6px; }

      .conf-card.special .conf-date { background: color-mix(in srgb, var(--accent-warm) 15%, transparent); }
      .conf-card.special .conf-date .day-num { color: var(--accent-warm); }
      .conf-card.special .conf-date .day-dow { color: var(--accent-warm); }
      .conf-card.special.is-next .conf-date { background: var(--accent-warm); }
      .conf-card.special.is-next .conf-date .day-num { color: #fff; }
      .conf-card.special.is-next .conf-date .day-dow { color: rgba(255,255,255,0.75); }
      .conf-card.special .conf-title { color: var(--accent-warm); }
      .conf-card.special.is-next { border-color: color-mix(in srgb, var(--accent-warm) 40%, transparent); box-shadow: 0 4px 24px color-mix(in srgb, var(--accent-warm) 14%, transparent); }
      .conf-card.special.is-next .conf-next-badge { background: var(--accent-warm); }

      .salen-wrap {
        margin-top: 8px;
        background: var(--bg-card2); border: 1px solid var(--border);
        border-radius: 18px; overflow: hidden;
      }
      .salen-header {
        padding: 12px 16px; border-bottom: 1px solid var(--border);
        font-family: "Syne", sans-serif; font-size: 10px; font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted);
      }
      .salen-item { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
      .salen-item:last-child { border-bottom: none; }
      .salen-date { font-family: "Syne", sans-serif; font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
      .salen-name { font-weight: 500; color: var(--text); }
      .salen-extra { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    </style>

  </head>

    <script>
      const html = document.documentElement;
      const iconMoon = document.getElementById("theme-icon-moon");
      const iconSun  = document.getElementById("theme-icon-sun");

      function applyThemeIcons() {
        const dark = html.classList.contains("dark");
        iconMoon.style.display = dark ? "none"  : "block";
        iconSun.style.display  = dark ? "block" : "none";
      }
      applyThemeIcons();

      document.getElementById("btnTheme").onclick = () => {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        applyThemeIcons();
      };

      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      document.getElementById("btnMenu").onclick = () => {
        sidebar.classList.add("open");
        overlay.classList.add("visible");
      };

      overlay.onclick = () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("visible");
      };

      function esc(s) {
        return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      }

      function parseDate(y, mIdx, dStr) {
        const dt = new Date(y, mIdx, parseInt(dStr, 10));
        dt.setHours(0,0,0,0);
        return dt;
      }

      function render() {
        const data = window.CONFERENCIAS_DATA || [];
        const container = document.getElementById("mainContainer");

        if (!Array.isArray(data) || !data.length) {
          container.innerHTML = `<p style="color:var(--text-muted);text-align:center;padding:48px 0">No se pudieron cargar los datos.</p>`;
          return;
        }

        const now = new Date();
        now.setHours(0,0,0,0);

        let foundNext = false;
        let out = "";

        data.forEach(m => {
          out += `<div class="month-divider">
            <div class="month-divider-line"></div>
            <div class="month-divider-label">${esc(m.month ?? "")}</div>
            <div class="month-divider-line"></div>
          </div>`;

          (m.vienen || []).forEach(v => {
            const date = parseDate(m.year, m.monthIdx, v.date);
            const isPast = date < now;
            const isNext = !isPast && !foundNext ? (foundNext = true) : false;
            const isSpecial = v.special || v.type === "ASAMBLEA";

            const dateNum = esc(v.date ?? "--");
            const dow = date.toLocaleDateString("es-AR", { weekday: "short" });

            const nextBadge = isNext ? `<div class="conf-next-badge">Próximo domingo</div>` : "";

            let bodyHtml = "";
            if (isSpecial) {
              bodyHtml = `
                <div class="conf-body">
                  ${nextBadge}
                  <div class="conf-title">${esc(v.title || "Asamblea de Circuito")}</div>
                  ${v.subtitle ? `<div class="salen-extra" style="margin-top:4px">${esc(v.subtitle)}</div>` : ""}
                </div>`;
            } else {
              bodyHtml = `
                <div class="conf-body">
                  ${nextBadge}
                  <div class="conf-title">${esc(v.title ?? "")}</div>
                  <div class="conf-meta">
                    ${v.speaker ? `<div class="conf-meta-row"><span class="conf-meta-label">Orador</span><span class="conf-meta-value">${esc(v.speaker)}</span></div>` : ""}
                    ${v.congregation ? `<div class="conf-meta-row"><span class="conf-meta-label">Congreg.</span><span class="conf-meta-value">${esc(v.congregation)}</span></div>` : ""}
                    ${v.chairman ? `<div class="conf-meta-row"><span class="conf-meta-label">Preside</span><span class="conf-meta-value">${esc(v.chairman)}</span></div>` : ""}
                  </div>
                  ${v.time ? `<div class="conf-time">${esc(v.day ?? "")}${v.day && v.time ? " · " : ""}${esc(v.time)}</div>` : ""}
                </div>`;
            }

            out += `<div class="conf-card ${isSpecial ? "special" : ""} ${isNext ? "is-next" : ""} ${isPast ? "is-past" : ""}">
              <div class="conf-card-inner">
                <div class="conf-date">
                  <span class="day-num">${dateNum}</span>
                  <span class="day-dow">${dow}</span>
                </div>
                ${bodyHtml}
              </div>
            </div>`;
          });

          if ((m.salen || []).length) {
            out += `<div class="salen-wrap" style="margin-bottom:10px">
              <div class="salen-header">Discursantes que salen</div>
              ${m.salen.map(s => `
                <div class="salen-item">
                  <div class="salen-date">${esc(s.day ?? "")} ${esc(s.date ?? "")}</div>
                  <div class="salen-name">${esc(s.name ?? "")}</div>
                  ${s.extra ? `<div class="salen-extra">${esc(s.extra)}</div>` : ""}
                </div>`).join("")}
            </div>`;
          }
        });

        container.innerHTML = out;

        setTimeout(() => {
          const next = container.querySelector(".is-next");
          if (next) next.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 350);
      }

      document.addEventListener("DOMContentLoaded", render);
    </script>
    <script src="grupos-data.js"></script>
    <script src="notificaciones-data.js"></script>
    <script src="notificaciones.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
  </body>
</html>
