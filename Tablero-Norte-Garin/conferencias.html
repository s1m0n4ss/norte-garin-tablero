<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arreglos de Conferencia | Norte Garín</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDark = saved ? saved === "dark" : prefersDark;
        if (useDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <style>
      :root {
        --bg-main: #f1f5f9;
        --bg-card: #ffffff;
        --border: rgba(0, 0, 0, 0.08);
        --accent: #10b981;
        --accent-soft: rgba(16, 185, 129, 0.12);
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --header-bg: rgba(241, 245, 249, 0.78);
        --btn-bg: rgba(255, 255, 255, 0.85);
        --shadow: 0 20px 50px rgba(2, 6, 23, 0.12);
        --btn-shadow: 0 10px 25px rgba(2, 6, 23, 0.12);
        --card-bg: rgba(2, 6, 23, 0.03);
      }

      html.dark {
        --bg-main: #0a0f1d;
        --bg-card: #121a2a;
        --border: rgba(255, 255, 255, 0.06);
        --accent: #34d399;
        --accent-soft: rgba(16, 185, 129, 0.1);
        --text-primary: #f8fafc;
        --text-muted: #94a3b8;
        --header-bg: rgba(10, 15, 29, 0.75);
        --btn-bg: rgba(18, 26, 42, 0.78);
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
        --btn-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        --card-bg: rgba(255, 255, 255, 0.03);
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text-primary);
        margin: 0;
        background-color: var(--bg-main);
        transition: background 0.25s ease;
      }
      .page-bg {
        min-height: 100vh;
        background-image: radial-gradient(
          900px 500px at 50% -10%,
          rgba(16, 185, 129, 0.16),
          transparent 60%
        );
      }

      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--header-bg);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        padding: 8px;
      }

      .btn-header {
        background: var(--btn-bg);
        border: 1px solid var(--border);
        color: var(--text-primary);
        border-radius: 14px;
        padding: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--btn-shadow);
        transition: transform 0.1s ease;
      }
      .btn-header:active {
        transform: scale(0.95);
      }

      .hero-banner {
        position: relative;
        width: 100%;
        height: 168px;
        border-radius: 26px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .hero-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.8) 0%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.6) 100%
        );
      }

      .month-section {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 35px;
        margin-bottom: 2rem;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .month-header {
        background: var(--accent-soft);
        padding: 1.25rem;
        border-bottom: 1px solid var(--border);
        text-align: center;
      }
      .month-title {
        font-weight: 900;
        font-size: 1.1rem;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 25px;
        padding: 1.1rem;
        margin: 1rem;
        display: flex;
        gap: 1rem;
        transition: all 0.2s ease;
        align-items: center;
      }
      .is-current {
        border: 2px solid var(--accent);
        background: var(--accent-soft);
        transform: scale(1.02);
      }

      .date-circle {
        background: var(--accent);
        color: white;
        min-width: 50px;
        height: 50px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 1.3rem;
        box-shadow: 0 8px 15px rgba(16, 185, 129, 0.25);
      }
      .info h3 {
        margin: 0 0 4px 0;
        font-size: 1.05rem;
        font-weight: 900;
        line-height: 1.2;
      }
      .details {
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.5;
      }
      .details b {
        color: var(--accent);
        font-weight: 800;
        text-transform: uppercase;
        font-size: 0.7rem;
        margin-right: 4px;
      }
      .badge-next {
        background: #ef4444;
        color: white;
        font-size: 0.6rem;
        font-weight: 900;
        padding: 2px 8px;
        border-radius: 6px;
        text-transform: uppercase;
        display: inline-block;
        margin-bottom: 4px;
      }

      .salen-title {
        font-weight: 900;
        color: var(--accent);
        font-size: 0.8rem;
        padding: 0 1.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .salen-item {
        font-size: 0.85rem;
        padding: 10px 15px;
        background: var(--card-bg);
        border-radius: 15px;
        border: 1px solid var(--border);
        margin: 0.5rem 1rem;
      }
    </style>
  </head>

  <body class="page-bg pb-10">
    <header>
      <div class="max-w-md mx-auto">
        <div class="hero-banner group">
          <img src="img/discursos.png" alt="Conferencias" />
          <div class="hero-overlay"></div>

          <div class="absolute inset-0 p-4 flex flex-col justify-between">
            <div class="flex justify-between items-center">
              <a href="index.html" class="btn-header" aria-label="Volver">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m15 18-6-6 6-6" />
                </svg>
              </a>
              <button onclick="toggleTheme()" class="btn-header">
                <span id="theme-icon">🌙</span>
              </button>
            </div>

            <div class="text-white">
              <h1
                class="text-2xl font-black uppercase tracking-tighter drop-shadow-lg"
              >
                Conferencias
              </h1>
              <p
                class="text-[10px] font-black uppercase tracking-[0.2em] text-emerald-400 drop-shadow-md"
              >
                Programa 2026
              </p>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="max-w-md mx-auto px-4 mt-6">
      <main id="mainContainer"></main>
    </div>

    <script>
      const html = document.documentElement;
      const themeIcon = document.getElementById("theme-icon");

      function syncThemeIcon() {
        themeIcon.textContent = html.classList.contains("dark") ? "☀️" : "🌙";
      }
      function toggleTheme() {
        html.classList.toggle("dark");
        localStorage.setItem(
          "theme",
          html.classList.contains("dark") ? "dark" : "light",
        );
        syncThemeIcon();
      }
      syncThemeIcon();

      const data = [
        {
          month: "Enero 2026",
          year: 2026,
          monthIdx: 0,
          vienen: [
            {
              date: "04",
              day: "Domingo",
              time: "9:30 am",
              title: "Avancemos con la organización unida de Jehová",
              speaker: "Enzo Módica",
              congregation: "Sur, Benavídez",
              chairman: "Lucas Segovia",
            },
            {
              date: "11",
              day: "Domingo",
              time: "9:30 am",
              title: "Tenga fe en Dios y sus promesas",
              speaker: "Agustín Galindez",
              congregation: "Sur, Benavídez",
              chairman: "Caetano Ferrari",
            },
            {
              date: "18",
              day: "Domingo",
              time: "9:30 am",
              title: "Visita de Pastoreo a la sucursal",
              speaker: "—",
              congregation: "—",
              chairman: "Elvio Casco",
            },
            {
              date: "25",
              day: "Domingo",
              time: "9:30 am",
              title: "Joven, ¿cómo puedes ser feliz y tener éxito?",
              speaker: "Elvio Casco",
              congregation: "Norte, Garín",
              chairman: "León Segovia",
            },
          ],
          salen: [
            {
              day: "Sábado",
              date: "10",
              name: "Horacio Salgado",
              extra: "Bosquejo 103",
            },
            {
              day: "Sábado",
              date: "31",
              name: "Adolfo Gutiérrez",
              extra: "Bosquejo 138",
            },
          ],
        },
        {
          month: "Febrero 2026",
          year: 2026,
          monthIdx: 1,
          vienen: [
            {
              date: "01",
              day: "Domingo",
              time: "9:30 am",
              title: "Actuemos con sabiduría en este mundo insensato",
              speaker: "Daniel Albis",
              congregation: "Norte, Garín",
              chairman: "Horacio Salgado",
            },
            {
              date: "08",
              day: "Domingo",
              time: "9:30 am",
              title: "¿Dónde encontrará una esperanza segura?",
              speaker: "Lucas Segovia",
              congregation: "Norte, Garín",
              chairman: "Adolfo Gutierrez",
            },
            {
              date: "15",
              day: "Domingo",
              time: "9:30 am",
              title: "¿Qué lo ayudará a tener éxito en la vida?",
              speaker: "Mauricio Tierno",
              congregation: "S. de Circuito",
              chairman: "Dario Cortez",
            },
            {
              date: "22",
              day: "Domingo",
              time: "9:30 am",
              title: "Consigamos que nuestro corazón sea sabio",
              speaker: "Santiago Vega",
              congregation: "Este, San Fernando",
              chairman: "Mario Segovia",
            },
          ],
          salen: [],
        },
      ];

      function render() {
        const container = document.getElementById("mainContainer");
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        let foundNext = false;

        container.innerHTML = data
          .map(
            (m) => `
          <section class="month-section">
            <header class="month-header"><h2 class="month-title">${m.month}</h2></header>
            <div class="vienen-list">
              ${m.vienen
                .map((v) => {
                  const itemDate = new Date(
                    m.year,
                    m.monthIdx,
                    parseInt(v.date),
                  );
                  const isPast = itemDate < now;
                  let isNext = false;
                  if (!isPast && !foundNext) {
                    isNext = true;
                    foundNext = true;
                  }
                  return `
                  <article class="card ${isNext ? "is-current" : ""}" style="${isPast ? "opacity:0.45; filter: grayscale(1);" : ""}">
                    <div class="date-circle">${v.date}</div>
                    <div class="info">
                      ${isNext ? '<span class="badge-next">Próxima reunión</span>' : ""}
                      <h3>${v.title}</h3>
                      <div class="details">
                        <p><b>Orador:</b> ${v.speaker}</p>
                        <p><b>Congregación:</b> ${v.congregation}</p>
                        <p><b>Preside:</b> ${v.chairman}</p>
                        <p class="mt-1 font-bold text-emerald-500">${v.day} – ${v.time}</p>
                      </div>
                    </div>
                  </article>`;
                })
                .join("")}
            </div>
            ${m.salen.length ? `<div class="salen-title mt-2">Discursantes que salen</div>` : ""}
            <div class="pb-4">
              ${m.salen
                .map(
                  (s) => `
                <div class="salen-item">
                  <span class="font-bold">${s.day} ${s.date}:</span> ${s.name} 
                  <span class="opacity-60 text-xs ml-1">(${s.extra})</span>
                </div>
              `,
                )
                .join("")}
            </div>
          </section>
        `,
          )
          .join("");

        setTimeout(() => {
          const nextItem = document.querySelector(".is-current");
          if (nextItem)
            nextItem.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 450);
      }

      document.addEventListener("DOMContentLoaded", render);
    </script>
  </body>
</html>
