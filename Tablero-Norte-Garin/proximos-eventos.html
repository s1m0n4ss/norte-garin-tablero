<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Próximos eventos | Norte Garín</title>

    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDark = saved ? saved === "dark" : prefersDark;
        if (useDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg:#f7f5f0; --bg-card:#ffffff; --bg-card2:#f0ede8;
        --text:#1a1714; --text-muted:#8a8075;
        --accent:#2d6a4f; --accent-light:#52b788; --accent-warm:#d4a853;
        --border:rgba(26,23,20,0.09);
        --shadow-sm:0 2px 12px rgba(26,23,20,0.07);
        --shadow-md:0 8px 32px rgba(26,23,20,0.10);
        --shadow-lg:0 24px 64px rgba(26,23,20,0.13);
      }

      html.dark {
        --bg:#1e2023; --bg-card:#272b2f; --bg-card2:#2f3338;
        --text:#eceae6; --text-muted:#8a8d92;
        --accent:#4caf80; --accent-light:#6fcf97; --accent-warm:#d4a853;
        --border:rgba(255,255,255,0.08);
        --shadow-sm:0 2px 12px rgba(0,0,0,0.15);
        --shadow-md:0 8px 32px rgba(0,0,0,0.20);
        --shadow-lg:0 24px 64px rgba(0,0,0,0.28);
      }

      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family:"DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding-bottom: max(48px, env(safe-area-inset-bottom, 48px));
        overflow-x: hidden;
        min-height: 100vh;
      }

      body::before {
        content:'';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
        opacity: 0.6;
      }

      .syne { font-family:"Syne", sans-serif; }

      .hero-wrap {
        position: relative;
        width: 100%;
        height: 250px;
        overflow: hidden;
      }

      .hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 8s ease;
      }

      .hero-wrap:hover .hero-img {
        transform: scale(1.04);
      }

      .hero-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.04) 38%, rgba(0,0,0,0.72) 100%);
      }

      .hero-top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        padding-top: max(16px, env(safe-area-inset-top));
      }

      .hero-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 0 24px 22px;
      }

      .hero-title {
        font-family:"Syne", sans-serif;
        font-size: 30px;
        font-weight: 700;
        color: #fff;
        text-transform: uppercase;
        line-height: 1;
      }

      .hero-chip {
        display: inline-block;
        margin-top: 10px;
        background: rgba(255,255,255,0.14);
        border: 1px solid rgba(255,255,255,0.16);
        backdrop-filter: blur(8px);
        color: #fff;
        font-family:"Syne", sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 6px 12px;
        border-radius: 99px;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: rgba(255,255,255,0.18);
        border: 1px solid rgba(255,255,255,0.25);
        backdrop-filter: blur(10px);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .main-wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 16px 16px 48px;
        position: relative;
        z-index: 1;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
      }

      .summary-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        box-shadow: var(--shadow-sm);
      }

      .summary-label {
        font-family:"Syne", sans-serif;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 8px;
      }

      .summary-value {
        font-family:"Syne", sans-serif;
        font-size: 20px;
        font-weight: 700;
      }

      .summary-value.accent {
        color: var(--accent);
      }

      .events-list {
        display: grid;
        gap: 12px;
      }

      .event-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
      }

      .event-card-inner {
        padding: 16px;
      }

      .event-type {
        font-family:"Syne", sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .event-title {
        font-family:"Syne", sans-serif;
        font-size: 20px;
        font-weight: 700;
        margin-top: 8px;
        line-height: 1.15;
      }

      .event-meta {
        margin-top: 14px;
        display: grid;
        gap: 8px;
      }

      .event-line {
        font-size: 13px;
        line-height: 1.45;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="hero-wrap">
        <img src="img/file_00000000174471f5b349ad702b47ce01.png" class="hero-img" alt="Próximos eventos" />

        <div class="hero-gradient"></div>

        <div class="hero-top-bar">
          <a href="index.html" class="icon-btn" aria-label="Volver al inicio" style="text-decoration:none;">
            ←
          </a>
          <button class="icon-btn" id="btnTheme" aria-label="Cambiar tema">
            <span id="theme-icon">🌙</span>
          </button>
        </div>

        <div class="hero-bottom">
          <div class="hero-title">Próximos<br>eventos</div>
          <div class="hero-chip">Agenda</div>
        </div>
      </div>
    </header>

    <main class="main-wrap">
      <div id="notif-banner-container"></div>
      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-label">Eventos cargados</div>
          <div class="summary-value" id="summary-total">—</div>
        </div>

        <div class="summary-card">
          <div class="summary-label">Próximo</div>
          <div class="summary-value accent" id="summary-next">—</div>
        </div>
      </div>

      <div id="eventos-lista" class="events-list"></div>
    </main>

    <script src="eventos-data.js"></script>

    <script>
      const html = document.documentElement;
      const themeIcon = document.getElementById("theme-icon");

      function syncThemeIcon() {
        themeIcon.textContent = html.classList.contains("dark") ? "☀️" : "🌙";
      }

      document.getElementById("btnTheme").onclick = () => {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        syncThemeIcon();
      };

      syncThemeIcon();

      function getDateOnly(dateStr) {
        const [year, month, day] = dateStr.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function formatFecha(dateStr) {
        const d = getDateOnly(dateStr);
        return d.toLocaleDateString("es-AR", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
      }

      function getTypeLabel(type) {
        if (type === "asamblea") return "Asamblea";
        if (type === "especial") return "Especial";
        if (type === "conmemoracion") return "Conmemoración";
        return "Evento";
      }

      function getMonthShort(dateStr) {
        return getDateOnly(dateStr).toLocaleDateString("es-AR", { month: "short" });
      }

      function renderEventos() {
        const cont = document.getElementById("eventos-lista");

        if (!window.EVENTOS_DATA || !Array.isArray(window.EVENTOS_DATA) || window.EVENTOS_DATA.length === 0) {
          document.getElementById("summary-total").textContent = "0";
          document.getElementById("summary-next").textContent = "—";
          cont.innerHTML = `
            <div class="event-card">
              <div class="event-card-inner">No hay eventos cargados</div>
            </div>
          `;
          return;
        }

        const eventos = [...window.EVENTOS_DATA].sort((a, b) => getDateOnly(a.date) - getDateOnly(b.date));
        document.getElementById("summary-total").textContent = eventos.length;

        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);
        const proximo = eventos.find(ev => getDateOnly(ev.date) >= hoy) || eventos[0];

        document.getElementById("summary-next").textContent = proximo
          ? `${getDateOnly(proximo.date).getDate()} ${getMonthShort(proximo.date)}`
          : "—";

        cont.innerHTML = eventos.map(ev => `
          <section class="event-card">
            <div class="event-card-inner">
              <div class="event-type">${getTypeLabel(ev.type)}</div>
              <div class="event-title">${ev.title}</div>

              <div class="event-meta">
                <div class="event-line"><b>Fecha:</b> ${formatFecha(ev.date)}</div>
                ${ev.time ? `<div class="event-line"><b>Hora:</b> ${ev.time}</div>` : ""}
                ${ev.location ? `<div class="event-line"><b>Lugar:</b> ${ev.location}</div>` : ""}
                ${ev.description ? `<div class="event-line"><b>Detalle:</b> ${ev.description}</div>` : ""}
              </div>
            </div>
          </section>
        `).join("");
      }

      renderEventos();
    </script>
      <script src="grupos-data.js"></script>
    <script src="notificaciones-data.js"></script>
    <script src="notificaciones.js"></script>
  </body>
</html>
