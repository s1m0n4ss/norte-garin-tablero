<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Próximos eventos | Norte Garín</title>

    <script>
      (function () {
        // Respeta preferencia guardada o del sistema (igual que tus otras páginas)
        const saved = localStorage.getItem("theme");
        const prefersDark =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDark = saved ? saved === "dark" : prefersDark;
        if (useDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #f1f5f9;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: rgba(0, 0, 0, 0.12);
        --shadow: 0 18px 45px rgba(2, 6, 23, 0.12);
        --btnbg: rgba(255, 255, 255, 0.85);
        --btnborder: rgba(0, 0, 0, 0.10);

        --chip: rgba(59, 130, 246, 0.12);
        --chiptext: #2563eb;

        --frame: rgba(255, 255, 255, 0.06);
      }

      html.dark {
        --bg: #0a0f1d;
        --card: #0f172a;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.14);
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
        --btnbg: rgba(18, 26, 42, 0.82);
        --btnborder: rgba(255, 255, 255, 0.10);

        --chip: rgba(59, 130, 246, 0.18);
        --chiptext: #93c5fd;

        --frame: rgba(255, 255, 255, 0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding-bottom: 40px;
      }

      .page-bg {
        min-height: 100vh;
        background-image: radial-gradient(
          900px 520px at 50% -10%,
          rgba(59, 130, 246, 0.18),
          transparent 60%
        );
      }

      header {
        position: sticky;
        top: 0;
        z-index: 50;
        padding: 10px 10px 8px;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      }

      .wrap {
        max-width: 430px;
        margin: 0 auto;
      }

      .hero {
        position: relative;
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        height: 150px;
        background: linear-gradient(140deg, rgba(59,130,246,.22), transparent 55%),
                    linear-gradient(0deg, rgba(0,0,0,.65), rgba(0,0,0,.25) 55%, rgba(0,0,0,.55));
      }

      .hero-inner {
        position: absolute;
        inset: 0;
        padding: 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .hero-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--btnborder);
        background: var(--btnbg);
        color: var(--text);
        border-radius: 16px;
        padding: 10px 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 10px 25px rgba(2, 6, 23, 0.12);
        cursor: pointer;
        transition: transform .12s ease;
        text-decoration: none;
        font-weight: 800;
      }
      .btn:active { transform: scale(0.96); }

      .hero-title {
        color: #fff;
        font-weight: 900;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        font-size: 26px;
        line-height: 1.05;
        margin: 0;
        text-shadow: 0 10px 30px rgba(0,0,0,.45);
      }

      .hero-sub {
        margin: 6px 0 0;
        color: rgba(255,255,255,.75);
        font-weight: 800;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      main {
        padding: 16px 14px 0;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 8px 2px 12px;
      }
      .section-header h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 999px;
        background: var(--chip);
        color: var(--chiptext);
        border: 1px solid color-mix(in srgb, var(--chiptext) 22%, transparent);
        font-weight: 900;
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      /* Tarjeta estilo captura */
      .event-card {
        background: color-mix(in srgb, var(--card) 88%, transparent);
        border: 2px solid var(--frame);
        border-radius: 22px;
        padding: 18px 18px 16px;
        box-shadow: 0 14px 40px rgba(0,0,0,.18);
        margin-bottom: 14px;
      }

      .event-date {
        color: rgba(255,255,255,.55);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.02em;
        margin: 0 0 10px;
      }
      html:not(.dark) .event-date { color: color-mix(in srgb, var(--muted) 92%, transparent); }

      .event-title {
        margin: 0 0 10px;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.02em;
        line-height: 1.06;
        color: rgba(255,255,255,.92);
      }
      html:not(.dark) .event-title { color: var(--text); }

      .event-meta {
        margin: 10px 0 0;
        color: rgba(255,255,255,.60);
        font-weight: 600;
        font-size: 14px;
        line-height: 1.35;
      }
      html:not(.dark) .event-meta { color: var(--muted); }

      .event-meta .time {
        display: block;
        margin-bottom: 8px;
        font-size: 22px;
        font-weight: 700;
        color: rgba(255,255,255,.55);
      }
      html:not(.dark) .event-meta .time { color: color-mix(in srgb, var(--muted) 92%, transparent); }

      .event-meta .loc {
        display: block;
        font-size: 22px;
        font-weight: 600;
        color: rgba(255,255,255,.45);
      }
      html:not(.dark) .event-meta .loc { color: color-mix(in srgb, var(--muted) 88%, transparent); }

      .empty {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 18px;
        color: var(--muted);
        font-weight: 700;
        box-shadow: var(--shadow);
      }

      /* Pequeño ajuste para pantallas chicas */
      @media (max-width: 380px) {
        .event-title { font-size: 26px; }
        .event-meta .time, .event-meta .loc { font-size: 18px; }
      }
    </style>
  </head>

  <body class="page-bg">
    <header>
      <div class="wrap">
        <div class="hero">
          <div class="hero-inner">
            <div class="hero-top">
              <a class="btn" href="index.html" aria-label="Volver">
                <!-- flecha -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m15 18-6-6 6-6" />
                </svg>
              </a>

              <button class="btn" id="btnTheme" type="button" aria-label="Cambiar tema">
                <span id="themeIcon">🌙</span>
              </button>
            </div>

            <div>
              <h1 class="hero-title">Próximos<br />Eventos</h1>
              <p class="hero-sub">Calendario de la congregación</p>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="section-header">
        <h2>Eventos futuros</h2>
        <span class="chip" id="countChip">0</span>
      </div>

      <div id="events"></div>
    </main>

    <script>
      const html = document.documentElement;
      const themeIcon = document.getElementById("themeIcon");

      function syncThemeIcon() {
        themeIcon.textContent = html.classList.contains("dark") ? "☀️" : "🌙";
      }
      document.getElementById("btnTheme").onclick = () => {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        syncThemeIcon();
      };
      syncThemeIcon();

      // =========================
      //   DATOS (tus eventos)
      // =========================
      const EVENTS = [
        {
          title: "Conmemoración",
          allDay: true,
          start: "2026-04-02",
          end: "2026-04-02",
          location: ""
        },
        {
          title: "Asamblea de circuito con el representante de la sucursal",
          allDay: true,
          start: "2026-05-10",
          end: "2026-05-10",
          location: "Salón de Asambleas - Ezeiza - Ezeiza (Bs. As.-ARG)"
        },
        {
          title: "Asamblea regional",
          allDay: true,
          start: "2026-08-21",
          end: "2026-08-23",
          location: "Salón de Asambleas de Ezeiza, Bs. As."
        },
      ];

      // =========================
      //   Render
      // =========================
      const $events = document.getElementById("events");
      const $count = document.getElementById("countChip");

      function parseISO(iso) {
        const [y, m, d] = String(iso).split("-").map(Number);
        return new Date(y, (m || 1) - 1, d || 1, 0, 0, 0, 0);
      }

      function fmtDateLine(ev) {
        // "vie, 21 ago – dom, 23 ago 2026" o "jue, 2 abr 2026"
        const start = parseISO(ev.start);
        const end = parseISO(ev.end || ev.start);

        const sameDay = start.getTime() === end.getTime();
        const locale = "es-AR";

        const wStart = start.toLocaleDateString(locale, { weekday: "short" });
        const dStart = start.toLocaleDateString(locale, { day: "numeric" });
        const mStart = start.toLocaleDateString(locale, { month: "short" });
        const yStart = start.getFullYear();

        const wEnd = end.toLocaleDateString(locale, { weekday: "short" });
        const dEnd = end.toLocaleDateString(locale, { day: "numeric" });
        const mEnd = end.toLocaleDateString(locale, { month: "short" });
        const yEnd = end.getFullYear();

        if (sameDay) return `${wStart}, ${dStart} ${mStart} ${yStart}`;

        // Si cruza de año, mostramos ambos. Si no, mostramos uno.
        const yearPart = (yStart === yEnd) ? ` ${yStart}` : ` ${yStart}–${yEnd}`;
        return `${wStart}, ${dStart} ${mStart} – ${wEnd}, ${dEnd} ${mEnd}${yearPart}`;
      }

      function fmtTime(ev) {
        if (ev.allDay) return "Todo el día";
        // Si en el futuro querés horarios: "19:30" etc.
        // Podés agregar ev.time = "19:30" y se muestra:
        if (ev.time) return ev.time;
        return "";
      }

      function isFutureOrToday(ev) {
        const today = new Date();
        today.setHours(0,0,0,0);
        const end = parseISO(ev.end || ev.start);
        end.setHours(0,0,0,0);
        return end.getTime() >= today.getTime();
      }

      function render() {
        const upcoming = EVENTS
          .filter(isFutureOrToday)
          .sort((a,b) => parseISO(a.start) - parseISO(b.start));

        $count.textContent = upcoming.length ? `${upcoming.length} próximos` : "0";

        if (!upcoming.length) {
          $events.innerHTML = `<div class="empty">No hay eventos futuros cargados.</div>`;
          return;
        }

        $events.innerHTML = upcoming.map(ev => {
          const dateLine = fmtDateLine(ev);
          const timeLine = fmtTime(ev);
          const loc = (ev.location || "").trim();

          return `
            <article class="event-card">
              <p class="event-date">${dateLine}</p>
              <h3 class="event-title">${ev.title}</h3>
              <div class="event-meta">
                ${timeLine ? `<span class="time">${timeLine}</span>` : ``}
                ${loc ? `<span class="loc">${loc}</span>` : ``}
              </div>
            </article>
          `;
        }).join("");
      }

      render();
    </script>
  </body>
</html>
