<script>
(function () {
  const saved = localStorage.getItem("theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const useDark = saved ? saved === "dark" : prefersDark;
  if (useDark) document.documentElement.classList.add("dark");
})();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet"/>

<style>
:root{
--bg-main:#f1f5f9;
--bg-card:#ffffff;
--text-primary:#0f172a;
--text-muted:#64748b;
--border:rgba(0,0,0,0.08);
--accent:#3b82f6;
--shadow:0 20px 50px rgba(2,6,23,0.12);
--btn-bg:rgba(255,255,255,0.85);
}
html.dark{
--bg-main:#0a0f1d;
--bg-card:#121a2a;
--text-primary:#f8fafc;
--text-muted:#94a3b8;
--border:rgba(255,255,255,0.06);
--accent:#3b82f6;
--shadow:0 28px 80px rgba(0,0,0,0.55);
--btn-bg:rgba(18,26,42,0.82);
}
body{
font-family:"Inter",sans-serif;
background-color:var(--bg-main);
color:var(--text-primary);
margin:0;
padding-bottom:60px;
}
.page-bg{
min-height:100vh;
background-image:radial-gradient(900px 520px at 50% -10%,rgba(59,130,246,0.16),transparent 60%);
}
.btn-surface{
background:var(--btn-bg);
border:1px solid var(--border);
color:var(--text-primary);
box-shadow:0 10px 25px rgba(2,6,23,0.12);
backdrop-filter:blur(8px);
transition:all 0.15s ease;
}
.btn-surface:active{transform:scale(0.95);}
#sidebar{transition:transform 0.3s ease-in-out;background:var(--bg-card);z-index:100;}
.nav-link{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;color:var(--text-muted);transition:all 0.2s ease;}
.nav-link.active{background:rgba(59,130,246,0.12);color:var(--accent);font-weight:800;border:1px solid rgba(59,130,246,0.2);}
.card{background-color:var(--bg-card);border:1px solid var(--border);box-shadow:var(--shadow);}
.muted{color:var(--text-muted);}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(59,130,246,0.22);background:rgba(59,130,246,0.1);color:var(--accent);font-weight:900;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;}
.event-card{border-left:4px solid var(--accent);}
.tag{font-size:10px;font-weight:900;letter-spacing:0.16em;text-transform:uppercase;padding:7px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);background:rgba(2,6,23,0.03);}
html.dark .tag{background:rgba(255,255,255,0.04);}
</style>
</head>

<header class="p-6 max-w-md mx-auto">
<div class="relative w-full h-40 rounded-[32px] overflow-hidden shadow-2xl group">
<img src="img/file_00000000174471f5b349ad702b47ce01.png" class="absolute inset-0 w-full h-full object-cover transform group-hover:scale-105 transition duration-700" alt="Próximos eventos"/>
<div class="absolute inset-0 bg-gradient-to-b from-black/55 via-black/20 to-black/80"></div>

<div class="absolute top-4 left-4 right-4 flex justify-between items-center z-20">
<button id="btnMenu" class="btn-surface p-3 rounded-2xl active:scale-90" type="button">
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
</button>
<button id="btnTheme" class="btn-surface p-3 rounded-2xl active:scale-90" type="button">
<span id="theme-icon">🌙</span>
</button>

<div class="absolute inset-0 p-4 flex flex-col justify-end z-10">
<h1 class="text-white text-2xl font-black uppercase tracking-tighter drop-shadow-lg leading-none">
Próximos<br/>Eventos
</h1>
<p id="subtitle" class="text-white/70 text-[11px] font-bold mt-2 uppercase tracking-tighter"></p>
</div>
</div>

<main class="max-w-md mx-auto px-6">
<section class="card rounded-[35px] p-6 mb-8 border-t-4 shadow-xl -mt-10 relative z-10 overflow-hidden" style="border-top-color:var(--accent)">
<div class="flex items-center justify-between mb-4">
<h2 class="text-[10px] font-black uppercase tracking-[0.15em] flex items-center gap-2" style="color:var(--accent)">Eventos futuros</h2>
<span id="countPill" class="pill">0 próximos</span>
</div>
<div id="events"></div>
</section>
</main>

<script>
const html=document.documentElement;
const themeIcon=document.getElementById("theme-icon");
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");

function syncThemeIcon(){themeIcon.textContent=html.classList.contains("dark")?"☀️":"🌙";}
function toggleTheme(){html.classList.toggle("dark");localStorage.setItem("theme",html.classList.contains("dark")?"dark":"light");syncThemeIcon();}
document.getElementById("btnTheme").onclick=toggleTheme;
syncThemeIcon();

document.getElementById("btnMenu").onclick=()=>{sidebar.classList.replace("-translate-x-full","translate-x-0");overlay.classList.remove("hidden");setTimeout(()=>overlay.classList.add("opacity-100"),10);};
overlay.onclick=()=>{sidebar.classList.replace("translate-x-0","-translate-x-full");overlay.classList.remove("opacity-100");setTimeout(()=>overlay.classList.add("hidden"),300);};

const EVENTS=[
{title:"Asamblea de circuito con el superintendente de circuito",allDay:true,start:"2026-03-01",end:"2026-03-01",location:""},
{title:"Conmemoración",allDay:true,start:"2026-04-02",end:"2026-04-02",location:""},
{title:"Asamblea de circuito con el representante de la sucursal",allDay:true,start:"2026-05-10",end:"2026-05-10",location:"Salón de Asambleas - Ezeiza - Ezeiza (Bs. As.-ARG)"},
{title:"Asamblea regional",allDay:true,start:"2026-08-21",end:"2026-08-23",location:"Salón de Asambleas de Ezeiza, Bs. As."}
];

function parseISO(iso){const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d);}
function isFutureOrToday(ev){const today=new Date();today.setHours(0,0,0,0);const end=parseISO(ev.end||ev.start);return end>=today;}

function fmtDateLine(ev){
const s=parseISO(ev.start);
return s.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}

const $events=document.getElementById("events");
const $count=document.getElementById("countPill");

function render(){
const upcoming=EVENTS.filter(isFutureOrToday).sort((a,b)=>parseISO(a.start)-parseISO(b.start));
$count.textContent=`${upcoming.length} próximos`;
document.getElementById("subtitle").textContent=upcoming.length?`Siguientes ${upcoming.length} eventos`:"No hay eventos cargados";

$events.innerHTML=upcoming.map(ev=>{
const dateLine=fmtDateLine(ev);
const loc=(ev.location||"").trim();
const startDate=parseISO(ev.start);

return `
<article class="card event-card rounded-[26px] p-5 mb-4">
<div>
<p class="text-[10px] font-black uppercase tracking-[0.15em] muted">${dateLine}</p>
<h3 class="font-extrabold text-lg mt-2 leading-tight">${ev.title}</h3>
</div>
${loc?`<p class="mt-3 text-sm font-bold muted">${loc}</p>`:""}
<div class="mt-4 flex flex-wrap gap-2">
<span class="pill">📅 ${startDate.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})}</span>
</div>
</article>
`;
}).join("");
}

render();
</script>

</body>
