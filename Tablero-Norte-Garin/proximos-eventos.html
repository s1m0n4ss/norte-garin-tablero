<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Próximos eventos | Norte Garín</title>

    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDark = saved ? saved === "dark" : prefersDark;
        if (useDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg:#f7f5f0; --bg-card:#ffffff; --bg-card2:#f0ede8;
        --text:#1a1714; --text-muted:#8a8075;
        --accent:#2d6a4f; --accent-light:#52b788; --accent-warm:#d4a853;
        --border:rgba(26,23,20,0.09);
        --shadow-sm:0 2px 12px rgba(26,23,20,0.07);
        --shadow-md:0 8px 32px rgba(26,23,20,0.10);
        --shadow-lg:0 24px 64px rgba(26,23,20,0.13);
      }
      html.dark {
        --bg:#1e2023; --bg-card:#272b2f; --bg-card2:#2f3338;
        --text:#eceae6; --text-muted:#8a8d92;
        --accent:#4caf80; --accent-light:#6fcf97; --accent-warm:#d4a853;
        --border:rgba(255,255,255,0.08);
        --shadow-sm:0 2px 12px rgba(0,0,0,0.15);
        --shadow-md:0 8px 32px rgba(0,0,0,0.20);
        --shadow-lg:0 24px 64px rgba(0,0,0,0.28);
      }

      *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
      body{
        font-family:"DM Sans",sans-serif; background:var(--bg); color:var(--text);
        margin:0; padding-bottom:max(48px,env(safe-area-inset-bottom,48px));
        overflow-x:hidden; min-height:100vh;
      }
      body::before{
        content:''; position:fixed; inset:0;
        background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events:none; z-index:0; opacity:0.6;
      }
      .syne{font-family:"Syne",sans-serif;}

      /* SIDEBAR */
      #sidebar{
        position:fixed; top:0; left:0; height:100%; width:300px;
        background:var(--bg-card); border-right:1px solid var(--border);
        box-shadow:var(--shadow-lg); transform:translateX(-100%);
        transition:transform 0.38s cubic-bezier(0.4,0,0.2,1);
        z-index:200; overflow-y:auto;
      }
      #sidebar.open{transform:translateX(0);}
      .sidebar-header{padding:32px 28px 24px; border-bottom:1px solid var(--border);}
      .sidebar-logo{display:flex; align-items:center; gap:14px;}
      .logo-mark{width:44px; height:44px; background:var(--accent); border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
      .sidebar-nav{padding:20px 16px;}
      .nav-section-label{
        font-family:"Syne",sans-serif; font-size:9px; font-weight:700;
        letter-spacing:0.15em; text-transform:uppercase; color:var(--text-muted);
        padding:0 12px; margin-bottom:8px; margin-top:16px;
      }
      .nav-item{
        display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:14px;
        color:var(--text-muted); text-decoration:none; font-size:14.5px; font-weight:500;
        transition:all 0.18s ease; margin-bottom:2px;
      }
      .nav-item:hover{background:var(--bg-card2); color:var(--text);}
      .nav-item.active{background:color-mix(in srgb,var(--accent) 12%,transparent); color:var(--accent); font-weight:700;}
      .nav-item .icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--bg-card2);}
      .nav-item.active .icon{background:color-mix(in srgb,var(--accent) 15%,transparent);}

      /* OVERLAY */
      #overlay{
        position:fixed; inset:0; background:rgba(0,0,0,0.45);
        backdrop-filter:blur(4px); z-index:199;
        opacity:0; pointer-events:none; transition:opacity 0.3s ease;
      }
      #overlay.visible{opacity:1; pointer-events:all;}

      /* HERO */
      .hero-wrap{position:relative; width:100%; height:250px; overflow:hidden;}
      .hero-img{width:100%; height:100%; object-fit:cover; transition:transform 8s ease;}
      .hero-wrap:hover .hero-img{transform:scale(1.04);}
      .hero-gradient{position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,0.18) 0%,rgba(0,0,0,0.04) 38%,rgba(0,0,0,0.72) 100%);}
      .hero-top-bar{
        position:absolute; top:0; left:0; right:0;
        display:flex; align-items:center; justify-content:space-between;
        padding:16px 20px; padding-top:max(16px,env(safe-area-inset-top));
      }
      .hero-bottom{position:absolute; bottom:0; left:0; right:0; padding:0 24px 22px;}
      .hero-title{font-family:"Syne",sans-serif; font-size:30px; font-weight:700; color:#fff; text-transform:uppercase; line-height:1; letter-spacing:-0.01em;}
      .hero-chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
      .hero-chip{
        background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.16);
        backdrop-filter:blur(8px); color:#fff;
        font-family:"Syne",sans-serif; font-size:9px; font-weight:700;
        letter-spacing:0.1em; text-transform:uppercase;
        padding:6px 12px; border-radius:99px;
      }
      .icon-btn{
        width:42px; height:42px; border-radius:13px;
        background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.25);
        backdrop-filter:blur(10px); color:#fff;
        display:flex; align-items:center; justify-content:center;
        cursor:pointer; transition:all 0.15s ease;
      }
      .icon-btn:active{transform:scale(0.92);}

      /* MAIN */
      .main-wrap{max-width:480px; margin:0 auto; padding:16px 16px 48px; position:relative; z-index:1;}

      @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

      /* SUMMARY */
      .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;}
      .summary-card{
        background:var(--bg-card); border:1px solid var(--border);
        border-radius:18px; padding:16px; box-shadow:var(--shadow-sm);
        animation:fadeUp 0.4s ease both;
      }
      .summary-label{
        font-family:"Syne",sans-serif; font-size:8px; font-weight:700;
        letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px;
      }
      .summary-value{font-family:"Syne",sans-serif; font-size:20px; font-weight:700; line-height:1; color:var(--text);}
      .summary-value.accent{color:var(--accent);}

      /* EVENTS */
      .events-list{display:grid; gap:12px;}
      .event-card{
        background:var(--bg-card); border:1px solid var(--border);
        border-radius:22px; overflow:hidden; box-shadow:var(--shadow-sm);
        animation:fadeUp 0.4s ease both;
      }
      .event-card-inner{padding:16px;}
      .event-top{
        display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
      }
      .event-type{
        font-family:"Syne",sans-serif; font-size:9px; font-weight:700;
        letter-spacing:0.14em; text-transform:uppercase; color:var(--accent);
      }
      .event-title{
        font-family:"Syne",sans-serif; font-size:20px; font-weight:700;
        line-height:1.05; color:var(--text); margin-top:8px;
      }
      .event-day-badge{
        flex-shrink:0;
        min-width:54px;
        text-align:center;
        border-radius:16px;
        padding:10px 10px;
        background:color-mix(in srgb,var(--accent) 10%,transparent);
        border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
        color:var(--accent);
      }
      .event-day-number{
        font-family:"Syne",sans-serif; font-size:22px; font-weight:700; line-height:1;
      }
      .event-meta{
        margin-top:14px;
        display:grid;
        gap:8px;
      }
      .event-line{
        font-size:13px;
        line-height:1.45;
        color:var(--text);
      }
      .event-line b{
        color:var(--text);
      }
      .event-empty{
        background:var(--bg-card); border:1px solid var(--border);
        border-radius:22px; padding:18px; box-shadow:var(--shadow-sm);
      }

      @media(max-width:360px){
        .event-top{flex-direction:column;}
        .event-day-badge{width:100%;}
      }
    </style>
  </head>

    <main class="main-wrap">
      <div class="summary-grid">
        <div class="summary-card" style="animation-delay:0.05s">
          <div class="summary-label">Eventos cargados</div>
          <div class="summary-value" id="summary-total">—</div>
        </div>
        <div class="summary-card" style="animation-delay:0.10s">
          <div class="summary-label">Próximo</div>
          <div class="summary-value accent" id="summary-next">—</div>
        </div>
      </div>

    <script src="eventos-data.js"></script>
    <script>
      // THEME
      const html = document.documentElement;
      const iconMoon = document.getElementById("theme-icon-moon");
      const iconSun  = document.getElementById("theme-icon-sun");

      function applyThemeIcons() {
        const dark = html.classList.contains("dark");
        iconMoon.style.display = dark ? "none" : "block";
        iconSun.style.display  = dark ? "block" : "none";
      }

      applyThemeIcons();

      document.getElementById("btnTheme").onclick = () => {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        applyThemeIcons();
      };

      // SIDEBAR
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      document.getElementById("btnMenu").onclick = () => {
        sidebar.classList.add("open");
        overlay.classList.add("visible");
      };
      overlay.onclick = () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("visible");
      };

      function getDateOnly(date) {
        const d = new Date(date);
        d.setHours(0, 0, 0, 0);
        return d;
      }

      function formatFecha(dateStr) {
        const d = getDateOnly(dateStr);
        return d.toLocaleDateString("es-AR", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }

      function getTypeLabel(type) {
        if (type === "asamblea") return "Asamblea";
        if (type === "especial") return "Especial";
        if (type === "conmemoracion") return "Conmemoración";
        return "Evento";
      }

      function getMonthShort(dateStr) {
        return getDateOnly(dateStr).toLocaleDateString("es-AR", { month: "short" });
      }

      function actualizarResumen(eventos) {
        document.getElementById("summary-total").textContent = eventos.length;

        const hoy = getDateOnly(new Date());
        const proximo = eventos.find((e) => getDateOnly(e.date) >= hoy) || eventos[0];

        document.getElementById("summary-next").textContent = proximo
          ? `${new Date(proximo.date).getDate()} ${getMonthShort(proximo.date)}`
          : "—";
      }

      function renderEventos() {
        const contenedor = document.getElementById("eventos-lista");

        if (!window.EVENTOS_DATA || !Array.isArray(window.EVENTOS_DATA) || window.EVENTOS_DATA.length === 0) {
          contenedor.innerHTML = `
            <section class="event-empty">
              <p class="syne" style="font-size:16px;font-weight:700;margin:0 0 4px">No hay eventos cargados</p>
              <p style="margin:0;color:var(--text-muted);font-size:13px">Agrega información en <strong>eventos-data.js</strong>.</p>
            </section>
          `;
          document.getElementById("summary-total").textContent = "0";
          document.getElementById("summary-next").textContent = "—";
          return;
        }

        const eventos = [...window.EVENTOS_DATA].sort((a, b) => getDateOnly(a.date) - getDateOnly(b.date));
        actualizarResumen(eventos);

        contenedor.innerHTML = eventos.map((evento, index) => `
          <section class="event-card" style="animation-delay:${index * 0.05}s">
            <div class="event-card-inner">
              <div class="event-top">
                <div>
                  <div class="event-type">${getTypeLabel(evento.type)}</div>
                  <div class="event-title">${evento.title}</div>
                </div>
                <div class="event-day-badge">
                  <div class="event-day-number">${new Date(evento.date).getDate()}</div>
                </div>
              </div>

              <div class="event-meta">
                <div class="event-line"><b>Fecha:</b> ${formatFecha(evento.date)}</div>
                ${evento.time ? `<div class="event-line"><b>Hora:</b> ${evento.time}</div>` : ""}
                ${evento.location ? `<div class="event-line"><b>Lugar:</b> ${evento.location}</div>` : ""}
                ${evento.description ? `<div class="event-line"><b>Detalle:</b> ${evento.description}</div>` : ""}
              </div>
            </div>
          </section>
        `).join("");
      }

      renderEventos();
    </script>
