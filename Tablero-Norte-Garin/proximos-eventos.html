<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Próximos eventos | Norte Garín</title>

    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDark = saved ? saved === "dark" : prefersDark;
        if (useDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg-main: #f1f5f9;
        --bg-card: #ffffff;
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --border: rgba(0, 0, 0, 0.08);
        --accent: #10b981;
        --shadow: 0 20px 50px rgba(2, 6, 23, 0.12);
        --btn-bg: rgba(255, 255, 255, 0.85);
      }

      html.dark {
        --bg-main: #0a0f1d;
        --bg-card: #121a2a;
        --text-primary: #f8fafc;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.06);
        --accent: #10b981;
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
        --btn-bg: rgba(18, 26, 42, 0.82);
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        margin: 0;
        padding-bottom: 40px;
      }

      .page-bg {
        min-height: 100vh;
        background-image: radial-gradient(900px 500px at 50% -10%, rgba(16, 185, 129, 0.16), transparent 60%);
      }

      .card {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .btn-surface {
        background: var(--btn-bg);
        border: 1px solid var(--border);
        color: var(--text-primary);
        box-shadow: 0 10px 25px rgba(2, 6, 23, 0.12);
        backdrop-filter: blur(8px);
      }
    </style>
  </head>

  <body class="page-bg">
    <header class="max-w-lg mx-auto px-6 pt-6 pb-4">
      <div class="flex items-center justify-between mb-5">
        <a href="index.html" class="btn-surface rounded-2xl px-4 py-3 font-bold text-sm">← Inicio</a>
        <button id="btnTheme" class="btn-surface rounded-2xl px-4 py-3 font-bold text-sm">
          <span id="theme-icon">🌙</span>
        </button>
      </div>

      <section class="card rounded-[32px] p-6 border-t-4" style="border-top-color: var(--accent)">
        <p class="text-[11px] font-black uppercase tracking-[0.2em]" style="color: var(--accent)">Agenda</p>
        <h1 class="text-3xl font-black tracking-tight mt-2">Próximos eventos</h1>
        <p class="text-sm mt-2" style="color: var(--text-muted)">
          Información centralizada desde <strong>eventos-data.js</strong>
        </p>
      </section>
    </header>

    <main class="max-w-lg mx-auto px-6">
      <div id="eventos-lista" class="space-y-4"></div>
    </main>

    <script src="eventos-data.js"></script>
    <script>
      const html = document.documentElement;
      const themeIcon = document.getElementById("theme-icon");

      function syncThemeIcon() {
        themeIcon.textContent = html.classList.contains("dark") ? "☀️" : "🌙";
      }

      function toggleTheme() {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        syncThemeIcon();
      }

      document.getElementById("btnTheme").onclick = toggleTheme;
      syncThemeIcon();

      function getDateOnly(date) {
        const d = new Date(date);
        d.setHours(0, 0, 0, 0);
        return d;
      }

      function formatFecha(dateStr) {
        const d = getDateOnly(dateStr);
        return d.toLocaleDateString("es-AR", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }

      function getTypeLabel(type) {
        if (type === "asamblea") return "Asamblea";
        if (type === "especial") return "Especial";
        if (type === "conmemoracion") return "Conmemoración";
        return "Evento";
      }

      function renderEventos() {
        const contenedor = document.getElementById("eventos-lista");

        if (!window.EVENTOS_DATA || !Array.isArray(window.EVENTOS_DATA) || window.EVENTOS_DATA.length === 0) {
          contenedor.innerHTML = `
            <section class="card rounded-[28px] p-5">
              <p class="font-extrabold text-base">No hay eventos cargados</p>
            </section>
          `;
          return;
        }

        const eventos = [...window.EVENTOS_DATA].sort((a, b) => getDateOnly(a.date) - getDateOnly(b.date));

        contenedor.innerHTML = eventos.map((evento) => `
          <section class="card rounded-[28px] p-5">
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="text-[11px] font-black uppercase tracking-[0.18em]" style="color: var(--accent)">
                  ${getTypeLabel(evento.type)}
                </p>
                <h2 class="text-lg font-extrabold leading-tight mt-2">${evento.title}</h2>
              </div>
              <div class="shrink-0 rounded-2xl px-3 py-2 text-[11px] font-black uppercase bg-emerald-500/10 text-emerald-600">
                ${new Date(evento.date).getDate()}
              </div>
            </div>

            <div class="mt-4 space-y-2 text-sm">
              <p><span class="font-bold">Fecha:</span> ${formatFecha(evento.date)}</p>
              ${evento.time ? `<p><span class="font-bold">Hora:</span> ${evento.time}</p>` : ""}
              ${evento.location ? `<p><span class="font-bold">Lugar:</span> ${evento.location}</p>` : ""}
              ${evento.description ? `<p><span class="font-bold">Detalle:</span> ${evento.description}</p>` : ""}
            </div>
          </section>
        `).join("");
      }

      renderEventos();
    </script>
  </body>
</html>
