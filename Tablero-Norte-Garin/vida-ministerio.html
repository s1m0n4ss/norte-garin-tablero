JUAN 4:24.</p>

    <script>
      const html = document.documentElement;
      const themeIcon = document.getElementById("themeIcon");
      const thumbs = document.getElementById("thumbs");
      const tmpl = document.getElementById("weeksTmpl");
      const allWeeks = Array.from(tmpl.content.querySelectorAll("article.page"));
      let filteredWeeks = [];
      let currentIndex = 0;

      document.getElementById("themeBtn").onclick = () => {
        html.classList.toggle("dark");
        const isDark = html.classList.contains("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        themeIcon.textContent = isDark ? "☀️" : "🌙";
      };

      document.getElementById("menuBtn").onclick = () => {
        document.getElementById("sidebar").classList.add("open");
        document.getElementById("menuOverlay").classList.add("show");
      };
      document.getElementById("menuOverlay").onclick = () => {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("menuOverlay").classList.remove("show");
      };

      function render() {
        thumbs.innerHTML = "";
        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);
        const diaS = hoy.getDay();
        const diff = hoy.getDate() - diaS + (diaS === 0 ? -6 : 1);
        const lunesActual = new Date(new Date().setDate(diff));
        lunesActual.setHours(0, 0, 0, 0);

        filteredWeeks = allWeeks.filter(w => {
          const fechaSemana = new Date(w.dataset.key + "T00:00:00");
          return fechaSemana >= lunesActual;
        });

        filteredWeeks.forEach((w, i) => {
          const card = document.createElement("article");
          card.className = "week-card";
          const fechaSemana = new Date(w.dataset.key + "T00:00:00");
          if (fechaSemana.getTime() === lunesActual.getTime()) {
            card.classList.add("week-current");
            card.innerHTML += `<span class="badge-now">● SEMANA ACTUAL</span>`;
          }
          if (w.dataset.book === "ASAMBLEA") card.classList.add("card-asamblea");
          else {
            const colors = ["card-verde", "card-amarillo", "card-rojo"];
            card.classList.add(colors[i % 3]);
          }
          const subText = w.dataset.book === "ASAMBLEA" ? "Semana 23 de febrero" : (w.querySelector(".presidente-en-pagina")?.textContent || "");
          card.innerHTML += `<div class="flex justify-between items-start mb-2"><h3 class="week-title">${w.dataset.title}</h3><span class="tag">${w.dataset.book}</span></div><p class="week-sub">${subText}</p><p class="week-cta">Ver programa</p>`;
          card.onclick = () => openWeek(i);
          thumbs.appendChild(card);
        });
      }

      function openWeek(i) {
        currentIndex = i;
        const w = filteredWeeks[i];
        document.getElementById("vTitle").textContent = w.dataset.title;
        document.getElementById("vSub").textContent = w.dataset.book;
        document.getElementById("vContent").innerHTML = "";
        document.getElementById("vContent").appendChild(w.cloneNode(true));
        document.getElementById("viewer").classList.add("show");
        document.getElementById("viewerOverlay").classList.add("show");
        document.body.style.overflow = "hidden";
      }

      document.getElementById("closeViewer").onclick = () => {
        document.getElementById("viewer").classList.remove("show");
        document.getElementById("viewerOverlay").classList.remove("show");
        document.body.style.overflow = "";
      };
      document.getElementById("prevWeek").onclick = () => openWeek((currentIndex + filteredWeeks.length - 1) % filteredWeeks.length);
      document.getElementById("nextWeek").onclick = () => openWeek((currentIndex + 1) % filteredWeeks.length);

      render();
    </script>
  </body>
