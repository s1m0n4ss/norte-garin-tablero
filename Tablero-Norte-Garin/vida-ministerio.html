    <!-- Anti "flash" de tema -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDark = saved ? saved === "dark" : prefersDark;
        if (useDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        --bg-main: #f1f5f9;
        --bg-card: #ffffff;
        --border: rgba(0, 0, 0, 0.08);
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;

        --verde: #10b981;
        --amarillo: #f59e0b;
        --rojo: #ef4444;

        --header-bg: rgba(241, 245, 249, 0.86);
        --btn-bg: rgba(255, 255, 255, 0.85);

        --shadow: 0 20px 50px rgba(2, 6, 23, 0.12);
        --btn-shadow: 0 10px 25px rgba(2, 6, 23, 0.12);

        --soft: rgba(2, 6, 23, 0.04);
      }

      html.dark {
        --bg-main: #0a0f1d;
        --bg-card: #121a2a;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #60a5fa;

        --verde: #34d399;
        --amarillo: #fbbf24;
        --rojo: #f87171;

        --header-bg: rgba(10, 15, 29, 0.78);
        --btn-bg: rgba(18, 26, 42, 0.82);

        --shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
        --btn-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);

        --soft: rgba(255, 255, 255, 0.05);
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: var(--bg-main);
        color: var(--text);
        padding-bottom: 40px;
      }

      .page-bg {
        min-height: 100vh;
        background-image: radial-gradient(
          900px 500px at 50% -10%,
          rgba(59, 130, 246, 0.16),
          transparent 60%
        );
      }

      .container {
        width: min(520px, 100%);
        margin: 0 auto;
        padding: 0 18px;
      }

      /* Banner */
      header.topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--header-bg);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        padding: 8px 0;
      }

      .hero-banner {
        position: relative;
        width: 100%;
        height: 168px;
        border-radius: 26px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .hero-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.8) 0%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.6) 100%
        );
      }

      .btn-surface {
        background: var(--btn-bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 14px;
        padding: 10px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--btn-shadow);
        backdrop-filter: blur(8px);
        transition: transform 0.1s ease;
      }

      .btn-surface:active {
        transform: scale(0.95);
      }

      /* Listado */
      .list {
        padding: 18px 0 40px;
      }

      .week-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: 24px;
        padding: 14px;
        cursor: pointer;
        transition: transform 0.15s ease;
        margin-bottom: 14px;
        position: relative;
      }

      .week-card:active {
        transform: scale(0.99);
      }

      .week-current {
        border: 2.5px solid var(--accent) !important;
        transform: scale(1.01);
      }

      .badge-now {
        font-size: 9px;
        font-weight: 900;
        color: var(--accent);
        margin-bottom: 6px;
        display: block;
      }

      .card-verde {
        border-top: 4px solid var(--verde);
      }
      .card-amarillo {
        border-top: 4px solid var(--amarillo);
      }
      .card-rojo {
        border-top: 4px solid var(--rojo);
      }
      .card-asamblea {
        border-top: 4px solid var(--accent);
      }

      .week-title {
        font-size: 17px;
        font-weight: 900;
        margin: 0;
      }

      .tag {
        border: 1px solid var(--border);
        background: var(--soft);
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 999px;
      }

      .week-sub {
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0;
      }

      .week-cta {
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--accent);
        margin-top: 10px;
      }

      /* Visor */
      .viewer {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(92vw, 600px);
        height: min(85vh, 800px);
        background: var(--bg-main);
        border-radius: 26px;
        z-index: 100;
        display: none;
        overflow: hidden;
        flex-direction: column;
        box-shadow: var(--shadow);
      }
      .viewer.show {
        display: flex;
      }

      .v-head {
        background: var(--bg-card);
        padding: 15px;
        border-bottom: 1px solid var(--border);
      }

      .v-body {
        padding: 15px;
        overflow-y: auto;
        flex: 1;
      }

      .page {
        background: var(--bg-card);
        border-radius: 20px;
        padding: 20px;
        border: 1px solid var(--border);
      }

      .bloque {
        margin-top: 20px;
      }

      .bloque h3 {
        font-size: 12px;
        font-weight: 900;
        border-bottom: 3px solid currentColor;
        padding-bottom: 5px;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }

      .verde h3 {
        color: var(--verde);
      }
      .amarillo h3 {
        color: var(--amarillo);
      }
      .rojo h3 {
        color: var(--rojo);
      }

      .section {
        background: var(--soft);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 10px;
        border: 1px solid var(--border);
      }

      .sect-title h4 {
        margin: 0;
        font-size: 14px;
        font-weight: 900;
      }

      .asignado {
        font-size: 12px;
        font-weight: 900;
        color: var(--muted);
        text-transform: uppercase;
        display: block;
        margin-top: 6px;
      }

      .duration {
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
        margin-top: 4px;
      }

      .presidente-en-pagina {
        text-align: center;
        font-weight: 900;
        margin-bottom: 15px;
      }

      .inicio-programa,
      .pie {
        text-align: center;
        font-size: 13px;
        line-height: 1.5;
      }

      /* Menú lateral (igual estilo index, pero usando tu estructura overlay + sidebar) */
      .menu-overlay,
      .viewer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        z-index: 60;
        display: none;
      }
      .menu-overlay.show,
      .viewer-overlay.show {
        display: block;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px;
        height: 100vh;
        z-index: 70;
        transform: translateX(-110%);
        transition: transform 0.3s ease;
        background: rgba(18, 26, 42, 0.95);
        backdrop-filter: blur(16px);
        padding: 25px;
        color: #fff;
      }
      .sidebar.open {
        transform: translateX(0);
      }

      .side-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .side-badge {
        width: 42px;
        height: 42px;
        border-radius: 16px;
        background: rgba(59, 130, 246, 0.18);
        display: grid;
        place-items: center;
        font-weight: 900;
        color: #60a5fa;
      }
      .side-title {
        margin: 0;
        font-weight: 900;
        line-height: 1.1;
      }
      .side-sub {
        margin: 2px 0 0;
        font-size: 10px;
        opacity: 0.7;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .nav-link {
        display: block;
        padding: 12px 14px;
        border-radius: 16px;
        font-weight: 900;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 10px;
      }
      .nav-link.active {
        background: rgba(59, 130, 246, 0.75);
        border-color: rgba(59, 130, 246, 0.85);
      }
    </style>
  </head>

    <script>
      // ===== Tema + menú (igual experiencia que index)
      const html = document.documentElement;
      const themeIcon = document.getElementById("theme-icon");
      const sidebar = document.getElementById("sidebar");
      const menuOverlay = document.getElementById("menuOverlay");

      function syncThemeIcon() {
        themeIcon.textContent = html.classList.contains("dark") ? "☀️" : "🌙";
      }

      function toggleTheme() {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        syncThemeIcon();
      }

      document.getElementById("btnTheme").onclick = toggleTheme;
      syncThemeIcon();

      document.getElementById("btnMenu").onclick = () => {
        sidebar.classList.add("open");
        sidebar.setAttribute("aria-hidden", "false");
        menuOverlay.classList.add("show");
      };

      menuOverlay.onclick = () => {
        sidebar.classList.remove("open");
        sidebar.setAttribute("aria-hidden", "true");
        menuOverlay.classList.remove("show");
      };

      // ===== Render del contenido (tu lógica intacta)
      const thumbs = document.getElementById("thumbs");
      const tmpl = document.getElementById("weeksTmpl");
      const allWeeks = Array.from(tmpl.content.querySelectorAll("article.page"));

      let filteredWeeks = [];
      let currentIndex = 0;

      function render() {
        thumbs.innerHTML = "";

        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);

        // Lunes de la semana actual (ISO-ish)
        const diaS = hoy.getDay();
        const diff = hoy.getDate() - diaS + (diaS === 0 ? -6 : 1);
        const lunesActual = new Date(new Date().setDate(diff));
        lunesActual.setHours(0, 0, 0, 0);

        filteredWeeks = allWeeks.filter((w) => {
          const fechaSemana = new Date(w.dataset.key + "T00:00:00");
          return fechaSemana >= lunesActual;
        });

        filteredWeeks.forEach((w, i) => {
          const card = document.createElement("article");
          card.className = "week-card";

          const fechaSemana = new Date(w.dataset.key + "T00:00:00");
          if (fechaSemana.getTime() === lunesActual.getTime()) {
            card.classList.add("week-current");
            card.innerHTML += `<span class="badge-now">● SEMANA ACTUAL</span>`;
          }

          if (w.dataset.book === "ASAMBLEA") card.classList.add("card-asamblea");
          else {
            const colors = ["card-verde", "card-amarillo", "card-rojo"];
            card.classList.add(colors[i % 3]);
          }

          const subText =
            w.dataset.book === "ASAMBLEA"
              ? "Semana 23 de febrero"
              : w.querySelector(".presidente-en-pagina")?.textContent || "";

          card.innerHTML += `
            <div class="flex justify-between items-start mb-2 gap-3">
              <h3 class="week-title">${w.dataset.title}</h3>
              <span class="tag">${w.dataset.book}</span>
            </div>
            <p class="week-sub">${subText}</p>
            <p class="week-cta">Ver programa</p>
          `;

          card.onclick = () => openWeek(i);
          thumbs.appendChild(card);
        });
      }

      function openWeek(i) {
        currentIndex = i;
        const w = filteredWeeks[i];

        document.getElementById("vTitle").textContent = w.dataset.title;
        document.getElementById("vSub").textContent = w.dataset.book;

        const vContent = document.getElementById("vContent");
        vContent.innerHTML = "";
        vContent.appendChild(w.cloneNode(true));

        document.getElementById("viewer").classList.add("show");
        document.getElementById("viewerOverlay").classList.add("show");
        document.body.style.overflow = "hidden";
      }

      function closeViewer() {
        document.getElementById("viewer").classList.remove("show");
        document.getElementById("viewerOverlay").classList.remove("show");
        document.body.style.overflow = "";
      }

      document.getElementById("closeViewer").onclick = closeViewer;
      document.getElementById("viewerOverlay").onclick = closeViewer;

      document.getElementById("prevWeek").onclick = () =>
        openWeek((currentIndex + filteredWeeks.length - 1) % filteredWeeks.length);

      document.getElementById("nextWeek").onclick = () =>
        openWeek((currentIndex + 1) % filteredWeeks.length);

      render();
    </script>
  </body>
</html>
