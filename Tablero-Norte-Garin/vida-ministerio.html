    <style>
      :root {
        --bg: #f7f5f0; --bg-card: #ffffff; --bg-card2: #f0ede8;
        --text: #1a1714; --text-muted: #8a8075;
        --accent: #2d6a4f; --accent-light: #52b788; --accent-warm: #d4a853;
        --border: rgba(26,23,20,0.09);
        --shadow-sm: 0 2px 12px rgba(26,23,20,0.07);
        --shadow-md: 0 8px 32px rgba(26,23,20,0.10);
        --shadow-lg: 0 24px 64px rgba(26,23,20,0.13);
        --verde: #2d9e6b; --amarillo: #c4890a; --rojo: #c0392b;
      }
      html.dark {
        --bg: #1e2023; --bg-card: #272b2f; --bg-card2: #2f3338;
        --text: #eceae6; --text-muted: #8a8d92;
        --accent: #4caf80; --accent-light: #6fcf97; --accent-warm: #d4a853;
        --border: rgba(255,255,255,0.08);
        --shadow-sm: 0 2px 12px rgba(0,0,0,0.15);
        --shadow-md: 0 8px 32px rgba(0,0,0,0.20);
        --shadow-lg: 0 24px 64px rgba(0,0,0,0.28);
        --verde: #4caf80; --amarillo: #d4a853; --rojo: #e07060;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg); color: var(--text);
        margin: 0; padding-bottom: env(safe-area-inset-bottom, 48px);
        overflow-x: hidden;
      }
      body::before {
        content: ''; position: fixed; inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none; z-index: 0; opacity: 0.6;
      }
      .syne { font-family: "Syne", sans-serif; }

      #sidebar {
        position: fixed; top: 0; left: 0; height: 100%; width: 300px;
        background: var(--bg-card); border-right: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        transform: translateX(-100%);
        transition: transform 0.38s cubic-bezier(0.4,0,0.2,1);
        z-index: 200; overflow-y: auto;
      }
      #sidebar.open { transform: translateX(0); }
      .sidebar-header { padding: 32px 28px 24px; border-bottom: 1px solid var(--border); }
      .sidebar-logo { display: flex; align-items: center; gap: 14px; }
      .logo-mark { width: 44px; height: 44px; background: var(--accent); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .sidebar-nav { padding: 20px 16px; }
      .nav-section-label {
        font-family: "Syne", sans-serif; font-size: 0.95rem; font-weight: 700;
        letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-muted);
        padding: 0 12px; margin-bottom: 8px; margin-top: 16px;
      }
      .nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 13px 16px; border-radius: 14px;
        color: var(--text-muted); text-decoration: none;
        font-size: 1rem; font-weight: 500;
        transition: all 0.18s ease; margin-bottom: 2px;
      }
      .nav-item:hover { background: var(--bg-card2); color: var(--text); }
      .nav-item.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 700; }
      .nav-item .icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--bg-card2); }
      .nav-item.active .icon { background: color-mix(in srgb, var(--accent) 15%, transparent); }

      #overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.45);
        backdrop-filter: blur(4px); z-index: 199;
        opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      }
      #overlay.visible { opacity: 1; pointer-events: all; }

      .hero-wrap { position: relative; width: 100%; height: 220px; overflow: hidden; }
      .hero-img { width: 100%; height: 100%; object-fit: cover; transition: transform 8s ease; }
      .hero-wrap:hover .hero-img { transform: scale(1.04); }
      .hero-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.02) 40%, rgba(0,0,0,0.55) 100%); }
      .hero-top-bar {
        position: absolute; top: 0; left: 0; right: 0;
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top));
      }
      .hero-content { position: absolute; bottom: 20px; left: 24px; }
      .hero-title { font-family: "Syne", sans-serif; font-size: 1.778rem; font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; color: #fff; text-transform: uppercase; }
      .hero-sub { color: rgba(255,255,255,0.6); font-size: 0.95rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 4px; }
      .icon-btn {
        width: 42px; height: 42px; border-radius: 13px;
        background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.25);
        backdrop-filter: blur(10px); color: #fff;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.15s ease;
      }
      .icon-btn:active { transform: scale(0.92); }

      .main-wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; position: relative; z-index: 1; }

      .week-card {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 20px; padding: 16px 18px;
        margin-bottom: 10px; cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: all 0.18s ease;
        position: relative; overflow: hidden;
        animation: fadeUp 0.4s ease both;
      }
      @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      .week-card:active { transform: scale(0.98); }
      .week-card.current {
        border-color: color-mix(in srgb, var(--accent) 40%, transparent);
        box-shadow: 0 4px 24px color-mix(in srgb, var(--accent) 14%, transparent);
      }

      .week-card-accent {
        position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
        border-radius: 20px 0 0 20px;
      }
      .accent-verde { background: var(--verde); }
      .accent-amarillo { background: var(--amarillo); }
      .accent-rojo { background: var(--rojo); }
      .accent-special { background: var(--accent-warm); }

      .week-card-inner { padding-left: 10px; }
      .current-badge {
        font-family: "Syne", sans-serif; font-size: 0.95rem; font-weight: 700;
        letter-spacing: 0.03em; text-transform: uppercase;
        color: var(--accent); margin-bottom: 5px; display: block;
      }
      .week-title {
        font-family: "Syne", sans-serif; font-size: 1rem; font-weight: 700;
        margin: 0 0 4px; line-height: 1.2;
      }
      .week-book {
        display: inline-block; font-family: "Syne", sans-serif;
        font-size: 0.95rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--text-muted); background: var(--bg-card2);
        border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px;
        margin-bottom: 6px;
      }
      .week-sub {
        font-size: 0.95rem; color: var(--text-muted); margin: 0;
      }
      .week-cta {
        display: flex; align-items: center; gap: 4px;
        font-family: "Syne", sans-serif; font-size: 0.95rem; font-weight: 700;
        letter-spacing: 0.03em; text-transform: uppercase;
        color: var(--accent); margin-top: 10px;
      }

      #viewer-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        backdrop-filter: blur(6px); z-index: 300;
        opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      }
      #viewer-overlay.visible { opacity: 1; pointer-events: all; }

      #viewer {
        position: fixed; left: 50%; top: 50%;
        transform: translate(-50%, -50%) scale(0.96);
        width: min(92vw, 500px); height: min(88vh, 780px);
        background: var(--bg); border-radius: 26px;
        z-index: 301; display: none; flex-direction: column;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
        transition: transform 0.3s ease, opacity 0.3s ease;
        opacity: 0;
      }
      #viewer.visible { display: flex; transform: translate(-50%, -50%) scale(1); opacity: 1; }

      .viewer-head {
        background: var(--bg-card); border-bottom: 1px solid var(--border);
        border-radius: 26px 26px 0 0; padding: 18px 18px 14px; flex-shrink: 0;
      }
      .viewer-head-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .viewer-week-title { font-family: "Syne", sans-serif; font-size: 1rem; font-weight: 700; line-height: 1.2; }
      .viewer-week-book {
        font-family: "Syne", sans-serif; font-size: 0.95rem; font-weight: 700;
        letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--accent); margin-top: 3px;
      }
      .viewer-close {
        width: 36px; height: 36px; border-radius: 10px;
        background: var(--bg-card2); border: 1px solid var(--border);
        color: var(--text-muted); display: flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0; transition: all 0.15s ease;
      }
      .viewer-close:active { transform: scale(0.92); }
      .viewer-nav { display: flex; gap: 8px; }
      .viewer-nav-btn {
        flex: 1; padding: 9px; border-radius: 11px;
        background: var(--bg-card2); border: 1px solid var(--border);
        font-family: "Syne", sans-serif; font-size: 0.95rem; font-weight: 700;
        letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-muted);
        cursor: pointer; transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; gap: 6px;
      }
      .viewer-nav-btn:active { transform: scale(0.97); }
      .viewer-body { flex: 1; overflow-y: auto; padding: 16px; }

      .prog-intro {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
        font-size: 1rem; color: var(--text-muted); line-height: 1.5; text-align: center;
      }
      .prog-intro strong { color: var(--text); font-weight: 700; }
      .prog-presidente {
        font-family: "Syne", sans-serif; font-size: 0.95rem; font-weight: 700;
        letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
        margin-bottom: 6px;
      }

      .prog-bloque { margin-bottom: 12px; }
      .prog-bloque-header {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 12px; border-radius: 10px;
        font-family: "Syne", sans-serif; font-size: 0.95rem; font-weight: 700;
        letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 6px;
      }
      .bloque-verde .prog-bloque-header { background: color-mix(in srgb, var(--verde) 12%, transparent); color: var(--verde); }
      .bloque-amarillo .prog-bloque-header { background: color-mix(in srgb, var(--amarillo) 12%, transparent); color: var(--amarillo); }
      .bloque-rojo .prog-bloque-header { background: color-mix(in srgb, var(--rojo) 12%, transparent); color: var(--rojo); }

      .prog-item {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 14px; padding: 12px 14px; margin-bottom: 6px;
      }
      .prog-item-title { font-size: 1rem; font-weight: 600; line-height: 1.3; color: var(--text); }
      .prog-item-meta {
        display: flex; align-items: center; justify-content: space-between;
        margin-top: 6px; gap: 8px;
      }
      .prog-item-assigned {
        font-family: "Syne", sans-serif; font-size: 0.95rem; font-weight: 700;
        letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-muted);
      }
      .prog-item-time {
        font-family: "Syne", sans-serif; font-size: 0.95rem; font-weight: 700;
        color: var(--text-muted); background: var(--bg-card2);
        border: 1px solid var(--border); padding: 2px 8px; border-radius: 6px;
        white-space: nowrap; flex-shrink: 0;
      }

      .prog-cancion {
        background: color-mix(in srgb, var(--rojo) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--rojo) 15%, transparent);
        border-radius: 12px; padding: 10px 14px; margin-bottom: 6px;
        font-family: "Syne", sans-serif; font-size: 0.95rem; font-weight: 700;
        color: var(--rojo);
      }

      .prog-pie {
        background: var(--bg-card2); border: 1px solid var(--border);
        border-radius: 14px; padding: 12px 16px; margin-top: 4px;
        font-size: 0.95rem; color: var(--text-muted); text-align: center; line-height: 1.5;
      }
      .prog-pie strong { color: var(--text); font-weight: 700; }

      .prog-asamblea {
        background: color-mix(in srgb, var(--accent-warm) 10%, var(--bg-card));
        border: 1px solid color-mix(in srgb, var(--accent-warm) 25%, transparent);
        border-radius: 18px; padding: 28px 20px; text-align: center;
      }
      .prog-asamblea-title {
        font-family: "Syne", sans-serif; font-size: 1.222rem; font-weight: 700;
        color: var(--accent-warm); text-transform: uppercase; margin-bottom: 8px;
      }
      .prog-asamblea-sub { font-size: 1rem; color: var(--text-muted); margin-bottom: 16px; }
      .prog-asamblea-note {
        background: color-mix(in srgb, var(--accent-warm) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent-warm) 20%, transparent);
        border-radius: 14px; padding: 14px 16px;
        font-size: 1rem; color: var(--text); line-height: 1.5;
      }
    </style>

        <div class="ng-row">
          <button type="button" class="ng-menu-btn" id="btnMenu" aria-label="Abrir menú de secciones"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="8" y2="8"/><line x1="4" x2="14" y1="16" y2="16"/></svg><span>Menú</span></button>
          <a class="ng-brand" href="index.html">Norte Garín</a>
          <button type="button" class="ng-gear" id="ngSettingsBtn" aria-label="Configuración: tamaño de letra y modo claro u oscuro" aria-haspopup="dialog" aria-expanded="false" aria-controls="ngSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        </div>
      </div>
    </header>
    <div class="main-wrap ng-page-head"><div class="hero-content">
          <h1 class="hero-title">Vida y Ministerio</h1>
        </div></div>

    <main class="main-wrap">
      <div id="notif-banner-container"></div>
      <div id="thumbs" class="ng-stack"></div>
    </main>

    <div id="viewer-overlay"></div>
    <div id="viewer" role="dialog" aria-modal="true">
      <div class="viewer-head">
        <div class="viewer-head-top">
          <div>
            <div class="viewer-week-title" id="v-title"></div>
            <div class="viewer-week-book" id="v-book"></div>
          </div>
          <button class="viewer-close" id="closeViewer" aria-label="Cerrar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="viewer-nav">
          <button class="viewer-nav-btn" id="prevWeek">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Anterior
          </button>
          <button class="viewer-nav-btn" id="nextWeek">
            Siguiente
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <div class="viewer-body" id="v-content"></div>
    </div>

    <template id="weeksTmpl"></template>

    <script src="vida-ministerio-data.js"></script>
    <script>
      const html = document.documentElement;
      const iconMoon = document.getElementById("theme-icon-moon");
      const iconSun  = document.getElementById("theme-icon-sun");

      function applyThemeIcons() {
        const dark = html.classList.contains("dark");
        iconMoon.style.display = dark ? "none" : "block";
        iconSun.style.display  = dark ? "block" : "none";
      }
      applyThemeIcons();

      document.getElementById("btnTheme").onclick = () => {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        applyThemeIcons();
      };

      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      document.getElementById("btnMenu").onclick = () => {
        sidebar.classList.add("open");
        overlay.classList.add("visible");
      };
      overlay.onclick = () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("visible");
      };

      const viewerOverlay = document.getElementById("viewer-overlay");
      const viewer = document.getElementById("viewer");
      let filteredWeeks = [], currentIndex = 0;

      function hydrateTemplateFromData() {
        const tmpl = document.getElementById("weeksTmpl");
        tmpl.innerHTML = window.VIDA_MINISTERIO_DATA || "";
      }

      function openViewer(i) {
        currentIndex = i;
        const w = filteredWeeks[i];
        document.getElementById("v-title").textContent = w.dataset.title;
        document.getElementById("v-book").textContent = w.dataset.book;
        document.getElementById("v-content").innerHTML = buildViewerContent(w);
        viewerOverlay.classList.add("visible");
        viewer.style.display = "flex";
        requestAnimationFrame(() => viewer.classList.add("visible"));
        document.body.style.overflow = "hidden";
      }

      function closeViewer() {
        viewer.classList.remove("visible");
        viewerOverlay.classList.remove("visible");
        setTimeout(() => { viewer.style.display = "none"; }, 300);
        document.body.style.overflow = "";
      }

      document.getElementById("closeViewer").onclick = closeViewer;
      viewerOverlay.onclick = closeViewer;
      document.getElementById("prevWeek").onclick = () => openViewer((currentIndex + filteredWeeks.length - 1) % filteredWeeks.length);
      document.getElementById("nextWeek").onclick = () => openViewer((currentIndex + 1) % filteredWeeks.length);

      function buildViewerContent(w) {
        if (w.dataset.book === "ASAMBLEA") {
          return `<div class="prog-asamblea">
            <div class="prog-asamblea-title">Asamblea regional de los Testigos de Jehová</div>
            <div class="prog-
            <div class="prog-asamblea-sub">No habrá reunión en el Salón del Reino</div>
            <div class="prog-asamblea-note">Tema: <strong>"Felices para siempre"</strong> </div>
          </div>`;
        }

        let out = "";

        const pres = w.querySelector(".presidente-en-pagina");
        const inicio = w.querySelector(".inicio-programa");
        if (pres || inicio) {
          out += `<div class="prog-intro">`;
          if (pres) out += `<div class="prog-presidente">${pres.textContent.trim()}</div>`;
          if (inicio) out += inicio.innerHTML;
          out += `</div>`;
        }

        const lectorEstudio = w.querySelector(".lector-estudio");
        const lectorNombre = lectorEstudio ? lectorEstudio.textContent.trim() : "";

        w.querySelectorAll(".bloque").forEach(bloque => {
          const isVerde = bloque.classList.contains("verde");
          const isAmarillo = bloque.classList.contains("amarillo");
          const isRojo = !isVerde && !isAmarillo;
          const colorClass = isVerde ? "bloque-verde" : isAmarillo ? "bloque-amarillo" : "bloque-rojo";
          const h3 = bloque.querySelector("h3");

          out += `<div class="prog-bloque ${colorClass}">`;
          if (h3) out += `<div class="prog-bloque-header">${h3.textContent}</div>`;

          bloque.querySelectorAll(".section").forEach(sec => {
            const h4 = sec.querySelector("h4");
            const title = h4 ? h4.textContent.trim() : "";

            if (/^Canci[oó]n\s+\d+/i.test(title)) {
              out += `<div class="prog-cancion">♪ ${title}</div>`;
              return;
            }

            const asignado = sec.querySelector(".asignado");
            const duration = sec.querySelector(".duration");
            out += `<div class="prog-item">
              <div class="prog-item-title">${title}</div>
              <div class="prog-item-meta">
                <span class="prog-item-assigned">${asignado ? asignado.textContent.trim() : ""}</span>
                ${duration ? `<span class="prog-item-time">${duration.textContent.trim()}</span>` : ""}
              </div>
            </div>`;
          });

          if (isRojo && lectorNombre) {
            out += `<div class="prog-item">
              <div class="prog-item-meta">
                <span class="prog-item-assigned">Lector</span>
                <span class="prog-item-assigned">${lectorNombre}</span>
              </div>
            </div>`;
          }

          out += `</div>`;
        });

        const pie = w.querySelector(".pie");
        if (pie) out += `<div class="prog-pie">${pie.innerHTML}</div>`;

        return out;
      }

      // ── Programa con el formato de la guía oficial (mismo orden, colores e íconos de sección) ──
      const NG_MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
      const NG_SVG = {
        music: '<svg class="vm-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
        gem: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M11 3 8 9l4 12 4-12-3-6"/><path d="M2 9h20"/></svg>',
        wheat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22V9"/><path d="M12 9c-2.5 0-4-1.8-4-4.5C10.5 4.5 12 6.3 12 9Z"/><path d="M12 9c2.5 0 4-1.8 4-4.5C13.5 4.5 12 6.3 12 9Z"/><path d="M12 14c-2.5 0-4-1.8-4-4.5 2.5 0 4 1.8 4 4.5Z"/><path d="M12 14c2.5 0 4-1.8 4-4.5-2.5 0-4 1.8-4 4.5Z"/><path d="M12 19c-2.5 0-4-1.8-4-4.5 2.5 0 4 1.8 4 4.5Z"/><path d="M12 19c2.5 0 4-1.8 4-4.5-2.5 0-4 1.8-4 4.5Z"/><path d="M12 9V2"/></svg>',
        sheep: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.5 6.5a3 3 0 0 1 4.4-.6 3 3 0 0 1 4.2 1.4 2.8 2.8 0 0 1 1.9 4.2 2.8 2.8 0 0 1-1.6 4 3 3 0 0 1-4.3 1.2 3 3 0 0 1-4.2-.3 3 3 0 0 1-3.4-2.9 2.8 2.8 0 0 1 .4-5.3 3 3 0 0 1 2.6-1.7Z"/><ellipse cx="5" cy="10.6" rx="2.3" ry="1.7" transform="rotate(-20 5 10.6)"/><rect x="9" y="16" width="1.7" height="5" rx=".8"/><rect x="14.6" y="16" width="1.7" height="5" rx=".8"/></svg>'
      };
      const ngEsc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      // "LUCAS SEGOVIA" → "Lucas Segovia" (solo cambia cómo se ve)
      const ngNombre = t => String(t || "").toLocaleLowerCase("es").replace(/(^|[\s\/(\-])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase("es"));
      function ngFechaSemana(lun) { // "2-8 DE NOVIEMBRE"
        const dom = new Date(lun); dom.setDate(dom.getDate() + 6);
        return (lun.getMonth() === dom.getMonth()
          ? lun.getDate() + "-" + dom.getDate() + " DE " + NG_MESES[dom.getMonth()]
          : lun.getDate() + " DE " + NG_MESES[lun.getMonth()] + " A " + dom.getDate() + " DE " + NG_MESES[dom.getMonth()]).toUpperCase();
      }
      function ngSeparar(el) {
        const c = el.cloneNode(true), nombres = [];
        c.querySelectorAll(".asignado").forEach(a => { const t = a.textContent.trim(); if (t) nombres.push(ngNombre(t)); a.remove(); });
        return { texto: c.textContent.replace(/\s+/g, " ").replace(/[\s:]+$/, "").trim(), nombres };
      }
      function ngPrograma(w) {
        if (w.dataset.book === "ASAMBLEA") {
          return `<div class="ng-note" style="margin-top:1rem"><strong>Asamblea regional de los Testigos de Jehová.</strong><br>No habrá reunión en el Salón del Reino.<br>Tema: <strong>"Felices para siempre"</strong></div>`;
        }
        let out = "";
        const pres = w.querySelector(".presidente-en-pagina");
        if (pres && !/^\s*Presidente:/i.test(pres.textContent)) out += `<p class="ng-note" style="margin-top:1rem">${ngEsc(pres.textContent.trim())}</p>`;
        const inicio = w.querySelector(".inicio-programa");
        if (inicio) {
          const p = ngSeparar(inicio);
          let linea = p.texto;
          if (/canci[oó]n/i.test(linea) && !/introducci/i.test(linea)) linea += " | Palabras de introducción (1 min.)";
          out += `<div class="vm-open">${NG_SVG.music}<div>${ngEsc(linea)}${p.nombres.length ? `<span class="sub">Oración: <strong>${ngEsc(p.nombres.join(", "))}</strong></span>` : ""}</div></div>`;
        }
        const lectorEl = w.querySelector(".lector-estudio");
        const lector = lectorEl ? lectorEl.textContent.trim() : "";
        let lectorPuesto = false;
        w.querySelectorAll(".bloque").forEach(bloque => {
          const cls = bloque.classList.contains("verde") ? "tesoros" : bloque.classList.contains("amarillo") ? "maestros" : "vida";
          const ico = cls === "tesoros" ? NG_SVG.gem : cls === "maestros" ? NG_SVG.wheat : NG_SVG.sheep;
          const h3 = bloque.querySelector("h3");
          out += `<div class="vm-sec ${cls}"><span class="vm-ico">${ico}</span><h4>${ngEsc(h3 ? h3.textContent.trim().toLocaleUpperCase("es") : "")}</h4></div>`;
          bloque.querySelectorAll(".section").forEach(sec => {
            const h4 = sec.querySelector("h4");
            const titulo = h4 ? h4.textContent.trim() : "";
            if (/^Canci[oó]n\s+\d+/i.test(titulo)) { out += `<div class="vm-song">${NG_SVG.music}<div>${ngEsc(titulo)}</div></div>`; return; }
            const a = sec.querySelector(".asignado"), du = sec.querySelector(".duration");
            const quien = a && a.textContent.trim() ? ngNombre(a.textContent.trim()) : "";
            const estudio = /estudio b[ií]blico/i.test(titulo);
            out += `<div class="vm-part ${cls}"><div class="ti">${ngEsc(titulo)}</div><div class="det">
              ${du ? `<div class="dur">${ngEsc(du.textContent.trim())}</div>` : ""}
              ${quien ? `<div class="name">${estudio ? '<span class="ng-label">Conductor:</span> ' : ""}${ngEsc(quien)}</div>` : ""}
              ${estudio && lector ? `<div class="name"><span class="ng-label">Lector:</span> ${ngEsc(ngNombre(lector))}</div>` : ""}
            </div></div>`;
            if (estudio) lectorPuesto = true;
          });
          if (cls === "vida" && lector && !lectorPuesto) out += `<div class="vm-part vida"><div class="det"><div class="name"><span class="ng-label">Lector del estudio:</span> ${ngEsc(ngNombre(lector))}</div></div></div>`;
        });
        const pie = w.querySelector(".pie");
        if (pie) {
          const p = ngSeparar(pie);
          const linea = p.texto.replace(/\(3 mins\)/i, "(3 mins.)").replace(/\s*y oraci[oó]n final$/i, " y oración");
          out += `<div class="vm-close">${NG_SVG.music}<div>${ngEsc(linea)}${p.nombres.length ? `<span class="sub">Oración: <strong>${ngEsc(p.nombres.join(", "))}</strong></span>` : ""}</div></div>`;
        }
        return out;
      }

      function render() {
        hydrateTemplateFromData();
        const thumbs = document.getElementById("thumbs");
        const tmpl = document.getElementById("weeksTmpl");
        const allWeeks = Array.from(tmpl.content.querySelectorAll("article.page"));
        const hoy = new Date();
        hoy.setHours(0,0,0,0);
        const diaS = hoy.getDay();
        const diff = hoy.getDate() - diaS + (diaS === 0 ? -6 : 1);
        const lunesActual = new Date(new Date().setDate(diff));
        lunesActual.setHours(0,0,0,0);
        filteredWeeks = allWeeks.filter(w => new Date(w.dataset.key + "T00:00:00") >= lunesActual);
        const hayActual = filteredWeeks.some(w => new Date(w.dataset.key + "T00:00:00").getTime() === lunesActual.getTime());
        thumbs.innerHTML = filteredWeeks.map((w, i) => {
          const lunes = new Date(w.dataset.key + "T00:00:00");
          const isCurrent = lunes.getTime() === lunesActual.getTime();
          const pres = w.querySelector(".presidente-en-pagina");
          const sub = pres && /^\s*Presidente:/i.test(pres.textContent) ? pres.textContent.replace(/Presidente:/i, "").trim() : "";
          const abierta = isCurrent || (!hayActual && i === 0);
          return `<details class="ng-vm"${abierta ? " open" : ""}>
            <summary><div>
              ${isCurrent ? '<span class="ng-pill">ESTA SEMANA</span>' : ""}
              <div class="vm-date">${ngEsc(ngFechaSemana(lunes))}</div>
              <div class="vm-book">${ngEsc((w.dataset.book || "").toLocaleUpperCase("es"))}</div>
              ${sub ? `<div><span class="ng-label">Presidente:</span> ${ngEsc(ngNombre(sub))}</div>` : ""}
            </div><span class="ng-toggle"><span class="c">Ver ▾</span><span class="o">Cerrar ▴</span></span></summary>
            <div class="vm-body">${ngPrograma(w)}</div>
          </details>`;
        }).join("") || '<p class="ng-note">Todavía no hay programas cargados.</p>';
      }
      render();
    </script>
    <script src="grupos-data.js"></script>
    <script src="notificaciones-data.js"></script>
    <script src="notificaciones.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
    <script src="accesibilidad.js"></script>
  </body>
</html>
