    <style>
      :root {
        --bg: #f7f5f0; --bg-card: #ffffff; --bg-card2: #f0ede8;
        --text: #1a1714; --text-muted: #8a8075;
        --accent: #2d6a4f; --accent-light: #52b788; --accent-warm: #d4a853;
        --border: rgba(26,23,20,0.09);
        --shadow-sm: 0 2px 12px rgba(26,23,20,0.07);
        --shadow-md: 0 8px 32px rgba(26,23,20,0.10);
        --shadow-lg: 0 24px 64px rgba(26,23,20,0.13);
        --verde: #2d9e6b; --amarillo: #c4890a; --rojo: #c0392b;
      }
      html.dark {
        --bg: #1e2023; --bg-card: #272b2f; --bg-card2: #2f3338;
        --text: #eceae6; --text-muted: #8a8d92;
        --accent: #4caf80; --accent-light: #6fcf97; --accent-warm: #d4a853;
        --border: rgba(255,255,255,0.08);
        --shadow-sm: 0 2px 12px rgba(0,0,0,0.15);
        --shadow-md: 0 8px 32px rgba(0,0,0,0.20);
        --shadow-lg: 0 24px 64px rgba(0,0,0,0.28);
        --verde: #4caf80; --amarillo: #d4a853; --rojo: #e07060;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg); color: var(--text);
        margin: 0; padding-bottom: env(safe-area-inset-bottom, 48px);
        overflow-x: hidden;
      }
      body::before {
        content: ''; position: fixed; inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none; z-index: 0; opacity: 0.6;
      }
      .syne { font-family: "Syne", sans-serif; }

      #sidebar {
        position: fixed; top: 0; left: 0; height: 100%; width: 300px;
        background: var(--bg-card); border-right: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        transform: translateX(-100%);
        transition: transform 0.38s cubic-bezier(0.4,0,0.2,1);
        z-index: 200; overflow-y: auto;
      }
      #sidebar.open { transform: translateX(0); }
      .sidebar-header { padding: 32px 28px 24px; border-bottom: 1px solid var(--border); }
      .sidebar-logo { display: flex; align-items: center; gap: 14px; }
      .logo-mark { width: 44px; height: 44px; background: var(--accent); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .sidebar-nav { padding: 20px 16px; }
      .nav-section-label {
        font-family: "Syne", sans-serif; font-size: 9px; font-weight: 700;
        letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
        padding: 0 12px; margin-bottom: 8px; margin-top: 16px;
      }
      .nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 13px 16px; border-radius: 14px;
        color: var(--text-muted); text-decoration: none;
        font-size: 14.5px; font-weight: 500;
        transition: all 0.18s ease; margin-bottom: 2px;
      }
      .nav-item:hover { background: var(--bg-card2); color: var(--text); }
      .nav-item.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 700; }
      .nav-item .icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--bg-card2); }
      .nav-item.active .icon { background: color-mix(in srgb, var(--accent) 15%, transparent); }

      #overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.45);
        backdrop-filter: blur(4px); z-index: 199;
        opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      }
      #overlay.visible { opacity: 1; pointer-events: all; }

      .hero-wrap { position: relative; width: 100%; height: 220px; overflow: hidden; }
      .hero-img { width: 100%; height: 100%; object-fit: cover; transition: transform 8s ease; }
      .hero-wrap:hover .hero-img { transform: scale(1.04); }
      .hero-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.02) 40%, rgba(0,0,0,0.55) 100%); }
      .hero-top-bar {
        position: absolute; top: 0; left: 0; right: 0;
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top));
      }
      .hero-content { position: absolute; bottom: 20px; left: 24px; }
      .hero-title { font-family: "Syne", sans-serif; font-size: 32px; font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; color: #fff; text-transform: uppercase; }
      .hero-sub { color: rgba(255,255,255,0.6); font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 4px; }
      .icon-btn {
        width: 42px; height: 42px; border-radius: 13px;
        background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.25);
        backdrop-filter: blur(10px); color: #fff;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.15s ease;
      }
      .icon-btn:active { transform: scale(0.92); }

      .main-wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; position: relative; z-index: 1; }

      .week-card {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 20px; padding: 16px 18px;
        margin-bottom: 10px; cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: all 0.18s ease;
        position: relative; overflow: hidden;
        animation: fadeUp 0.4s ease both;
      }
      @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      .week-card:active { transform: scale(0.98); }
      .week-card.current {
        border-color: color-mix(in srgb, var(--accent) 40%, transparent);
        box-shadow: 0 4px 24px color-mix(in srgb, var(--accent) 14%, transparent);
      }

      .week-card-accent {
        position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
        border-radius: 20px 0 0 20px;
      }
      .accent-verde { background: var(--verde); }
      .accent-amarillo { background: var(--amarillo); }
      .accent-rojo { background: var(--rojo); }
      .accent-special { background: var(--accent-warm); }

      .week-card-inner { padding-left: 10px; }
      .current-badge {
        font-family: "Syne", sans-serif; font-size: 8px; font-weight: 700;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--accent); margin-bottom: 5px; display: block;
      }
      .week-title {
        font-family: "Syne", sans-serif; font-size: 15px; font-weight: 700;
        margin: 0 0 4px; line-height: 1.2;
      }
      .week-book {
        display: inline-block; font-family: "Syne", sans-serif;
        font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--text-muted); background: var(--bg-card2);
        border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px;
        margin-bottom: 6px;
      }
      .week-sub {
        font-size: 12px; color: var(--text-muted); margin: 0;
      }
      .week-cta {
        display: flex; align-items: center; gap: 4px;
        font-family: "Syne", sans-serif; font-size: 10px; font-weight: 700;
        letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--accent); margin-top: 10px;
      }

      #viewer-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        backdrop-filter: blur(6px); z-index: 300;
        opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      }
      #viewer-overlay.visible { opacity: 1; pointer-events: all; }

      #viewer {
        position: fixed; left: 50%; top: 50%;
        transform: translate(-50%, -50%) scale(0.96);
        width: min(92vw, 500px); height: min(88vh, 780px);
        background: var(--bg); border-radius: 26px;
        z-index: 301; display: none; flex-direction: column;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
        transition: transform 0.3s ease, opacity 0.3s ease;
        opacity: 0;
      }
      #viewer.visible { display: flex; transform: translate(-50%, -50%) scale(1); opacity: 1; }

      .viewer-head {
        background: var(--bg-card); border-bottom: 1px solid var(--border);
        border-radius: 26px 26px 0 0; padding: 18px 18px 14px; flex-shrink: 0;
      }
      .viewer-head-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .viewer-week-title { font-family: "Syne", sans-serif; font-size: 15px; font-weight: 700; line-height: 1.2; }
      .viewer-week-book {
        font-family: "Syne", sans-serif; font-size: 9px; font-weight: 700;
        letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--accent); margin-top: 3px;
      }
      .viewer-close {
        width: 36px; height: 36px; border-radius: 10px;
        background: var(--bg-card2); border: 1px solid var(--border);
        color: var(--text-muted); display: flex; align-items: center; justify-content: center;
        cursor: pointer; flex-shrink: 0; transition: all 0.15s ease;
      }
      .viewer-close:active { transform: scale(0.92); }
      .viewer-nav { display: flex; gap: 8px; }
      .viewer-nav-btn {
        flex: 1; padding: 9px; border-radius: 11px;
        background: var(--bg-card2); border: 1px solid var(--border);
        font-family: "Syne", sans-serif; font-size: 10px; font-weight: 700;
        letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
        cursor: pointer; transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; gap: 6px;
      }
      .viewer-nav-btn:active { transform: scale(0.97); }
      .viewer-body { flex: 1; overflow-y: auto; padding: 16px; }

      .prog-intro {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
        font-size: 13px; color: var(--text-muted); line-height: 1.5; text-align: center;
      }
      .prog-intro strong { color: var(--text); font-weight: 700; }
      .prog-presidente {
        font-family: "Syne", sans-serif; font-size: 10px; font-weight: 700;
        letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
        margin-bottom: 6px;
      }

      .prog-bloque { margin-bottom: 12px; }
      .prog-bloque-header {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 12px; border-radius: 10px;
        font-family: "Syne", sans-serif; font-size: 9px; font-weight: 700;
        letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 6px;
      }
      .bloque-verde .prog-bloque-header { background: color-mix(in srgb, var(--verde) 12%, transparent); color: var(--verde); }
      .bloque-amarillo .prog-bloque-header { background: color-mix(in srgb, var(--amarillo) 12%, transparent); color: var(--amarillo); }
      .bloque-rojo .prog-bloque-header { background: color-mix(in srgb, var(--rojo) 12%, transparent); color: var(--rojo); }

      .prog-item {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 14px; padding: 12px 14px; margin-bottom: 6px;
      }
      .prog-item-title { font-size: 13px; font-weight: 600; line-height: 1.3; color: var(--text); }
      .prog-item-meta {
        display: flex; align-items: center; justify-content: space-between;
        margin-top: 6px; gap: 8px;
      }
      .prog-item-assigned {
        font-family: "Syne", sans-serif; font-size: 10px; font-weight: 700;
        letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted);
      }
      .prog-item-time {
        font-family: "Syne", sans-serif; font-size: 10px; font-weight: 700;
        color: var(--text-muted); background: var(--bg-card2);
        border: 1px solid var(--border); padding: 2px 8px; border-radius: 6px;
        white-space: nowrap; flex-shrink: 0;
      }

      .prog-cancion {
        background: color-mix(in srgb, var(--rojo) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--rojo) 15%, transparent);
        border-radius: 12px; padding: 10px 14px; margin-bottom: 6px;
        font-family: "Syne", sans-serif; font-size: 12px; font-weight: 700;
        color: var(--rojo);
      }

      .prog-pie {
        background: var(--bg-card2); border: 1px solid var(--border);
        border-radius: 14px; padding: 12px 16px; margin-top: 4px;
        font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.5;
      }
      .prog-pie strong { color: var(--text); font-weight: 700; }

      .prog-asamblea {
        background: color-mix(in srgb, var(--accent-warm) 10%, var(--bg-card));
        border: 1px solid color-mix(in srgb, var(--accent-warm) 25%, transparent);
        border-radius: 18px; padding: 28px 20px; text-align: center;
      }
      .prog-asamblea-title {
        font-family: "Syne", sans-serif; font-size: 22px; font-weight: 700;
        color: var(--accent-warm); text-transform: uppercase; margin-bottom: 8px;
      }
      .prog-asamblea-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; }
      .prog-asamblea-note {
        background: color-mix(in srgb, var(--accent-warm) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent-warm) 20%, transparent);
        border-radius: 14px; padding: 14px 16px;
        font-size: 13px; color: var(--text); line-height: 1.5;
      }
    </style>
    <style>html { background-color: #04091a; }</style>
  </head>

        <svg viewBox="0 0 64 64" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;right:22px;top:50%;transform:translateY(-50%);width:82px;height:82px;opacity:0.9;pointer-events:none">
          <path d="M32 16C32 16 20 14 10 16V50C20 48 32 50 32 50"/>
          <path d="M32 16C32 16 44 14 54 16V50C44 48 32 50 32 50"/>
          <line x1="14" y1="24" x2="28" y2="24"/>
          <line x1="14" y1="30" x2="28" y2="30"/>
          <line x1="14" y1="36" x2="28" y2="36"/>
          <line x1="36" y1="24" x2="50" y2="24"/>
          <line x1="36" y1="30" x2="50" y2="30"/>
          <line x1="36" y1="36" x2="50" y2="36"/>
        </svg>
        <!-- Accent bar -->
        <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,transparent,#a78bfa80,transparent);pointer-events:none"></div>
        <!-- Text gradient overlay -->
        <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.75) 0%,transparent 55%);pointer-events:none"></div>
        <div class="hero-top-bar">
          <button class="icon-btn" id="btnMenu" aria-label="Menú">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="8" y2="8"/><line x1="4" x2="14" y1="16" y2="16"/></svg>
          </button>
          <button class="icon-btn" id="btnTheme" aria-label="Cambiar tema">
            <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
        <div class="hero-content">
          <div class="hero-title">Vida y<br>Ministerio</div>
          <div class="hero-sub">Norte Garín</div>
        </div>
      </div>
    </header>

    <main class="main-wrap">
      <div id="notif-banner-container"></div>
      <div id="thumbs"></div>
    </main>

    <div id="viewer-overlay"></div>
    <div id="viewer" role="dialog" aria-modal="true">
      <div class="viewer-head">
        <div class="viewer-head-top">
          <div>
            <div class="viewer-week-title" id="v-title"></div>
            <div class="viewer-week-book" id="v-book"></div>
          </div>
          <button class="viewer-close" id="closeViewer" aria-label="Cerrar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="viewer-nav">
          <button class="viewer-nav-btn" id="prevWeek">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Anterior
          </button>
          <button class="viewer-nav-btn" id="nextWeek">
            Siguiente
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <div class="viewer-body" id="v-content"></div>
    </div>

    <template id="weeksTmpl"></template>

    <script src="vida-ministerio-data.js"></script>
    <script>
      const html = document.documentElement;
      const iconMoon = document.getElementById("theme-icon-moon");
      const iconSun  = document.getElementById("theme-icon-sun");

      function applyThemeIcons() {
        const dark = html.classList.contains("dark");
        iconMoon.style.display = dark ? "none" : "block";
        iconSun.style.display  = dark ? "block" : "none";
      }
      applyThemeIcons();

      document.getElementById("btnTheme").onclick = () => {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        applyThemeIcons();
      };

      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      document.getElementById("btnMenu").onclick = () => {
        sidebar.classList.add("open");
        overlay.classList.add("visible");
      };
      overlay.onclick = () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("visible");
      };

      const viewerOverlay = document.getElementById("viewer-overlay");
      const viewer = document.getElementById("viewer");
      let filteredWeeks = [], currentIndex = 0;

      function hydrateTemplateFromData() {
        const tmpl = document.getElementById("weeksTmpl");
        tmpl.innerHTML = window.VIDA_MINISTERIO_DATA || "";
      }

      function openViewer(i) {
        currentIndex = i;
        const w = filteredWeeks[i];
        document.getElementById("v-title").textContent = w.dataset.title;
        document.getElementById("v-book").textContent = w.dataset.book;
        document.getElementById("v-content").innerHTML = buildViewerContent(w);
        viewerOverlay.classList.add("visible");
        viewer.style.display = "flex";
        requestAnimationFrame(() => viewer.classList.add("visible"));
        document.body.style.overflow = "hidden";
      }

      function closeViewer() {
        viewer.classList.remove("visible");
        viewerOverlay.classList.remove("visible");
        setTimeout(() => { viewer.style.display = "none"; }, 300);
        document.body.style.overflow = "";
      }

      document.getElementById("closeViewer").onclick = closeViewer;
      viewerOverlay.onclick = closeViewer;
      document.getElementById("prevWeek").onclick = () => openViewer((currentIndex + filteredWeeks.length - 1) % filteredWeeks.length);
      document.getElementById("nextWeek").onclick = () => openViewer((currentIndex + 1) % filteredWeeks.length);

      function buildViewerContent(w) {
        if (w.dataset.book === "ASAMBLEA") {
          return `<div class="prog-asamblea">
            <div class="prog-asamblea-title">Asamblea de Circuito de los Testigos de Jehová</div>
            <div class="prog-asamblea-sub">Con representante de la Sucursal | 2025-2026</div>
            <div class="prog-asamblea-sub">No habrá reunión en el Salón del Reino</div>
            <div class="prog-asamblea-note">Tema: <strong>"Oiga lo que el espíritu les dice a las congregaciones"</strong> — Apocalipsis 3:22</div>
          </div>`;
        }

        let out = "";

        const pres = w.querySelector(".presidente-en-pagina");
        const inicio = w.querySelector(".inicio-programa");
        if (pres || inicio) {
          out += `<div class="prog-intro">`;
          if (pres) out += `<div class="prog-presidente">${pres.textContent.trim()}</div>`;
          if (inicio) out += inicio.innerHTML;
          out += `</div>`;
        }

        w.querySelectorAll(".bloque").forEach(bloque => {
          const isVerde = bloque.classList.contains("verde");
          const isAmarillo = bloque.classList.contains("amarillo");
          const colorClass = isVerde ? "bloque-verde" : isAmarillo ? "bloque-amarillo" : "bloque-rojo";
          const h3 = bloque.querySelector("h3");

          out += `<div class="prog-bloque ${colorClass}">`;
          if (h3) out += `<div class="prog-bloque-header">${h3.textContent}</div>`;

          bloque.querySelectorAll(".section").forEach(sec => {
            const h4 = sec.querySelector("h4");
            const title = h4 ? h4.textContent.trim() : "";

            if (/^Canci[oó]n\s+\d+/i.test(title)) {
              out += `<div class="prog-cancion">♪ ${title}</div>`;
              return;
            }

            const asignado = sec.querySelector(".asignado");
            const duration = sec.querySelector(".duration");
            out += `<div class="prog-item">
              <div class="prog-item-title">${title}</div>
              <div class="prog-item-meta">
                <span class="prog-item-assigned">${asignado ? asignado.textContent.trim() : ""}</span>
                ${duration ? `<span class="prog-item-time">${duration.textContent.trim()}</span>` : ""}
              </div>
            </div>`;
          });

          out += `</div>`;
        });

        const pie = w.querySelector(".pie");
        if (pie) out += `<div class="prog-pie">${pie.innerHTML}</div>`;

        return out;
      }

      function render() {
        hydrateTemplateFromData();

        const thumbs = document.getElementById("thumbs");
        const tmpl = document.getElementById("weeksTmpl");
        const allWeeks = Array.from(tmpl.content.querySelectorAll("article.page"));

        const hoy = new Date();
        hoy.setHours(0,0,0,0);
        const diaS = hoy.getDay();
        const diff = hoy.getDate() - diaS + (diaS === 0 ? -6 : 1);
        const lunesActual = new Date(new Date().setDate(diff));
        lunesActual.setHours(0,0,0,0);

        filteredWeeks = allWeeks.filter(w => new Date(w.dataset.key + "T00:00:00") >= lunesActual);

        const accents = ["accent-verde", "accent-amarillo", "accent-rojo"];

        thumbs.innerHTML = "";
        filteredWeeks.forEach((w, i) => {
          const fechaSemana = new Date(w.dataset.key + "T00:00:00");
          const isCurrent = fechaSemana.getTime() === lunesActual.getTime();
          const isAsamblea = w.dataset.book === "ASAMBLEA";

          const pres = w.querySelector(".presidente-en-pagina");
          const sub = pres ? pres.textContent.replace("Presidente:", "").trim() : "";

          const card = document.createElement("div");
          card.className = `week-card ${isCurrent ? "current" : ""}`;
          card.style.animationDelay = `${i * 0.05}s`;

          const accentClass = isAsamblea ? "accent-special" : accents[i % 3];

          card.innerHTML = `
            <div class="week-card-accent ${accentClass}"></div>
            <div class="week-card-inner">
              ${isCurrent ? `<span class="current-badge">● Semana actual</span>` : ""}
              <div class="week-title">${w.dataset.title}</div>
              <div class="week-book">${w.dataset.book}</div>
              ${sub ? `<div class="week-sub">Preside: ${sub}</div>` : ""}
              <div class="week-cta">
                Ver programa
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            </div>`;

          card.onclick = () => openViewer(i);
          thumbs.appendChild(card);
        });
      }

      render();
    </script>
    <script src="grupos-data.js"></script>
    <script src="notificaciones-data.js"></script>
    <script src="notificaciones.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
  </body>
</html>
