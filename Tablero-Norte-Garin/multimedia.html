<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Multimedia | Norte Garín</title>

    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved ? saved === "dark" : prefersDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg: #f7f5f0; --bg-card: #ffffff; --bg-card2: #f0ede8;
        --text: #1a1714; --text-muted: #8a8075;
        --accent: #2d6a4f; --accent-light: #52b788; --accent-warm: #d4a853;
        --border: rgba(26,23,20,0.09);
        --shadow-sm: 0 2px 12px rgba(26,23,20,0.07);
        --shadow-md: 0 8px 32px rgba(26,23,20,0.10);
        --shadow-lg: 0 24px 64px rgba(26,23,20,0.13);
      }
      html.dark {
        --bg: #1e2023; --bg-card: #272b2f; --bg-card2: #2f3338;
        --text: #eceae6; --text-muted: #8a8d92;
        --accent: #4caf80; --accent-light: #6fcf97; --accent-warm: #d4a853;
        --border: rgba(255,255,255,0.08);
        --shadow-sm: 0 2px 12px rgba(0,0,0,0.15);
        --shadow-md: 0 8px 32px rgba(0,0,0,0.20);
        --shadow-lg: 0 24px 64px rgba(0,0,0,0.28);
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg); color: var(--text);
        margin: 0; padding-bottom: env(safe-area-inset-bottom, 48px);
        overflow-x: hidden;
      }
      body::before {
        content: ''; position: fixed; inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none; z-index: 0; opacity: 0.6;
      }
      .syne { font-family: "Syne", sans-serif; }

      #sidebar {
        position: fixed; top: 0; left: 0; height: 100%; width: 300px;
        background: var(--bg-card); border-right: 1px solid var(--border);
        box-shadow: var(--shadow-lg); transform: translateX(-100%);
        transition: transform 0.38s cubic-bezier(0.4,0,0.2,1);
        z-index: 200; overflow-y: auto;
      }
      #sidebar.open { transform: translateX(0); }
      .sidebar-header { padding: 32px 28px 24px; border-bottom: 1px solid var(--border); }
      .sidebar-logo { display: flex; align-items: center; gap: 14px; }
      .logo-mark { width: 44px; height: 44px; background: var(--accent); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .sidebar-nav { padding: 20px 16px; }
      .nav-section-label {
        font-family: "Syne", sans-serif; font-size: 9px; font-weight: 700;
        letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
        padding: 0 12px; margin-bottom: 8px; margin-top: 16px;
      }
      .nav-item {
        display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 14px;
        color: var(--text-muted); text-decoration: none; font-size: 14.5px; font-weight: 500;
        transition: all 0.18s ease; margin-bottom: 2px;
      }
      .nav-item:hover { background: var(--bg-card2); color: var(--text); }
      .nav-item.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 700; }
      .nav-item .icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--bg-card2); }
      .nav-item.active .icon { background: color-mix(in srgb, var(--accent) 15%, transparent); }

      #overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.45);
        backdrop-filter: blur(4px); z-index: 199;
        opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      }
      #overlay.visible { opacity: 1; pointer-events: all; }

      .hero-wrap { position: relative; width: 100%; height: 220px; overflow: hidden; }
      .hero-img { width: 100%; height: 100%; object-fit: cover; transition: transform 8s ease; }
      .hero-wrap:hover .hero-img { transform: scale(1.04); }
      .hero-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.02) 40%, rgba(0,0,0,0.55) 100%); }
      .hero-top-bar {
        position: absolute; top: 0; left: 0; right: 0;
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top));
      }
      .hero-content { position: absolute; bottom: 20px; left: 24px; }
      .hero-title { font-family: "Syne", sans-serif; font-size: 32px; font-weight: 700; line-height: 1.05; color: #fff; text-transform: uppercase; }
      .hero-sub { color: rgba(255,255,255,0.6); font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 4px; }
      .icon-btn {
        width: 42px; height: 42px; border-radius: 13px;
        background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.25);
        backdrop-filter: blur(10px); color: #fff;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.15s ease;
      }
      .icon-btn:active { transform: scale(0.92); }

      .main-wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; position: relative; z-index: 1; }

      .week-card {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 22px; overflow: hidden;
        box-shadow: var(--shadow-sm); margin-bottom: 12px;
        animation: fadeUp 0.4s ease both;
      }
      @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      .week-card.is-current {
        border-color: color-mix(in srgb, var(--accent) 40%, transparent);
        box-shadow: 0 4px 28px color-mix(in srgb, var(--accent) 13%, transparent);
      }

      .week-card-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 18px; border-bottom: 1px solid var(--border);
        background: var(--bg-card2);
      }
      .week-label {
        font-family: "Syne", sans-serif; font-size: 13px; font-weight: 700; line-height: 1.2;
      }
      .current-chip {
        font-family: "Syne", sans-serif; font-size: 8px; font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: #fff; background: var(--accent);
        padding: 4px 10px; border-radius: 7px;
      }

      .sections-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
        background: var(--border);
      }
      .section-panel {
        background: var(--bg-card); padding: 14px 16px;
      }

      .section-heading {
        display: flex; align-items: center; gap: 7px; margin-bottom: 12px;
      }
      .section-heading-icon {
        width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        display: flex; align-items: center; justify-content: center;
      }
      .section-heading-label {
        font-family: "Syne", sans-serif; font-size: 9px; font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
      }

      .role-row { margin-bottom: 10px; }
      .role-row:last-child { margin-bottom: 0; }
      .role-label {
        font-family: "Syne", sans-serif; font-size: 8px; font-weight: 700;
        letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted);
        margin-bottom: 4px;
      }
      .role-name {
        font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3;
        background: var(--bg-card2); border: 1px solid var(--border);
        border-radius: 10px; padding: 8px 10px;
      }

      .asamblea-card {
        background: color-mix(in srgb, var(--accent-warm) 8%, var(--bg-card));
        border: 1px solid color-mix(in srgb, var(--accent-warm) 22%, transparent);
        border-radius: 22px; padding: 32px 20px; text-align: center;
        box-shadow: var(--shadow-sm); margin-bottom: 12px;
        animation: fadeUp 0.4s ease both;
      }
      .asamblea-title {
        font-family: "Syne", sans-serif; font-size: 18px; font-weight: 700;
        color: var(--accent-warm); text-transform: uppercase; letter-spacing: 0.06em;
        margin-bottom: 6px;
      }
      .asamblea-sub { font-size: 13px; color: var(--text-muted); }
    </style>
  </head>

  <body>
    <div id="overlay"></div>

    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </div>
          <div>
            <div class="syne" style="font-size:15px;font-weight:700;line-height:1.1">Norte Garín</div>

          </div>
        </div>
      </div>
      <nav class="sidebar-nav">

        <a href="index.html" class="nav-item">

        </a>
        <a href="proximos-eventos.html" class="nav-item">
          <div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div> Próximos Eventos
        </a>

        <a href="salidas.html" class="nav-item">
          <div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div> Salidas
        </a>
        <a href="grupos.html" class="nav-item">
          <div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div> Grupos
        </a>
        <div class="nav-section-label" style="margin-top:20px">Reunión</div>
        <a href="vida-ministerio.html" class="nav-item">
          <div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div> Vida y Ministerio
        </a>
        <a href="conferencias.html" class="nav-item">
          <div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></div> Discursos
        </a>

    <header>
      <div class="hero-wrap">
        <img src="img/audio-video.png" class="hero-img" alt="Multimedia" />
        <div class="hero-gradient"></div>
        <div class="hero-top-bar">
          <button class="icon-btn" id="btnMenu" aria-label="Menú">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="8" y2="8"/><line x1="4" x2="14" y1="16" y2="16"/></svg>
          </button>
          <button class="icon-btn" id="btnTheme" aria-label="Cambiar tema">
            <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
        <div class="hero-content">
          <div class="hero-title">Audio &amp;<br>Video</div>
          <div class="hero-sub">Acomodadores y Multimedia</div>
        </div>
      </div>
    </header>

    <div id="notif-banner-container"></div>
    <main class="main-wrap" id="app-container"></main>

    <script src="multimedia-data.js"></script>
    <script src="grupos-data.js"></script>
    <script src="notificaciones-data.js"></script>
    <script src="notificaciones.js"></script>

    <script>
      const html = document.documentElement;
      const iconMoon = document.getElementById("theme-icon-moon");
      const iconSun  = document.getElementById("theme-icon-sun");

      function applyThemeIcons() {
        const dark = html.classList.contains("dark");
        iconMoon.style.display = dark ? "none" : "block";
        iconSun.style.display  = dark ? "block" : "none";
      }

      applyThemeIcons();

      document.getElementById("btnTheme").onclick = () => {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        applyThemeIcons();
      };

      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      document.getElementById("btnMenu").onclick = () => {
        sidebar.classList.add("open");
        overlay.classList.add("visible");
        document.body.style.overflow = "hidden";
      };

      overlay.onclick = () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("visible");
        document.body.style.overflow = "";
      };

      document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          sidebar.classList.remove("open");
          overlay.classList.remove("visible");
          document.body.style.overflow = "";
        }
      });

      const SVG_AV = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;
      const SVG_PEOPLE = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`;

      const ROLES_AV = [
        { key: "audio_video", label: "Audio y Video" },
        { key: "microfonistas", label: "Microfonistas" },
        { key: "plataforma", label: "Plataforma" }
      ];

      const ROLES_ACOD = [
        { key: "entrada", label: "Entrada" },
        { key: "auditorio", label: "Auditorio" }
      ];

      function parseDateOnly(value) {
        const date = new Date(value + "T00:00:00");
        date.setHours(0, 0, 0, 0);
        return date;
      }

      function formatNames(value) {
        if (Array.isArray(value)) return value.join(" / ");
        return value || "Sin asignar";
      }

      function getWeeks() {
        if (!Array.isArray(window.MULTIMEDIA_DATA)) return [];

        return window.MULTIMEDIA_DATA.map((week) => ({
          ...week,
          startDate: parseDateOnly(week.start),
          endDate: parseDateOnly(week.end)
        }));
      }

      function render() {
        const container = document.getElementById("app-container");
        const now = new Date();
        now.setHours(0, 0, 0, 0);

        const weeks = getWeeks();
        let out = "";

        weeks.forEach((week, i) => {
          const isCurrent = now >= week.startDate && now <= week.endDate;

          if (week.isAsamblea) {
            out += `
              <div class="asamblea-card" style="animation-delay:${i * 0.06}s">
                <div class="asamblea-title">Asamblea de Circuito</div>
                <div class="asamblea-sub">Semana del ${week.label} — sin reunión en el Salón</div>
              </div>
            `;
            return;
          }

          out += `
            <div class="week-card ${isCurrent ? "is-current" : ""}" style="animation-delay:${i * 0.06}s">
              <div class="week-card-header">
                <div class="week-label">Semana del ${week.label}</div>
                ${isCurrent ? `<div class="current-chip">Esta semana</div>` : ""}
              </div>

              <div class="sections-grid">
                <div class="section-panel">
                  <div class="section-heading">
                    <div class="section-heading-icon">${SVG_AV}</div>
                    <div class="section-heading-label">Audio y Video</div>
                  </div>

                  ${ROLES_AV.map((r) => `
                    <div class="role-row">
                      <div class="role-label">${r.label}</div>
                      <div class="role-name">${formatNames(week[r.key])}</div>
                    </div>
                  `).join("")}
                </div>

                <div class="section-panel">
                  <div class="section-heading">
                    <div class="section-heading-icon">${SVG_PEOPLE}</div>
                    <div class="section-heading-label">Acomodadores</div>
                  </div>

                  ${ROLES_ACOD.map((r) => `
                    <div class="role-row">
                      <div class="role-label">${r.label}</div>
                      <div class="role-name">${formatNames(week[r.key])}</div>
                    </div>
                  `).join("")}
                </div>
              </div>
            </div>
          `;
        });

        container.innerHTML = out;

        setTimeout(() => {
          const cur = container.querySelector(".is-current");
          if (cur) cur.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 400);
      }

      render();
    </script>
  </body>
