<!DOCTYPE html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grupos para el Servicio del Campo | Norte Garín</title>

    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDark = saved ? saved === "dark" : prefersDark;
        if (useDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              brand: {
                50: "#ecfdf5",
                100: "#d1fae5",
                200: "#a7f3d0",
                300: "#6ee7b7",
                400: "#34d399",
                500: "#10b981",
                600: "#059669",
                700: "#047857",
                800: "#065f46",
                900: "#064e3b",
              },
            },
            boxShadow: {
              soft: "0 10px 30px rgba(15, 23, 42, 0.08)",
            },
          },
        },
      };
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-main: #f8fafc;
        --bg-card: rgba(255, 255, 255, 0.92);
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border: rgba(148, 163, 184, 0.2);
        --btn-bg: rgba(255, 255, 255, 0.85);
      }

      .dark:root {
        --bg-main: #020617;
        --bg-card: rgba(15, 23, 42, 0.88);
        --text-main: #e5e7eb;
        --text-muted: #94a3b8;
        --border: rgba(148, 163, 184, 0.16);
        --btn-bg: rgba(15, 23, 42, 0.82);
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(circle at top, rgba(16, 185, 129, 0.10), transparent 30%),
          var(--bg-main);
        color: var(--text-main);
      }

      .card-surface {
        background: var(--bg-card);
        border: 1px solid var(--border);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .section-title-balance {
        text-wrap: balance;
      }

      details summary::-webkit-details-marker {
        display: none;
      }

      .btn-surface {
        background: var(--btn-bg);
        border: 1px solid var(--border);
        color: var(--text-main);
        box-shadow: 0 10px 25px rgba(2, 6, 23, 0.12);
        backdrop-filter: blur(8px);
        transition: all 0.15s ease;
      }

      .btn-surface:active {
        transform: scale(0.95);
      }

      #sidebar {
        transition: transform 0.3s ease-in-out;
        background: rgba(255, 255, 255, 0.96);
        z-index: 100;
      }

      .dark #sidebar {
        background: rgba(15, 23, 42, 0.98);
      }

      .nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-radius: 18px;
        color: var(--text-muted);
        transition: all 0.2s ease;
      }

      .nav-link.active {
        background: rgba(16, 185, 129, 0.12);
        color: #10b981;
        font-weight: 800;
        border: 1px solid rgba(16, 185, 129, 0.2);
      }
    </style>
  </head>

  <body class="min-h-full">
    <div
      id="overlay"
      class="fixed inset-0 z-[90] hidden bg-black/40 opacity-0 backdrop-blur-sm transition-opacity duration-300"
    ></div>

    <aside
      id="sidebar"
      class="fixed top-0 left-0 h-full w-72 -translate-x-full border-r border-slate-200/70 p-8 shadow-2xl dark:border-slate-800"
    >
      <div class="mb-10 flex items-center gap-3">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-2xl bg-emerald-500/20 font-black text-emerald-500"
        >
          ✦
        </div>
        <div>
          <h2 class="leading-tight font-extrabold">Norte Garín</h2>
          <p class="text-[10px] font-bold uppercase tracking-widest opacity-60">
            Digital Board
          </p>
        </div>
      </div>

      <nav class="space-y-2">
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="salidas.html" class="nav-link">Salidas</a>
        <a href="vida-ministerio.html" class="nav-link">Vida y Ministerio</a>
        <a href="conferencias.html" class="nav-link">Discursos</a>
        <a href="multimedia.html" class="nav-link">Multimedia</a>
        <a href="lectores.html" class="nav-link">Lectores</a>
        <a href="limpieza.html" class="nav-link">Limpieza</a>
        <a href="grupos.html" class="nav-link active">Grupos</a>
        <a href="proximos-eventos.html" class="nav-link">Próximos eventos</a>
      </nav>
    </aside>

    <div class="mx-auto w-full max-w-6xl px-4 pb-16 pt-5 sm:px-6 lg:px-8">
      <header class="mb-6">
        <div class="relative overflow-hidden rounded-3xl shadow-soft">
          <img
            src="img/grupos.jpg"
            alt="Grupos para el servicio del campo"
            class="absolute inset-0 h-full w-full object-cover"
          />
          <div class="absolute inset-0 bg-gradient-to-b from-black/45 via-black/20 to-black/75"></div>

          <div class="relative px-5 py-5 sm:px-7 sm:py-7">
            <div class="mb-8 flex items-center justify-between">
              <button
                id="btnMenu"
                class="btn-surface rounded-2xl p-3 active:scale-90"
                type="button"
                aria-label="Abrir menú"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="4" x2="20" y1="12" y2="12"></line>
                  <line x1="4" x2="20" y1="6" y2="6"></line>
                  <line x1="4" x2="20" y1="18" y2="18"></line>
                </svg>
              </button>

              <button
                id="btnTheme"
                class="btn-surface rounded-2xl p-3 active:scale-90"
                type="button"
                aria-label="Cambiar tema"
              >
                <span id="theme-icon">🌙</span>
              </button>
            </div>

            <div class="flex items-end gap-4 sm:gap-5">
              <div
                class="flex h-16 w-16 shrink-0 items-center justify-center rounded-2xl bg-white/15 text-white shadow-sm backdrop-blur-md sm:h-20 sm:w-20"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-9 w-9 sm:h-11 sm:w-11"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M17 20a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4m18 0a4 4 0 0 0-3-3.87M15 7a3 3 0 1 1 0 6m-6-6a3 3 0 1 1 0 6m12 7v0m-9-13a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
                  />
                </svg>
              </div>

              <div class="min-w-0">
                <p class="mb-2 inline-flex items-center rounded-full bg-white/10 px-3 py-1 text-[11px] font-semibold uppercase tracking-[0.18em] text-emerald-200 backdrop-blur-md">
                  Organización
                </p>

                <h1 class="section-title-balance text-3xl font-black tracking-tight text-white sm:text-4xl">
                  Grupos para el Servicio del Campo
                </h1>

                <p class="mt-1 text-sm font-medium text-white/85 sm:text-base">
                  Congregación Norte Garín
                </p>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main id="grupos-container" class="grid grid-cols-1 gap-4 lg:grid-cols-2"></main>
    </div>

    <script src="grupos-data.js"></script>
    <script>
      const html = document.documentElement;
      const themeIcon = document.getElementById("theme-icon");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const gruposContainer = document.getElementById("grupos-container");

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function syncThemeIcon() {
        themeIcon.textContent = html.classList.contains("dark") ? "☀️" : "🌙";
      }

      function toggleTheme() {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        syncThemeIcon();
      }

      function renderGrupos() {
        if (!window.GRUPOS_DATA || !Array.isArray(window.GRUPOS_DATA)) {
          gruposContainer.innerHTML = `
            <section class="card-surface rounded-3xl p-6 shadow-soft">
              <p class="text-lg font-bold text-slate-900 dark:text-white">No se pudieron cargar los grupos.</p>
            </section>
          `;
          return;
        }

        gruposContainer.innerHTML = window.GRUPOS_DATA.map((grupo) => {
          const integrantes = Array.isArray(grupo.integrantes) ? grupo.integrantes : [];

          return `
            <article class="card-surface rounded-3xl p-5 shadow-soft sm:p-6">
              <div class="mb-5 flex items-start justify-between gap-3">
                <div class="flex items-center gap-3">
                  <div
                    class="flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-100 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-7 w-7"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="1.9"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M17 20a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4m18 0a4 4 0 0 0-3-3.87M15 7a3 3 0 1 1 0 6m-6-6a3 3 0 1 1 0 6"
                      />
                    </svg>
                  </div>

                  <div>
                    <h2 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">
                      ${escapeHtml(grupo.nombre)}
                    </h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400">
                      Servicio del campo
                    </p>
                  </div>
                </div>

                <span class="rounded-full bg-brand-100 px-3 py-1 text-xs font-bold text-brand-700 dark:bg-brand-500/15 dark:text-brand-300">
                  ${escapeHtml(grupo.publicadores)} publicadores
                </span>
              </div>

              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div class="rounded-2xl border border-slate-200/70 bg-white/70 p-4 dark:border-slate-700/60 dark:bg-slate-900/40">
                  <div class="mb-2 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-600 dark:text-brand-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.5a6.5 6.5 0 0 0 6.5-6.5V8A6.5 6.5 0 0 0 5.5 8v4a6.5 6.5 0 0 0 6.5 6.5Zm0 0v3m-3-0.5h6" />
                    </svg>
                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
                      Superintendente
                    </p>
                  </div>
                  <p class="text-lg font-bold text-slate-900 dark:text-white">${escapeHtml(grupo.superintendente)}</p>
                </div>

                <div class="rounded-2xl border border-slate-200/70 bg-white/70 p-4 dark:border-slate-700/60 dark:bg-slate-900/40">
                  <div class="mb-2 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-600 dark:text-brand-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 12.75 11 15.5l4.75-4.75M7 4.75h10A2.25 2.25 0 0 1 19.25 7v10A2.25 2.25 0 0 1 17 19.25H7A2.25 2.25 0 0 1 4.75 17V7A2.25 2.25 0 0 1 7 4.75Z" />
                    </svg>
                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
                      Auxiliar
                    </p>
                  </div>
                  <p class="text-lg font-bold text-slate-900 dark:text-white">${escapeHtml(grupo.auxiliar)}</p>
                </div>
              </div>

              <details class="mt-4 group">
                <summary class="flex cursor-pointer items-center justify-between rounded-2xl border border-slate-200/70 px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 dark:border-slate-700/60 dark:text-slate-200 dark:hover:bg-slate-800/50">
                  <span>Ver integrantes</span>
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 transition duration-200 group-open:rotate-180"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.9"
                  >
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
                  </svg>
                </summary>

                <div class="mt-3 rounded-2xl border border-slate-200/70 bg-white/70 p-4 dark:border-slate-700/60 dark:bg-slate-900/40">
                  <div class="grid grid-cols-1 gap-2 text-sm text-slate-700 dark:text-slate-300 sm:grid-cols-2">
                    ${integrantes.map((nombre) => `<p>• ${escapeHtml(nombre)}</p>`).join("")}
                  </div>
                </div>
              </details>
            </article>
          `;
        }).join("");
      }

      document.getElementById("btnTheme").onclick = toggleTheme;
      syncThemeIcon();
      renderGrupos();

      document.getElementById("btnMenu").onclick = () => {
        sidebar.classList.replace("-translate-x-full", "translate-x-0");
        overlay.classList.remove("hidden");
        setTimeout(() => overlay.classList.add("opacity-100"), 10);
      };

      function closeMenu() {
        sidebar.classList.replace("translate-x-0", "-translate-x-full");
        overlay.classList.remove("opacity-100");
        setTimeout(() => overlay.classList.add("hidden"), 300);
      }

      overlay.onclick = closeMenu;

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });
    </script>
  </body>
</html>
