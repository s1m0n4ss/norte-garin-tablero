    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved ? saved === "dark" : prefersDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg:#f7f5f0; --bg-card:#ffffff; --bg-card2:#f0ede8;
        --text:#1a1714; --text-muted:#8a8075;
        --accent:#2d6a4f; --accent-light:#52b788; --accent-warm:#d4a853;
        --border:rgba(26,23,20,0.09);
        --shadow-sm:0 2px 12px rgba(26,23,20,0.07);
        --shadow-md:0 8px 32px rgba(26,23,20,0.10);
        --shadow-lg:0 24px 64px rgba(26,23,20,0.13);
      }
      html.dark {
        --bg:#1e2023; --bg-card:#272b2f; --bg-card2:#2f3338;
        --text:#eceae6; --text-muted:#8a8d92;
        --accent:#4caf80; --accent-light:#6fcf97; --accent-warm:#d4a853;
        --border:rgba(255,255,255,0.08);
        --shadow-sm:0 2px 12px rgba(0,0,0,0.15);
        --shadow-md:0 8px 32px rgba(0,0,0,0.20);
        --shadow-lg:0 24px 64px rgba(0,0,0,0.28);
      }

      *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
      body{
        font-family:"DM Sans",sans-serif; background:var(--bg); color:var(--text);
        margin:0; padding-bottom:max(48px,env(safe-area-inset-bottom,48px));
        overflow-x:hidden; min-height:100vh;
      }
      body::before{
        content:''; position:fixed; inset:0;
        background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events:none; z-index:0; opacity:0.6;
      }
      .syne{font-family:"Syne",sans-serif;}

      /* SIDEBAR */
      #sidebar{
        position:fixed; top:0; left:0; height:100%; width:300px;
        background:var(--bg-card); border-right:1px solid var(--border);
        box-shadow:var(--shadow-lg); transform:translateX(-100%);
        transition:transform 0.38s cubic-bezier(0.4,0,0.2,1);
        z-index:200; overflow-y:auto;
      }
      #sidebar.open{transform:translateX(0);}
      .sidebar-header{padding:32px 28px 24px; border-bottom:1px solid var(--border);}
      .sidebar-logo{display:flex; align-items:center; gap:14px;}
      .logo-mark{width:44px; height:44px; background:var(--accent); border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
      .sidebar-nav{padding:20px 16px;}
      .nav-section-label{
        font-family:"Syne",sans-serif; font-size:9px; font-weight:700;
        letter-spacing:0.15em; text-transform:uppercase; color:var(--text-muted);
        padding:0 12px; margin-bottom:8px; margin-top:16px;
      }
      .nav-item{
        display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:14px;
        color:var(--text-muted); text-decoration:none; font-size:14.5px; font-weight:500;
        transition:all 0.18s ease; margin-bottom:2px;
      }
      .nav-item:hover{background:var(--bg-card2); color:var(--text);}
      .nav-item.active{background:color-mix(in srgb,var(--accent) 12%,transparent); color:var(--accent); font-weight:700;}
      .nav-item .icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--bg-card2);}
      .nav-item.active .icon{background:color-mix(in srgb,var(--accent) 15%,transparent);}

      /* OVERLAY */
      #overlay{
        position:fixed; inset:0; background:rgba(0,0,0,0.45);
        backdrop-filter:blur(4px); z-index:199;
        opacity:0; pointer-events:none; transition:opacity 0.3s ease;
      }
      #overlay.visible{opacity:1; pointer-events:all;}

      /* HERO */
      .hero-wrap{position:relative; width:100%; height:250px; overflow:hidden;}
      .hero-img{width:100%; height:100%; object-fit:cover; transition:transform 8s ease;}
      .hero-wrap:hover .hero-img{transform:scale(1.04);}
      .hero-gradient{position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,0.18) 0%,rgba(0,0,0,0.04) 38%,rgba(0,0,0,0.72) 100%);}
      .hero-top-bar{
        position:absolute; top:0; left:0; right:0;
        display:flex; align-items:center; justify-content:space-between;
        padding:16px 20px; padding-top:max(16px,env(safe-area-inset-top));
      }
      .hero-bottom{position:absolute; bottom:0; left:0; right:0; padding:0 24px 22px;}
      .hero-eyebrow{
        display:inline-flex; align-items:center; gap:7px;
        background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.18);
        backdrop-filter:blur(10px); color:rgba(255,255,255,0.9);
        font-family:"Syne",sans-serif; font-size:9px; font-weight:700;
        letter-spacing:0.14em; text-transform:uppercase;
        padding:6px 12px; border-radius:99px; margin-bottom:10px;
      }
      .hero-title{font-family:"Syne",sans-serif; font-size:30px; font-weight:700; color:#fff; text-transform:uppercase; line-height:1; letter-spacing:-0.01em;}
      .hero-chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
      .hero-chip{
        background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.16);
        backdrop-filter:blur(8px); color:#fff;
        font-family:"Syne",sans-serif; font-size:9px; font-weight:700;
        letter-spacing:0.1em; text-transform:uppercase;
        padding:6px 12px; border-radius:99px;
      }
      .icon-btn{
        width:42px; height:42px; border-radius:13px;
        background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.25);
        backdrop-filter:blur(10px); color:#fff;
        display:flex; align-items:center; justify-content:center;
        cursor:pointer; transition:all 0.15s ease;
      }
      .icon-btn:active{transform:scale(0.92);}

      /* MAIN */
      .main-wrap{max-width:480px; margin:0 auto; padding:16px 16px 48px; position:relative; z-index:1;}

      @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

      /* SUMMARY */
      .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;}
      .summary-card{
        background:var(--bg-card); border:1px solid var(--border);
        border-radius:18px; padding:16px; box-shadow:var(--shadow-sm);
        animation:fadeUp 0.4s ease both;
      }
      .summary-label{
        font-family:"Syne",sans-serif; font-size:8px; font-weight:700;
        letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px;
      }
      .summary-value{font-family:"Syne",sans-serif; font-size:20px; font-weight:700; line-height:1; color:var(--text);}
      .summary-value.accent{color:var(--accent);}

      /* MONTH */
      .month-block{margin-bottom:14px; animation:fadeUp 0.4s ease both;}
      .month-card{
        background:var(--bg-card); border:1px solid var(--border);
        border-radius:22px; overflow:hidden; box-shadow:var(--shadow-sm);
      }
      .month-header{
        display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
        padding:16px 18px 14px; border-bottom:1px solid var(--border);
        background:var(--bg-card2);
      }
      .month-title{font-family:"Syne",sans-serif; font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:-0.01em;}
      .month-sub{font-size:11px; color:var(--text-muted); font-weight:500; margin-top:3px;}
      .month-count{
        font-family:"Syne",sans-serif; font-size:10px; font-weight:700;
        color:var(--text-muted); background:var(--bg-card); border:1px solid var(--border);
        padding:4px 10px; border-radius:7px; white-space:nowrap;
      }
      .month-body{padding:14px; display:grid; gap:8px;}

      /* DEEP CLEAN */
      .deep-banner{
        border-radius:16px; padding:15px 16px;
        background:linear-gradient(135deg,
          color-mix(in srgb,var(--accent) 85%,#000) 0%,
          var(--accent) 100%);
        box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 28%,transparent);
        display:grid; gap:3px;
      }
      .deep-banner-eyebrow{
        font-family:"Syne",sans-serif; font-size:8px; font-weight:700;
        letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.72);
      }
      .deep-banner-title{font-family:"Syne",sans-serif; font-size:15px; font-weight:700; color:#fff;}
      .deep-banner-text{font-size:12px; color:rgba(255,255,255,0.85); margin-top:3px; line-height:1.4;}

      /* WEEK ROW */
      .week-row{
        display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px;
        padding:13px 14px; border-radius:16px;
        background:var(--bg-card2); border:1px solid var(--border);
        transition:border-color 0.18s ease, background 0.18s ease;
      }
      .week-row.current{
        border-color:color-mix(in srgb,var(--accent) 40%,transparent);
        background:color-mix(in srgb,var(--accent) 6%,var(--bg-card));
        box-shadow:0 2px 16px color-mix(in srgb,var(--accent) 10%,transparent);
      }

      /* date pills */
      .date-stack{display:flex; flex-direction:column; gap:6px;}
      .date-pill{
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        width:52px; padding:8px 6px; border-radius:12px;
        background:var(--bg-card); border:1px solid var(--border);
      }
      .week-row.current .date-pill{background:color-mix(in srgb,var(--accent) 10%,var(--bg-card));}
      .date-pill-dow{
        font-family:"Syne",sans-serif; font-size:7.5px; font-weight:700;
        letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:3px;
      }
      .date-pill-num{font-family:"Syne",sans-serif; font-size:18px; font-weight:700; line-height:1; color:var(--text);}
      .week-row.current .date-pill-num{color:var(--accent);}

      /* week info */
      .week-info{min-width:0;}
      .week-current-badge{
        font-family:"Syne",sans-serif; font-size:8px; font-weight:700;
        letter-spacing:0.12em; text-transform:uppercase; color:var(--accent);
        margin-bottom:4px; display:block;
      }
      .week-range{font-family:"Syne",sans-serif; font-size:13px; font-weight:700; line-height:1.2; color:var(--text);}
      .week-note{font-size:11px; color:var(--text-muted); margin-top:3px;}

      /* group tag */
      .group-tag{
        font-family:"Syne",sans-serif; font-size:10px; font-weight:700;
        letter-spacing:0.06em; text-transform:uppercase; text-align:center;
        color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,transparent);
        border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
        padding:10px 10px; border-radius:12px; min-width:72px; line-height:1.3;
      }

      @media(max-width:360px){
        .week-row{grid-template-columns:1fr;}
        .date-stack{flex-direction:row;}
        .group-tag{width:100%;}
      }
    </style>
  </head>

    <script>
      // THEME
      const html = document.documentElement;
      const iconMoon = document.getElementById("theme-icon-moon");
      const iconSun  = document.getElementById("theme-icon-sun");
      function applyThemeIcons() {
        const dark = html.classList.contains("dark");
        iconMoon.style.display = dark ? "none" : "block";
        iconSun.style.display  = dark ? "block" : "none";
      }
      applyThemeIcons();
      document.getElementById("btnTheme").onclick = () => {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        applyThemeIcons();
      };

      // SIDEBAR
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      document.getElementById("btnMenu").onclick = () => { sidebar.classList.add("open"); overlay.classList.add("visible"); };
      overlay.onclick = () => { sidebar.classList.remove("open"); overlay.classList.remove("visible"); };

      // CONSTANTES
      const SECUENCIA_4 = ["Grupos 1 y 2","Grupos 3 y 4","Grupos 1 y 2","Grupos 3 y 4"];
      const INICIO_REFERENCIA = new Date(2025, 11, 2);
      const FECHA_CAMBIO_DIAS = new Date(2026, 0, 8);

      // Limpieza profunda: cada 3 meses, primera en ABRIL 2026
      function esLimpiezaProfunda(y, m) {
        const refTotal  = 2026 * 12 + 3; // abril 2026
        const curTotal  = y * 12 + m;
        const diff = curTotal - refTotal;
        return diff >= 0 && diff % 3 === 0;
      }

      const MESES_ES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

      function startOfDay(d) { const x=new Date(d); x.setHours(0,0,0,0); return x; }
      function endOfDay(d)   { const x=new Date(d); x.setHours(23,59,59,999); return x; }

      function diasDelMesPorDow(y, m, dow) {
        const dias=[]; let d=new Date(y,m,1);
        while(d.getDay()!==dow) d.setDate(d.getDate()+1);
        while(d.getMonth()===m){ dias.push(new Date(d)); d.setDate(d.getDate()+7); }
        return dias;
      }

      function calcularAsignacion(fechaBase) {
        const diff = Math.floor(Math.abs(startOfDay(fechaBase)-startOfDay(INICIO_REFERENCIA))/(1000*60*60*24*7));
        return SECUENCIA_4[diff % 4];
      }

      function esSemanaActual(d1,d2){
        const hoy=new Date();
        return hoy>=startOfDay(d1)&&hoy<=endOfDay(d2);
      }

      function rangoTexto(d1,d2){
        const m1=d1.toLocaleDateString("es-ES",{month:"short"});
        const m2=d2.toLocaleDateString("es-ES",{month:"short"});
        return m1===m2?`${d1.getDate()} al ${d2.getDate()} de ${m2}`:`${d1.getDate()} ${m1} al ${d2.getDate()} ${m2}`;
      }

      function semanasMes(y,m){
        const martes = diasDelMesPorDow(y,m,2).filter(base=>{
          const d2=new Date(base); d2.setDate(d2.getDate()+4);
          return endOfDay(d2)<startOfDay(FECHA_CAMBIO_DIAS);
        });
        const jueves = diasDelMesPorDow(y,m,4).filter(
          base=>startOfDay(base)>=startOfDay(FECHA_CAMBIO_DIAS)
        );
        return [...martes.map(d=>({base:d,mode:"OLD"})),...jueves.map(d=>({base:d,mode:"NEW"}))]
          .sort((a,b)=>a.base-b.base);
      }

      function renderMes(y,m,idx){
        const semanas=semanasMes(y,m);
        const delay=idx*0.07;

        let deepBanner="";
        if(esLimpiezaProfunda(y,m)){
          const lunes=diasDelMesPorDow(y,m,1);
          const dias=lunes.map(l=>l.getDate()).join(", ");
          deepBanner=`<div class="deep-banner">
            <div class="deep-banner-eyebrow">Limpieza profunda · ${MESES_ES[m]} ${y}</div>
            <div class="deep-banner-title">¡Atención grupos!</div>
            <div class="deep-banner-text">Los lunes ${dias} de ${MESES_ES[m].toLowerCase()} corresponde la limpieza profunda del Salón.</div>
          </div>`;
        }

        const filas=semanas.map(({base,mode},i)=>{
          const isNew=mode==="NEW";
          const d1=new Date(base);
          const d2=new Date(base); d2.setDate(d1.getDate()+(isNew?3:4));
          const actual=esSemanaActual(d1,d2);
          const asig=calcularAsignacion(d1);
          const rd=(idx*6+i)*0.04;
          return `<div class="week-row ${actual?"current":""}" style="animation-delay:${rd}s">
            <div class="date-stack">
              <div class="date-pill">
                <div class="date-pill-dow">${isNew?"Jue":"Mar"}</div>
                <div class="date-pill-num">${String(d1.getDate()).padStart(2,"0")}</div>
              </div>
              <div class="date-pill">
                <div class="date-pill-dow">${isNew?"Dom":"Sáb"}</div>
                <div class="date-pill-num">${String(d2.getDate()).padStart(2,"0")}</div>
              </div>
            </div>
            <div class="week-info">
              ${actual?`<span class="week-current-badge">● Semana actual</span>`:""}
              <div class="week-range">${rangoTexto(d1,d2)}</div>
              <div class="week-note">${isNew?"Jue → Dom":"Mar → Sáb"}</div>
            </div>
            <div class="group-tag">${asig.replace(" y ","\ny ")}</div>
          </div>`;
        }).join("");

        return `<div class="month-block" style="animation-delay:${delay}s">
          <div class="month-card">
            <div class="month-header">
              <div>
                <div class="month-title">${MESES_ES[m]} ${y}</div>
                <div class="month-sub">Asignación semanal del Salón</div>
              </div>
              <div class="month-count">${semanas.length} semana${semanas.length!==1?"s":""}</div>
            </div>
            <div class="month-body">
              ${deepBanner}
              ${filas||`<div style="padding:8px;text-align:center;font-size:13px;color:var(--text-muted)">Sin semanas</div>`}
            </div>
          </div>
        </div>`;
      }

      function iniciar(){
        const hoy=new Date();
        const meses=[];
        for(let i=0;i<3;i++){
          const d=new Date(hoy.getFullYear(),hoy.getMonth()+i,1);
          meses.push({y:d.getFullYear(),m:d.getMonth()});
        }

        const p0=meses[0], p1=meses[meses.length-1];
        document.getElementById("hero-chip-periodo").textContent=
          p0.m===p1.m&&p0.y===p1.y
            ? `${MESES_ES[p0.m]} ${p0.y}`
            : `${MESES_ES[p0.m]} – ${MESES_ES[p1.m]} ${p1.y}`;

        document.getElementById("programa-container").innerHTML=
          meses.map(({y,m},i)=>renderMes(y,m,i)).join("");

        // summary
        const total=document.querySelectorAll(".week-row").length;
        const curTag=document.querySelector(".week-row.current .group-tag");
        document.getElementById("summary-weeks").textContent=total;
        document.getElementById("summary-current").textContent=curTag
          ? curTag.textContent.replace("\n"," ") : "Sin curso";

        setTimeout(()=>{
          const cur=document.querySelector(".week-row.current");
          if(cur) cur.scrollIntoView({behavior:"smooth",block:"center"});
        },450);
      }

      iniciar();
    </script>
  </body>
</html>
