    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved ? saved === "dark" : prefersDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      :root {
        --bg: #f7f5f0; --bg-card: #ffffff; --bg-card2: #f0ede8;
        --text: #1a1714; --text-muted: #8a8075;
        --accent: #2d6a4f; --accent-light: #52b788; --accent-warm: #d4a853;
        --border: rgba(26,23,20,0.09);
        --shadow-sm: 0 2px 12px rgba(26,23,20,0.07);
        --shadow-md: 0 8px 32px rgba(26,23,20,0.10);
        --shadow-lg: 0 24px 64px rgba(26,23,20,0.13);
        --atalaya: #2563eb; --biblico: #2d6a4f;
      }
      html.dark {
        --bg: #1e2023; --bg-card: #272b2f; --bg-card2: #2f3338;
        --text: #eceae6; --text-muted: #8a8d92;
        --accent: #4caf80; --accent-light: #6fcf97; --accent-warm: #d4a853;
        --border: rgba(255,255,255,0.08);
        --shadow-sm: 0 2px 12px rgba(0,0,0,0.15);
        --shadow-md: 0 8px 32px rgba(0,0,0,0.20);
        --shadow-lg: 0 24px 64px rgba(0,0,0,0.28);
        --atalaya: #60a5fa; --biblico: #4caf80;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg); color: var(--text);
        margin: 0; padding-bottom: env(safe-area-inset-bottom, 48px);
        overflow-x: hidden;
      }
      body::before {
        content: ''; position: fixed; inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none; z-index: 0; opacity: 0.6;
      }
      .syne { font-family: "Syne", sans-serif; }

      #sidebar {
        position: fixed; top: 0; left: 0; height: 100%; width: 300px;
        background: var(--bg-card); border-right: 1px solid var(--border);
        box-shadow: var(--shadow-lg); transform: translateX(-100%);
        transition: transform 0.38s cubic-bezier(0.4,0,0.2,1);
        z-index: 200; overflow-y: auto;
      }
      #sidebar.open { transform: translateX(0); }
      .sidebar-header { padding: 32px 28px 24px; border-bottom: 1px solid var(--border); }
      .sidebar-logo { display: flex; align-items: center; gap: 14px; }
      .logo-mark { width: 44px; height: 44px; background: var(--accent); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .sidebar-nav { padding: 20px 16px; }
      .nav-section-label {
        font-family: "Syne", sans-serif; font-size: 9px; font-weight: 700;
        letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
        padding: 0 12px; margin-bottom: 8px; margin-top: 16px;
      }
      .nav-item {
        display: flex; align-items: center; gap: 12px;
        padding: 13px 16px; border-radius: 14px;
        color: var(--text-muted); text-decoration: none;
        font-size: 14.5px; font-weight: 500; transition: all 0.18s ease; margin-bottom: 2px;
      }
      .nav-item:hover { background: var(--bg-card2); color: var(--text); }
      .nav-item.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 700; }
      .nav-item .icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--bg-card2); }
      .nav-item.active .icon { background: color-mix(in srgb, var(--accent) 15%, transparent); }

      #overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.45);
        backdrop-filter: blur(4px); z-index: 199;
        opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      }
      #overlay.visible { opacity: 1; pointer-events: all; }

      .hero-wrap { position: relative; width: 100%; height: 220px; overflow: hidden; }
      .hero-img { width: 100%; height: 100%; object-fit: cover; transition: transform 8s ease; }
      .hero-wrap:hover .hero-img { transform: scale(1.04); }
      .hero-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.02) 40%, rgba(0,0,0,0.55) 100%); }
      .hero-top-bar {
        position: absolute; top: 0; left: 0; right: 0;
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top));
      }
      .hero-content { position: absolute; bottom: 20px; left: 24px; }
      .hero-title { font-family: "Syne", sans-serif; font-size: 32px; font-weight: 700; line-height: 1.05; color: #fff; text-transform: uppercase; }
      .hero-sub { color: rgba(255,255,255,0.6); font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 4px; }
      .icon-btn {
        width: 42px; height: 42px; border-radius: 13px;
        background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.25);
        backdrop-filter: blur(10px); color: #fff;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.15s ease;
      }
      .icon-btn:active { transform: scale(0.92); }

      .main-wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; position: relative; z-index: 1; }

      .month-sep {
        display: flex; align-items: center; gap: 12px; margin: 24px 0 14px;
      }
      .month-sep-line { flex: 1; height: 1px; background: var(--border); }
      .month-sep-label {
        font-family: "Syne", sans-serif; font-size: 9px; font-weight: 700;
        letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-muted);
      }

      .lector-card {
        display: flex; align-items: center; gap: 0;
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 18px; overflow: hidden;
        box-shadow: var(--shadow-sm); margin-bottom: 8px;
        transition: all 0.18s ease;
        animation: fadeUp 0.4s ease both;
      }
      @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      .lector-card.is-next {
        border-color: color-mix(in srgb, var(--accent) 35%, transparent);
        box-shadow: 0 4px 24px color-mix(in srgb, var(--accent) 12%, transparent);
      }
      .lector-card.is-past { opacity: 0.35; filter: grayscale(0.7); }

      .lector-date {
        width: 58px; flex-shrink: 0; padding: 14px 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-right: 1px solid var(--border);
      }
      .lector-date-num {
        font-family: "Syne", sans-serif; font-size: 22px; font-weight: 700; line-height: 1;
      }
      .lector-date-dow {
        font-family: "Syne", sans-serif; font-size: 8px; font-weight: 700;
        letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-top: 2px;
      }

      .lector-card.type-atalaya .lector-date { background: color-mix(in srgb, var(--atalaya) 8%, transparent); }
      .lector-card.type-atalaya .lector-date-num { color: var(--atalaya); }
      .lector-card.type-biblico .lector-date { background: color-mix(in srgb, var(--biblico) 8%, transparent); }
      .lector-card.type-biblico .lector-date-num { color: var(--biblico); }
      .lector-card.type-special .lector-date { background: color-mix(in srgb, var(--accent-warm) 10%, transparent); }
      .lector-card.type-special .lector-date-num { color: var(--accent-warm); }

      .lector-body { flex: 1; padding: 12px 16px; }
      .lector-next-badge {
        font-family: "Syne", sans-serif; font-size: 8px; font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
        margin-bottom: 4px; display: block;
      }
      .lector-type-badge {
        font-family: "Syne", sans-serif; font-size: 9px; font-weight: 700;
        letter-spacing: 0.1em; text-transform: uppercase;
        padding: 3px 8px; border-radius: 6px;
        display: inline-block; margin-bottom: 5px;
      }
      .type-atalaya .lector-type-badge {
        color: var(--atalaya); background: color-mix(in srgb, var(--atalaya) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--atalaya) 18%, transparent);
      }
      .type-biblico .lector-type-badge {
        color: var(--biblico); background: color-mix(in srgb, var(--biblico) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--biblico) 18%, transparent);
      }
      .type-special .lector-type-badge {
        color: var(--accent-warm); background: color-mix(in srgb, var(--accent-warm) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent-warm) 18%, transparent);
      }
      .lector-name { font-family: "Syne", sans-serif; font-size: 14px; font-weight: 700; line-height: 1.2; }
      .lector-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    </style>
  </head>

    <script>
      const html = document.documentElement;
      const iconMoon = document.getElementById("theme-icon-moon");
      const iconSun  = document.getElementById("theme-icon-sun");

      function applyThemeIcons() {
        const dark = html.classList.contains("dark");
        iconMoon.style.display = dark ? "none" : "block";
        iconSun.style.display  = dark ? "block" : "none";
      }

      applyThemeIcons();

      document.getElementById("btnTheme").onclick = () => {
        html.classList.toggle("dark");
        localStorage.setItem("theme", html.classList.contains("dark") ? "dark" : "light");
        applyThemeIcons();
      };

      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      document.getElementById("btnMenu").onclick = () => {
        sidebar.classList.add("open");
        overlay.classList.add("visible");
      };

      overlay.onclick = () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("visible");
      };

      function render() {
        const container = document.getElementById("programList");
        const now = new Date();
        now.setHours(0,0,0,0);

        const programData = Array.isArray(window.LECTORES_DATA) ? window.LECTORES_DATA : [];
        let foundNext = false;
        let out = "";

        programData.forEach((month, mi) => {
          out += `<div class="month-sep">
            <div class="month-sep-line"></div>
            <div class="month-sep-label">${month.monthLabel}</div>
            <div class="month-sep-line"></div>
          </div>`;

          const combined = [];
          (month.atalaya || []).forEach(s => combined.push({ ...s, type: s.typeOverride || "atalaya", typeLabel: s.typeLabelOverride || "La Atalaya", day: s.dayOverride || "Dom" }));
          (month.biblico || []).forEach(s => combined.push({ ...s, type: s.typeOverride || "biblico", typeLabel: s.typeLabelOverride || "Est. Bíblico", day: s.dayOverride || "Jue" }));
          combined.sort((a, b) => parseInt(a.date) - parseInt(b.date));

          combined.forEach((item, i) => {
            const itemDate = new Date(month.year, month.monthIdx, parseInt(item.date));
            itemDate.setHours(0,0,0,0);

            const isPast = itemDate < now;
            let isNext = false;
            if (!isPast && !foundNext) {
              isNext = true;
              foundNext = true;
            }

            const delay = (mi * 10 + i) * 0.04;

            out += `
              <div class="lector-card type-${item.type} ${isNext ? "is-next" : ""} ${isPast ? "is-past" : ""}" style="animation-delay:${delay}s">
                <div class="lector-date">
                  <div class="lector-date-dow">${item.day}</div>
                  <div class="lector-date-num">${item.date}</div>
                </div>
                <div class="lector-body">
                  ${isNext ? `<span class="lector-next-badge">● Próxima asignación</span>` : ""}
                  <div class="lector-type-badge">${item.typeLabel}</div>
                  <div class="lector-name">${item.special ? item.title : item.name}</div>
                  ${item.special && item.desc ? `<div class="lector-desc">${item.desc}</div>` : ""}
                </div>
              </div>`;
          });
        });

        container.innerHTML = out;

        setTimeout(() => {
          const next = document.querySelector(".is-next");
          if (next) next.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 400);
      }

      render();
    </script>

    <script src="notificaciones-data.js"></script>
    <script src="notificaciones.js"></script>

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
