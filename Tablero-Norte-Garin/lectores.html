<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Programa de Lectores | Norte Garín</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDark = saved ? saved === "dark" : prefersDark;
        if (useDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <style>
      :root {
        --bg-main: #f1f5f9;
        --bg-card: #ffffff;
        --border: rgba(0, 0, 0, 0.08);
        --brand-atalaya: #3b82f6;
        --brand-biblico: #10b981;
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --header-bg: rgba(241, 245, 249, 0.78);
        --btn-bg: rgba(255, 255, 255, 0.85);
        --shadow: 0 20px 50px rgba(2, 6, 23, 0.12);
        --btn-shadow: 0 10px 25px rgba(2, 6, 23, 0.12);
        --soft: rgba(2, 6, 23, 0.03);
      }

      html.dark {
        --bg-main: #0a0f1d;
        --bg-card: #1a2235;
        --border: rgba(255, 255, 255, 0.06);
        --brand-atalaya: #60a5fa;
        --brand-biblico: #34d399;
        --text-primary: #f8fafc;
        --text-muted: #94a3b8;
        --header-bg: rgba(10, 15, 29, 0.75);
        --btn-bg: rgba(18, 26, 42, 0.78);
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
        --btn-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        --soft: rgba(255, 255, 255, 0.03);
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text-primary);
        margin: 0;
        background-color: var(--bg-main);
      }
      .page-bg {
        min-height: 100vh;
        background-image: radial-gradient(
          900px 520px at 50% -10%,
          rgba(16, 185, 129, 0.18),
          transparent 60%
        );
      }

      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--header-bg);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        padding: 8px;
      }

      .btn-header {
        background: var(--btn-bg);
        border: 1px solid var(--border);
        color: var(--text-primary);
        border-radius: 14px;
        padding: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--btn-shadow);
        transition: transform 0.1s ease;
      }
      .btn-header:active {
        transform: scale(0.95);
      }

      .hero-banner {
        position: relative;
        width: 100%;
        height: 160px;
        border-radius: 26px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .hero-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.8) 0%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.6) 100%
        );
      }

      .month-title-header {
        text-align: center;
        font-weight: 900;
        font-size: 1.1rem;
        color: var(--text-primary);
        margin: 1.5rem 0 1rem;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        opacity: 0.8;
      }

      .card {
        background: var(--bg-card);
        border-radius: 30px;
        margin-bottom: 1rem;
        padding: 1.25rem;
        display: flex;
        align-items: center;
        gap: 1.25rem;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        transition: all 0.2s ease;
      }
      .card.atalaya {
        border-left: 6px solid var(--brand-atalaya);
      }
      .card.biblico {
        border-left: 6px solid var(--brand-biblico);
      }
      .card.special {
        border-left: 6px solid #f59e0b;
      }
      .card.is-current {
        border-left-width: 10px;
        transform: scale(1.02);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.15), var(--shadow);
      }

      .date-box {
        text-align: center;
        min-width: 55px;
      }
      .date-num {
        font-size: 1.8rem;
        font-weight: 900;
        display: block;
        line-height: 1;
      }
      .date-day {
        font-size: 0.7rem;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .tag {
        font-size: 0.6rem;
        font-weight: 900;
        text-transform: uppercase;
        padding: 0.3rem 0.7rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--soft);
        display: inline-block;
        margin-bottom: 4px;
      }
      .name {
        font-weight: 900;
        font-size: 1.1rem;
        letter-spacing: -0.01em;
      }
      .next-label {
        color: #ef4444;
        font-size: 0.6rem;
        font-weight: 900;
        text-transform: uppercase;
        margin-bottom: 2px;
        letter-spacing: 0.08em;
        display: block;
      }

      /* ✅ Sidebar + overlay (igual patrón) */
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
        z-index: 90;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #overlay.show {
        display: block;
        opacity: 1;
      }
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 288px;
        transform: translateX(-110%);
        transition: transform 0.3s ease;
        background: var(--bg-card);
        border-right: 1px solid var(--border);
        z-index: 100;
        box-shadow: var(--shadow);
        padding: 26px;
      }
      #sidebar.open {
        transform: translateX(0);
      }
      .nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 18px;
        color: var(--text-muted);
        text-decoration: none;
        border: 1px solid transparent;
        transition: all 0.2s ease;
        font-weight: 800;
      }
      .nav-link.active {
        background: rgba(16, 185, 129, 0.12);
        color: var(--brand-biblico);
        border-color: rgba(16, 185, 129, 0.22);
      }
    </style>
  </head>

  <body class="page-bg pb-10">
    <!-- ✅ Overlay + Sidebar -->
    <div id="overlay"></div>

    <aside id="sidebar" aria-label="Navegación">
      <div class="flex items-center gap-3 mb-10">
        <div
          class="h-10 w-10 rounded-2xl bg-emerald-500/20 flex items-center justify-center font-black text-emerald-500"
        >
          ✦
        </div>
        <div>
          <h2 class="font-extrabold leading-tight">Norte Garín</h2>
          <p class="text-[10px] opacity-60 uppercase font-bold tracking-widest">
            Digital Board
          </p>
        </div>
      </div>

      <nav class="space-y-2">
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="salidas.html" class="nav-link">Salidas</a>
        <a href="vida-ministerio.html" class="nav-link">Vida y Ministerio</a>
        <a href="conferencias.html" class="nav-link">Discursos</a>
        <a href="multimedia.html" class="nav-link">Multimedia</a>
        <a href="lectores.html" class="nav-link active">Lectores</a>
        <a href="limpieza.html" class="nav-link">Limpieza</a>
        <a href="grupos.html" class="nav-link">Grupos</a>
        <a href="proximos-eventos.html" class="nav-link">Próximos eventos</a>
      </nav>
    </aside>

    <header>
      <div class="max-w-md mx-auto">
        <div class="hero-banner group">
          <img src="img/lectores.png" alt="Lector" />
          <div class="hero-overlay"></div>

          <div class="absolute inset-0 p-4 flex flex-col justify-between">
            <div class="flex justify-between items-center">
              <!-- ✅ Botón menú (reemplaza el volver) -->
              <button id="btnMenu" class="btn-header" aria-label="Menú">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="4" x2="20" y1="6" y2="6"></line>
                  <line x1="4" x2="20" y1="12" y2="12"></line>
                  <line x1="4" x2="20" y1="18" y2="18"></line>
                </svg>
              </button>

              <button onclick="toggleTheme()" class="btn-header" aria-label="Tema">
                <span id="theme-icon">🌙</span>
              </button>
            </div>

            <div class="text-white">
              <h1
                class="text-2xl font-black uppercase tracking-tighter drop-shadow-lg"
              >
                Lectores
              </h1>
              <p
                class="text-[10px] font-black uppercase tracking-[0.2em] text-emerald-400 drop-shadow-md"
              >
                Programa 2026
              </p>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6">
      <section id="programList"></section>
    </main>

    <script>
      const html = document.documentElement;
      const themeIcon = document.getElementById("theme-icon");

      function syncThemeIcon() {
        themeIcon.textContent = html.classList.contains("dark") ? "☀️" : "🌙";
      }
      function toggleTheme() {
        html.classList.toggle("dark");
        localStorage.setItem(
          "theme",
          html.classList.contains("dark") ? "dark" : "light"
        );
        syncThemeIcon();
      }
      syncThemeIcon();

      // ✅ Sidebar
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      document.getElementById("btnMenu").onclick = () => {
        sidebar.classList.add("open");
        overlay.classList.add("show");
      };
      overlay.onclick = () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
      };

      // ✅ Programa (se eliminó ENERO; se dejó FEBRERO y se agregó MARZO)
      const programData = [
        {
          monthLabel: "Febrero 2026",
          year: 2026,
          monthIdx: 1,
          atalaya: [
            { date: "01", name: "MARIO SEGOVIA" },
            { date: "08", name: "HORACIO SALGADO" },
            {
              date: "15",
              special: true,
              title: "VISITA S.C.",
              desc: "Mauricio Tierno",
            },
            { date: "22", name: "DANIEL ALBIS" },
          ],
          biblico: [
            { date: "05", name: "LUCAS SEGOVIA" },
            { date: "19", name: "ADOLFO GUTIERREZ" },
            { date: "26", name: "DIEGO SARRAUTE" },
          ],
        },
        {
          monthLabel: "Marzo 2026",
          year: 2026,
          monthIdx: 2,
          atalaya: [
            {
              date: "01",
              special: true,
              title: "ASAMBLEA DE CIRCUITO",
              desc: "Sin reunión en el salón",
              dayOverride: "Dom",
              typeOverride: "special",
              typeLabelOverride: "Evento",
            },
            { date: "08", name: "ADOLFO GUTIERREZ" },
            { date: "15", name: "LEON SEGOVIA" },
            { date: "22", name: "LUCAS SEGOVIA" },
            { date: "29", name: "DARIO CORTEZ" },
          ],
          biblico: [
            { date: "05", name: "DARIO CORTEZ" },
            { date: "12", name: "HORACIO SALGADO" },
            { date: "19", name: "DANIEL ALBIS" },
            { date: "26", name: "DIEGO SARRAUTE" },
          ],
        },
      ];

      function render() {
        const container = document.getElementById("programList");
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        let htmlOut = "";
        let foundNext = false;

        programData.forEach((month) => {
          htmlOut += `<h2 class="month-title-header">${month.monthLabel}</h2>`;

          const combined = [];

          (month.atalaya || []).forEach((s) =>
            combined.push({
              ...s,
              type: s.typeOverride || "atalaya",
              typeLabel: s.typeLabelOverride || "La Atalaya",
              day: s.dayOverride || "Dom",
            })
          );

          (month.biblico || []).forEach((s) =>
            combined.push({
              ...s,
              type: s.typeOverride || "biblico",
              typeLabel: s.typeLabelOverride || "Estudio Bíblico",
              day: s.dayOverride || "Jue",
            })
          );

          combined.sort((a, b) => parseInt(a.date, 10) - parseInt(b.date, 10));

          combined.forEach((item) => {
            const itemDate = new Date(
              month.year,
              month.monthIdx,
              parseInt(item.date, 10)
            );
            itemDate.setHours(0, 0, 0, 0);

            const isPast = itemDate < now;
            let isNext = false;
            if (!isPast && !foundNext) {
              isNext = true;
              foundNext = true;
            }

            htmlOut += `
              <div class="card ${item.type} ${
              isNext ? "is-current" : ""
            }" style="${isPast ? "opacity:0.35; filter:grayscale(1);" : ""}">
                <div class="date-box">
                  <span class="date-day">${item.day}</span>
                  <span class="date-num">${item.date}</span>
                </div>
                <div class="info">
                  ${
                    isNext
                      ? '<span class="next-label">Próxima asignación</span>'
                      : ""
                  }
                  <span class="tag">${item.typeLabel}</span>
                  <div class="name">${
                    item.special ? item.title : item.name
                  }</div>
                  ${
                    item.special && item.desc
                      ? `<div class="text-xs opacity-60 font-bold mt-1">${item.desc}</div>`
                      : ""
                  }
                </div>
              </div>`;
          });
        });

        container.innerHTML = htmlOut;

        setTimeout(() => {
          const nextItem = document.querySelector(".is-current");
          if (nextItem)
            nextItem.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 450);
      }

      render();
    </script>
  </body>
</html>
