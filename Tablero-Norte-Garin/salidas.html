<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salidas a Predicar | Febrero 2026</title>

    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDark = saved ? saved === "dark" : prefersDark;
        if (useDark) document.documentElement.classList.add("dark");
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-main: #f1f5f9;
        --bg-card: #ffffff;
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --border: rgba(0, 0, 0, 0.08);
        --accent: #3b82f6;
        --shadow: 0 20px 50px rgba(2, 6, 23, 0.12);
        --btn-bg: rgba(255, 255, 255, 0.85);
      }
      html.dark {
        --bg-main: #0a0f1d;
        --bg-card: #121a2a;
        --text-primary: #f8fafc;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.06);
        --accent: #3b82f6;
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
        --btn-bg: rgba(18, 26, 42, 0.82);
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text-primary);
        margin: 0;
        background-color: var(--bg-main);
        padding-bottom: 60px;
      }
      .page-bg {
        min-height: 100vh;
        background-image: radial-gradient(
          900px 520px at 50% -10%,
          rgba(59, 130, 246, 0.16),
          transparent 60%
        );
      }

      .btn-surface {
        background: var(--btn-bg);
        border: 1px solid var(--border);
        color: var(--text-primary);
        box-shadow: 0 10px 25px rgba(2, 6, 23, 0.12);
        backdrop-filter: blur(8px);
        transition: all 0.15s ease;
      }
      .btn-surface:active {
        transform: scale(0.95);
      }

      /* ====== MENÚ (idéntico a index) ====== */
      #sidebar {
        transition: transform 0.3s ease-in-out;
        background: var(--bg-card);
        z-index: 100;
      }
      .nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-radius: 18px;
        color: var(--text-muted);
        transition: all 0.2s ease;
        text-decoration: none;
      }
      .nav-link.active {
        background: rgba(59, 130, 246, 0.12);
        color: var(--accent);
        font-weight: 800;
        border: 1px solid rgba(59, 130, 246, 0.2);
      }

      /* ====== UI de salidas ====== */
      .hero {
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .timeline {
        position: relative;
        max-width: 600px;
        margin: auto;
        padding-right: 1rem;
      }
      .line {
        position: absolute;
        right: 2.2rem;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }
      .day {
        position: relative;
        display: flex;
        flex-direction: row-reverse;
        padding: 1.2rem 0;
        align-items: flex-start;
      }
      .circle {
        position: absolute;
        right: 0.2rem;
        top: 1.25rem;
        width: 4rem;
        height: 4rem;
        border-radius: 22px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
        z-index: 10;
      }
      .is-today .circle {
        background: var(--accent);
        color: white;
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.45);
      }
      .card {
        width: calc(100% - 5rem);
        background: var(--bg-card);
        border-radius: 28px;
        padding: 1.25rem;
        margin-right: 1rem;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .item {
        padding: 0.8rem 0;
        border-bottom: 1px solid var(--border);
      }
      .time {
        font-weight: 900;
        color: var(--accent);
        font-size: 0.9rem;
      }
      .place {
        font-size: 1.1rem;
        font-weight: 900;
      }
      .meta {
        color: var(--text-muted);
        font-size: 0.85rem;
        margin-top: 0.3rem;
      }
      .terr-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.6rem;
      }
      .btn-map {
        font-size: 0.7rem;
        font-weight: 900;
        padding: 0.4rem 0.8rem;
        border-radius: 10px;
        background: rgba(59, 130, 246, 0.1);
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.22);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .special {
        text-align: center;
        font-weight: 900;
        padding: 0.6rem 0;
        border-radius: 15px;
        border: 1px solid var(--border);
        background: rgba(2, 6, 23, 0.03);
      }
      .feriado {
        background: rgba(59, 130, 246, 0.12);
        color: #3b82f6;
        border-color: rgba(59, 130, 246, 0.25);
      }
      .reunion {
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
        border-color: rgba(16, 185, 129, 0.25);
      }
      .divider-card {
        text-align: center;
        font-weight: 900;
        color: var(--accent);
        border: 1px dashed var(--accent);
      }
    </style>
  </head>

  <body class="page-bg">
    <!-- Overlay (idéntico a index) -->
    <div
      id="overlay"
      class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[90] hidden opacity-0 transition-opacity duration-300"
    ></div>

    <!-- Sidebar (idéntico a index, con Salidas activo) -->
    <aside
      id="sidebar"
      class="fixed top-0 left-0 h-full w-72 transform -translate-x-full shadow-2xl p-8"
    >
      <div class="flex items-center gap-3 mb-10">
        <div
          class="h-10 w-10 rounded-2xl bg-blue-500/20 flex items-center justify-center font-black text-blue-500"
        >
          ✦
        </div>
        <div>
          <h2 class="font-extrabold leading-tight">Norte Garín</h2>
          <p class="text-[10px] opacity-60 uppercase font-bold tracking-widest">
            Digital Board
          </p>
        </div>
      </div>

      <nav class="space-y-2">
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="salidas.html" class="nav-link active font-bold">Salidas</a>
        <a href="vida-ministerio.html" class="nav-link">Vida y Ministerio</a>
        <a href="conferencias.html" class="nav-link">Discursos</a>
        <a href="multimedia.html" class="nav-link">Multimedia</a>
        <a href="lectores.html" class="nav-link">Lectores</a>
        <a href="limpieza.html" class="nav-link">Limpieza</a>
        <a href="grupos.html" class="nav-link">Grupos</a>
      </nav>
    </aside>

    <!-- Header de Salidas -->
    <header class="p-2">
      <div
        class="relative w-full h-48 sm:h-56 rounded-[30px] overflow-hidden hero max-w-5xl mx-auto group"
      >
        <img
          src="img/salidas.png"
          class="w-full h-full object-cover transform group-hover:scale-105 transition duration-700"
          alt="Banner"
        />
        <div
          class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-black/60"
        ></div>

        <div class="absolute inset-0 p-5 flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <!-- Menú (idéntico a index) -->
            <button
              id="btnMenu"
              class="btn-surface p-3 rounded-2xl active:scale-90"
              aria-label="Menú"
              title="Menú"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="4" x2="20" y1="12" y2="12" />
                <line x1="4" x2="20" y1="6" y2="6" />
                <line x1="4" x2="20" y1="18" y2="18" />
              </svg>
            </button>

            <!-- Mapa del territorio (PNG, como pediste antes) -->
            <a
              href="TERRITORIOGARIN.png"
              target="_blank"
              class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-blue-600/90 text-white shadow-lg active:scale-95 transition border border-white/10"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21" />
                <line x1="9" y1="3" x2="9" y2="18" />
                <line x1="15" y1="6" x2="15" y2="21" />
              </svg>
              <span class="text-[10px] font-black uppercase tracking-wider"
                >Mapa</span
              >
            </a>

            <!-- Tema (idéntico a index) -->
            <button
              id="btnTheme"
              class="btn-surface p-3 rounded-2xl active:scale-90"
              aria-label="Tema"
              title="Tema"
            >
              <span id="theme-icon">🌙</span>
            </button>
          </div>

          <div class="text-white">
            <h1
              class="text-3xl font-black tracking-tighter uppercase leading-none drop-shadow-md"
            >
              Salidas
            </h1>
            <p
              class="font-bold text-[10px] uppercase tracking-[0.2em] mt-1 text-blue-300 drop-shadow-md"
            >
              Febrero 2026
            </p>
          </div>
        </div>
      </div>
    </header>

    <main class="timeline px-4 mt-4">
      <div class="line"></div>
      <div id="grid"></div>
    </main>

    <script src="salidas-data.js"></script>
    <script>
      // ===== Tema (idéntico a index) =====
      const html = document.documentElement;
      const themeIcon = document.getElementById("theme-icon");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      function toggleTheme() {
        html.classList.toggle("dark");
        localStorage.setItem(
          "theme",
          html.classList.contains("dark") ? "dark" : "light"
        );
        themeIcon.textContent = html.classList.contains("dark") ? "☀️" : "🌙";
      }
      document.getElementById("btnTheme").onclick = toggleTheme;

      // ===== Menú (idéntico a index) =====
      document.getElementById("btnMenu").onclick = () => {
        sidebar.classList.replace("-translate-x-full", "translate-x-0");
        overlay.classList.remove("hidden");
        setTimeout(() => overlay.classList.add("opacity-100"), 10);
      };
      overlay.onclick = () => {
        sidebar.classList.replace("translate-x-0", "-translate-x-full");
        overlay.classList.remove("opacity-100");
        setTimeout(() => overlay.classList.add("hidden"), 300);
      };

      // ===== Render Salidas =====
      function terrHtml(t) {
        const arr = window.SALIDAS_CAL.parseTerr(t);
        if (!arr.length) return "";
        return `<div class="terr-wrap">${arr
          .map(
            (n) =>
              `<a class="btn-map" href="${window.SALIDAS_CAL.territoryUrl(
                n
              )}" target="_blank" rel="noopener">🗺️ T-${n}</a>`
          )
          .join("")}</div>`;
      }

      function item(e) {
        if (e.type) {
          const cls = e.type === "feriado" ? "feriado" : "reunion";
          return `<div class="special ${cls}">${e.l}</div>`;
        }

        const mapaBtn = e.maps
          ? `<a class="btn-map" href="${e.maps}" target="_blank" rel="noopener">📍 Ver ubicación</a>`
          : "";

        return `<div class="item">
          <div class="time">${e.h} hs</div>
          <div class="place">${e.l}</div>
          <div class="meta">
            Conduce: <span style="color: var(--text-primary); font-weight: 900;">${
              e.c || ""
            }</span>
            ${mapaBtn ? `<span class="ml-2">${mapaBtn}</span>` : ""}
          </div>
          ${terrHtml(e.t)}
        </div>`;
      }

      function dividerMonth(y, m) {
        const meses = [
          "ENE",
          "FEB",
          "MAR",
          "ABR",
          "MAY",
          "JUN",
          "JUL",
          "AGO",
          "SEP",
          "OCT",
          "NOV",
          "DIC",
        ];
        return `<div class="day">
          <div class="card divider-card uppercase tracking-widest text-xs py-2">${meses[m - 1]} ${y}</div>
          <div class="circle"><span class="text-xs font-black">${
            meses[m - 1]
          }</span></div>
        </div>`;
      }

      function block(monthNum, dayNum, L, arr) {
        return `<div class="day" data-m="${monthNum}" data-d="${dayNum}">
          <div class="card">${arr.map(item).join("")}</div>
          <div class="circle">
            <span class="text-[10px] font-black uppercase opacity-60 leading-none mb-1">${L.w}</span>
            <span class="text-xl font-black leading-none">${dayNum}</span>
          </div>
        </div>`;
      }

      function markToday() {
        const now = new Date();
        const m = now.getMonth() + 1;
        const d = now.getDate();
        const el = document.querySelector(`.day[data-m="${m}"][data-d="${d}"]`);
        if (el) {
          el.classList.add("is-today");
          setTimeout(() => {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
          }, 450);
        }
      }

      function render() {
        const g = document.getElementById("grid");
        if (!window.SALIDAS_CAL || !Array.isArray(window.SALIDAS_CAL.CALENDARIO)) {
          g.innerHTML = '<div class="card">No se pudo cargar el calendario.</div>';
          return;
        }

        const months = [...window.SALIDAS_CAL.CALENDARIO].sort(
          (a, b) => a.y - b.y || a.m - b.m
        );

        let htmlOut = "";
        let lastYM = "";

        months.forEach((M) => {
          const ym = `${M.y}-${M.m}`;
          if (ym !== lastYM) htmlOut += dividerMonth(M.y, M.m);
          lastYM = ym;

          Object.keys(M.d || {})
            .sort((a, b) => a - b)
            .forEach((d) => {
              htmlOut += block(
                M.m,
                d,
                window.SALIDAS_CAL.label(M.y, M.m, d),
                M.d[d]
              );
            });
        });

        g.innerHTML = htmlOut;
        markToday();
      }

      document.addEventListener("DOMContentLoaded", render);
    </script>
  </body>
</html>
